  function tpgSetting(id, val) {
    const key = { tpgBoot: "boot", tpgBlind: "blindRounds", tpgLimit: "potLimit", tpgMax: "maxChaal", tpgQuiet: "quietRounds", tpgTimer: "turnSecs", tpgVariant: "variant" }[id];
    if (!key) return;
    callTpg("settings", { key, value: key === "variant" ? val : Math.max(0, Math.round(Number(val)) || 0) }).then(() => render());
  }

  // ---------- King Fuck Off (online, host phone deals) ----------
  // One card each, three lives each. In turn, players Stay or Swap with the next player clockwise; a King
  // blocks the swap ("Fuck Off!"). The dealer acts last and may swap for the top card of the deck instead.
  // Lowest final card loses a life (ties: extra cards to the tied players until one is uniquely lowest).
  // Last player with lives left wins. State: T.kfo = { game, lives, dealer, over, winner, round }.
  const KFO = { name: "King Fuck Off", desc: "One card each, 3 lives. Stay or swap with the next player; a King blocks the swap. Lowest card loses a life. Last one standing wins." };
  const kfoRank = (c) => parseCard(c).r;              // A = 14 high, 2 low; suits never matter
  const kfoAlive = () => T.seats.map((s) => s.uid).filter((u) => T.kfo && (T.kfo.lives[u] || 0) > 0);
  function kfoNextAlive(after) {
    const ids = T.seats.map((s) => s.uid), i = ids.indexOf(after);
    for (let k = 1; k <= ids.length; k++) { const u = ids[(Math.max(i, -1) + k) % ids.length]; if ((T.kfo.lives[u] || 0) > 0) return u; }
    return null;
  }
  function kfoDraw() {
    if (!SEC.deck || !SEC.deck.length) {
      // draw pile ran out: reshuffle every card that isn't in an active player's hand
      const held = new Set(Object.values(SEC.hands).map((h) => h[0]));
      SEC.deck = shuffledDeck().filter((c) => !held.has(c));
    }
    return SEC.deck.pop();
  }

  function startKfo() {
    if (T.hand && !T.hand.result) return "Finish the current round first";
    let K = T.kfo;
    if (!K || K.over) {
      const ids = T.seats.map((s) => s.uid);
      if (ids.length < 3) return "King Fuck Off needs at least 3 players";
      const r = new Uint32Array(1); crypto.getRandomValues(r);
      K = T.kfo = { game: ((K && K.game) || 0) + 1, lives: Object.fromEntries(ids.map((u) => [u, 3])), over: false, winner: null, round: 0, dealer: ids[r[0] % ids.length] };
    } else {
      K.dealer = kfoNextAlive(K.dealer);
    }
    const alive = kfoAlive();
    if (alive.length < 2) return "Not enough players left with lives";
    if (!alive.includes(K.dealer)) K.dealer = kfoNextAlive(K.dealer);
    const d = alive.indexOf(K.dealer);
    const order = alive.slice(d + 1).concat(alive.slice(0, d + 1));   // left of the dealer first, dealer last
    const deck = shuffledDeck();
    const hands = {};
    order.forEach((u) => { hands[u] = [deck.pop()]; });
    const n = ((T.hand && T.hand.n) || 0) + 1;
    K.round += 1;
    SEC = { n, hands, deck };
    SECRET.set(SEC).catch(() => {});
    T.hand = { kind: "kfo", variant: "kfo", n, round: K.round, order, dealer: K.dealer, turn: order[0], acted: {}, kings: {}, left: {}, log: [], result: null, turnAt: Date.now() };
    T.status = "hand";
    order.forEach((u) => HANDS.doc(u).set({ n, cards: hands[u], peek: null }).catch(() => {}));
    tpgLog(null, `Game ${K.game}, round ${K.round}. ${nameOf(K.dealer)} deals and plays last.`);
    return null;
  }

  function kfoAdvance(from) {
    const H = T.hand, i = H.order.indexOf(from);
    for (let j = i + 1; j < H.order.length; j++) { const u = H.order[j]; if (!H.left[u]) { H.turn = u; return; } }
    kfoReveal();
  }
  const kfoNext = (uid) => {           // next player clockwise who is still in this round (wraps to the start)
    const o = T.hand.order, i = o.indexOf(uid);
    for (let k = 1; k < o.length; k++) { const u = o[(i + k) % o.length]; if (!T.hand.left[u]) return u; }
    return null;
  };

  function kfoMove(uid, m) {
    const H = T.hand;
    if (H.result) return "This round is over";
    if (!SEC || SEC.n !== H.n) return "The dealer lost track of this round's cards. Ask the host to deal again.";
    if (H.turn !== uid) return `It's ${nameOf(H.turn)}'s turn`;
    const isDlr = uid === H.dealer;
    if (m.type === "stay") {
      H.acted[uid] = "stay"; tpgLog(uid, "stayed");
    } else if (m.type === "swap") {
      if (isDlr) return "The dealer can stay or swap with the deck";
      const to = kfoNext(uid);
      const theirs = SEC.hands[to][0];
      if (kfoRank(theirs) === 13) {
        H.kings[to] = theirs; H.acted[uid] = "blocked";
        tpgLog(to, `showed a King to ${nameOf(uid)}: “Fuck Off!”`);
      } else {
        const mine = SEC.hands[uid][0];
        SEC.hands[uid] = [theirs]; SEC.hands[to] = [mine];
        writeHand(uid, { n: H.n, cards: [theirs] }); writeHand(to, { n: H.n, cards: [mine] });
        H.acted[uid] = "swap"; tpgLog(uid, `swapped cards with ${nameOf(to)}`);
      }
    } else if (m.type === "draw") {
      if (!isDlr) return "Only the dealer can swap with the deck";
      const c = kfoDraw();
      SEC.hands[uid] = [c]; writeHand(uid, { n: H.n, cards: [c] });
      H.acted[uid] = "draw"; tpgLog(uid, "swapped their card for the top of the deck");
    } else return "In King Fuck Off you can only stay or swap";
    SECRET.set(SEC).catch(() => {});
    kfoAdvance(uid);
    return null;
  }

  function kfoReveal() {
    const H = T.hand, K = T.kfo;
    const inRound = H.order.filter((u) => !H.left[u]);
    const final = Object.fromEntries(inRound.map((u) => [u, SEC.hands[u][0]]));
    const low = Math.min(...inRound.map((u) => kfoRank(final[u])));
    let tied = inRound.filter((u) => kfoRank(final[u]) === low);
    const tiebreaks = [];
    while (tied.length > 1) {
      const extra = {};
      tied.forEach((u) => { extra[u] = kfoDraw(); });
      tiebreaks.push(extra);
      const m = Math.min(...tied.map((u) => kfoRank(extra[u])));
      tied = tied.filter((u) => kfoRank(extra[u]) === m);
    }
    const loser = tied[0];
    K.lives[loser] = Math.max(0, (K.lives[loser] || 0) - 1);
    const eliminated = K.lives[loser] === 0;
    const still = kfoAlive();
    if (still.length <= 1) { K.over = true; K.winner = still[0] || null; }
    H.result = { final, tiebreaks, loser, eliminated, winner: K.over ? K.winner : null, winners: K.over && K.winner ? [K.winner] : [] };
    H.turn = null;
    tpgLog(loser, `had the lowest card and lost a life${eliminated ? " (out of the game)" : ""}`);
    if (K.over && K.winner) tpgLog(K.winner, "is the last one standing and wins the game");
    SECRET.set(SEC).catch(() => {});
  }

  // ---- screens ----
  const hearts = (n) => "♥".repeat(Math.max(0, n)) + "♡".repeat(Math.max(0, 3 - n));
  function kfoTableHTML(t, H) {
    const K = t.kfo || { lives: {} };
    const R = H.result;

    const seatHTML = seats.map((u, i) => {
      const ang = (90 + (i * 360) / n) * Math.PI / 180;

      pos[u] = { x: x.toFixed(2), y: y.toFixed(2) };
      const lives = K.lives[u] || 0;
      const inRound = H.order.includes(u) && !H.left[u];
      const turn = !R && H.turn === u;
      const card = R && R.final[u] ? R.final[u] : H.kings[u] || null;
      const lost = R && R.loser === u;
      const status = !inRound ? (lives ? "Next round" : "Out") : R ? (lost ? "Lost a life" : "Safe") : H.acted[u] ? { stay: "Stayed", swap: "Swapped", blocked: "Blocked", draw: "Drew" }[H.acted[u]] : "";
      return `<div class="seat ${turn ? "turn" : ""} ${!lives || !inRound ? "out" : ""} ${R && R.winner === u ? "won" : ""} ${user && u === user.uid ? "me" : ""}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%">
        <div class="minis">${inRound ? (card ? miniCard(parseCard(card)) : `<span class="mc back"></span>`) : ""}</div>
        <div class="av">${turn ? ringHTML(t, H) : ""}${botSeat(u) ? "🤖" : esc((nameOf(u)[0] || "?").toUpperCase())}${u === H.dealer ? `<i class="dpuck" title="Dealer">D</i>` : ""}</div>
        <div class="lbl"><b>${esc(nameOf(u))}</b><small class="hearts ${lost ? "hit" : ""}">${hearts(lives)}${status ? " · " + status : ""}</small></div>

    }).join("");
    const last = H.log.length ? H.log[H.log.length - 1] : null;
    const center = R && !R.cancelled ? kfoCenter(H, R) : `<span class="k">King Fuck Off</span><b class="kfoRound num">Round ${H.round}</b>
      ${!R && H.turn ? `<span class="turnline">${user && H.turn === user.uid ? "Your turn" : esc(nameOf(H.turn)) + "'s turn"}</span>` : ""}
      ${R ? `<span class="turnline">${R.cancelled ? "Round cancelled" : R.winner ? esc(nameOf(R.winner)) + " wins the game!" : esc(nameOf(R.loser)) + " loses a life"}</span>` : ""}
      ${last ? `<em>${last.who ? esc(last.who) + " " : ""}${esc(last.text)}</em>` : ""}`;
    return `<div class="felt ${n > 9 ? "crowd" : ""} ${R && !R.cancelled ? "showdown kfo" : ""}" role="img" aria-label="King Fuck Off table with ${n} players">
      <div class="rail"></div><div class="center">${center}</div>${bets}${seatHTML}${fxLayer(pos)}${tableTools()}</div>`;
  }

  function kfoMyArea(t, H) {
    const R = H.result;
    const card = myHand && myHand.n === H.n && myHand.cards ? parseCard(myHand.cards[0]) : null;
    const busy = myPending ? "disabled" : "";
    const isDlr = H.dealer === user.uid;

    if (!R) {
      if (H.turn === user.uid) {

          <button class="btn ghost" data-act="kfostay" ${busy}>Stay</button>
          ${isDlr ? `<button class="btn brass" data-act="kfodraw" ${busy}>Swap with deck</button>`
                  : `<button class="btn brass" data-act="kfoswap" ${busy}>Swap with ${esc(nameOf(to))}</button>`}</div>
          <p class="sheetnote center">${isDlr ? "You're the dealer: your new card from the deck is final." : `If ${esc(nameOf(to))} has a King, they'll block it.`}</p>`;
      } else if (H.acted[user.uid]) {
        acts = `<p class="sheetnote center">You ${{ stay: "stayed", swap: "swapped", blocked: "were blocked by a King", draw: "swapped with the deck" }[H.acted[user.uid]]}. Waiting for ${esc(nameOf(H.turn))}…</p>`;
      } else {

    }
    return `<div class="card myhand ${H.turn === user.uid && !R ? "myturn" : ""}">
      <div class="cardhead"><b>Your card</b><span class="hearts">${hearts((t.kfo && t.kfo.lives[user.uid]) || 0)}</span></div>
      <div class="tpcards big">${card ? cardHTML(card, false, 0, false) : backHTML()}</div>
      ${acts ? `<div class="tpgacts">${acts}</div>` : ""}</div>`;
  }

  function kfoResultHTML(t, H) {
    const R = H.result, K = t.kfo || { lives: {} };
    if (R.cancelled) return `<div class="winbanner dealing"><span>Cancelled</span><b>Hand cancelled</b><small>The host cancelled it. Nobody won or lost anything.</small></div>`;
    const ids = Object.keys(R.final).sort((a, b) => kfoRank(R.final[b]) - kfoRank(R.final[a]));
    let h = `<div class="winbanner"><span>${R.winner ? "Winner · last one standing" : "Round " + H.round}</span>
      <b>${R.winner ? esc(nameOf(R.winner)) : esc(nameOf(R.loser)) + " loses a life"}</b>
      <small>${R.winner ? `${esc(nameOf(R.loser))} lost their last life` : R.eliminated ? `${esc(nameOf(R.loser))} is out of the game` : `${hearts(K.lives[R.loser] || 0)} left`}</small></div>`;
    h += `<div class="card tphands">` + ids.map((u) => {
      const tb = R.tiebreaks.map((x) => x[u]).filter(Boolean);
      return `<div class="tprow ${u === R.loser ? "lowwin" : ""}"><span class="rank num">${u === R.loser ? "−1" : "✓"}</span>
        <div class="tpwho"><b>${esc(nameOf(u))}</b><small>${u === R.loser ? "Lowest card" : "Safe"}${tb.length ? " · tie-break " + tb.map((c) => rn(parseCard(c).r)).join(", ") : ""}</small></div>
        <div class="tpcards">${cardHTML(parseCard(R.final[u]), false, 0, false)}${tb.map((c) => cardHTML(parseCard(c), false, 0, false, "unused")).join("")}</div></div>`;

  // ---------- live table extras: turn timer, reactions, chat, sounds, table effects ----------
  // ---- sound (synthesised, so there are no files to load). Browsers only allow audio after the first tap.
  const SND = (() => {
    let ctx = null, muted = false;
    try { muted = localStorage.getItem("chipbank.mute") === "1"; } catch (e) {}
    const ac = () => {
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      return ctx;
    };
    function tone(freq, dur, type, vol, when) {
      const a = ac(); if (!a || muted) return;
      const t0 = a.currentTime + (when || 0);
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.1, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
    }
    return {
      unlock: () => { if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {}); },
      chip: () => { tone(2100, 0.05, "square", 0.035); tone(2800, 0.05, "square", 0.03, 0.045); },
      card: () => { tone(420, 0.07, "triangle", 0.07); tone(760, 0.06, "triangle", 0.05, 0.05); },
      turn: () => { tone(880, 0.13, "sine", 0.13); tone(1320, 0.2, "sine", 0.13, 0.13); },
      tick: () => tone(1250, 0.04, "square", 0.03),
      pop: () => tone(660, 0.09, "sine", 0.08),
      win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, "triangle", 0.1, i * 0.11)),
      lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.22, "sine", 0.08, i * 0.12)),
      toggle: () => { muted = !muted; try { localStorage.setItem("chipbank.mute", muted ? "1" : "0"); } catch (e) {} if (!muted) ac(); return muted; },
      get muted() { return muted; },
    };
  })();
  document.addEventListener("pointerdown", () => SND.unlock(), { passive: true });
  const playVisible = () => (mode === "owner" ? tab === "play" : liveTab === "play") && !document.hidden;

  // ---- turn timer. The dealer stamps H.turnAt (dealer clock) whenever the turn or a sideshow question changes.
  // Other phones correct for clock difference using the gap between the dealer's write time and arrival.
  const turnSecsOf = (st) => (st && st.turnSecs != null ? Number(st.turnSecs) : 30);
  let clockSkew = 0, skewSeen = false;
  // The table doc's first snapshot can be minutes old, so it says nothing about clock difference: skip it.
  // Best source: the server clock that comes back with every call (stampSkew).
  let skewFirst = true;
  function stampSkew(t0, res) {
    const sn = res && res.data && res.data.now;
    if (sn) { clockSkew = (t0 + Date.now()) / 2 - sn; skewSeen = true; }
  }
  function noteSkew(r) {
    if (skewFirst) { skewFirst = false; return; }
    if (!r || !r.updatedAt || isDealer()) { if (isDealer()) clockSkew = 0; return; }
    const est = Date.now() - r.updatedAt;
    if (!skewSeen || est < clockSkew) { clockSkew = est; skewSeen = true; }
  }
  const turnKey = () => { const H = T && T.hand; return H ? [H.n, H.turn, H.side ? H.side.to : "", H.result ? 1 : 0].join("|") : ""; };
  function stampTurn(before) { const H = T && T.hand; if (H && turnKey() !== before) H.turnAt = Date.now(); }
  const whoActs = (H) => (!H || H.result ? null : H.side ? H.side.to : H.turn);
  function timeLeft(t, H) {
    const secs = turnSecsOf(t.settings);
    if (!secs || !H || H.result || !H.turnAt) return null;
    return Math.max(0, secs * 1000 - (Date.now() - clockSkew - H.turnAt));
  }
  const ringHTML = (t, H) => (turnSecsOf(t.settings) && H && H.turnAt
    ? `<svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" pathLength="100"></circle></svg>` : "");
  // Nudge the server dealer: when a CPU is to act, or a player's timer has run out, any phone at the table asks the
  // server to move things on. The server checks the time itself, so early or duplicate nudges do nothing.
  let lastNudge = 0;
  setInterval(() => {
    if (!user || !T || !T.hand || T.hand.result || document.hidden) return;
    const H = T.hand, who = whoActs(H); if (!who) return;
    if (!T.seats.some((x) => x.uid === user.uid) && !canAdmin()) return;
    const el = Date.now() - clockSkew - (H.turnAt || 0);
    const secs = turnSecsOf(T.settings);
    const due = botSeat(who) ? el > 1300 : !!secs && el > secs * 1000 + 1200;
    if (!due || Date.now() < lastNudge) return;
    lastNudge = Date.now() + 2200 + Math.random() * 900;     // spread the phones out
    const t0 = Date.now();
    if (!ROOM) return;
    fnTpg({ action: "tick", room: ROOM }).then((r) => stampSkew(t0, r)).catch(() => {});
  }, 500);
  // countdown ring and numbers update in place, without redrawing the table
  let lastTickSec = null;
  setInterval(() => {
    if (!playVisible() || !T || !T.hand) return;
    const H = T.hand, left = timeLeft(T, H);
    if (left == null) return;
    const secs = turnSecsOf(T.settings), frac = left / (secs * 1000);
    document.querySelectorAll(".seat.turn .ring circle").forEach((c) => {
      c.style.strokeDashoffset = String(100 - frac * 100);
      c.style.stroke = frac > 0.5 ? "#7ef0b8" : frac > 0.25 ? "#f8c94c" : "#ff6b6b";
    });
    const s = Math.ceil(left / 1000);
    document.querySelectorAll("[data-countdown]").forEach((el) => { el.textContent = s + "s"; el.classList.toggle("low", s <= 5); });
    if (user && whoActs(H) === user.uid && s <= 5 && s > 0 && s !== lastTickSec) { lastTickSec = s; SND.tick(); }
  }, 200);

  // ---- table effects: action badges over seats, chips sliding into the pot, reactions and chat bubbles.
  // Effects remember when they started so a redraw continues the animation instead of restarting it.
  const FX = { badges: {}, chips: [], bubbles: {}, reacts: {}, payout: null };
  let fxSeen = null;
  function tagOf(text) {
    const amt = (text.match(/₹[\d,]+/) || [""])[0];
    const rules = [
      [/^raised blind/, "RAISE " + amt, 1], [/^blind/, "BLIND " + amt, 1], [/^raised, chaal/, "RAISE " + amt, 1], [/^chaal/, "CHAAL " + amt, 1],
      [/^saw their cards/, "SEEN", 0], [/^packed|^left the table/, "PACK", 0], [/^asked .* for a show/, "SHOW!", 1],
      [/^asked .* for a sideshow/, "SIDESHOW?", 1], [/^declined/, "NO SIDESHOW", 0], [/^ran out of time/, "TIME UP", 0],
      [/^stayed/, "STAY", 0], [/^swapped cards/, "SWAP", 0], [/^swapped their card/, "NEW CARD", 0], [/^showed a King/, "FUCK OFF! 👑", 0],
    ];
    for (const [re, label, bet] of rules) if (re.test(text)) return { label, bet: !!bet };
    return null;
  }
  // called on every render: anything new in the hand log becomes an effect (and a sound)
  function fxScan() {
    const H = T && T.hand;
    if (!H) { fxSeen = null; return; }
    const key = H.n;
    if (!fxSeen || fxSeen.n !== key) {
      const fresh = fxSeen !== null;                     // a new hand while watching, not the page opening
      fxSeen = { n: key, len: fresh ? 0 : H.log.length, result: fresh ? false : !!H.result, turn: null };
      if (fresh && playVisible()) SND.card();
    }
    const now = Date.now();
    for (let i = fxSeen.len; i < H.log.length; i++) {
      const e = H.log[i]; if (!e.uid) continue;
      const tg = tagOf(e.text); if (!tg) continue;
      const prev = FX.badges[e.uid];
      if (!(prev && prev.at === now && prev.label === "TIME UP")) FX.badges[e.uid] = { label: tg.label, at: now };
      if (tg.bet) { FX.chips.push({ uid: e.uid, at: now }); if (playVisible()) SND.chip(); }
      else if (playVisible() && tg.label === "SEEN") SND.card();
    }
    fxSeen.len = H.log.length;
    if (H.result && !fxSeen.result) {
      fxSeen.result = true;
      const winners = H.result.winners || [];
      FX.payout = { winners, at: now };
      if (playVisible() && user) { if (winners.includes(user.uid)) SND.win(); else if (H.result.loser === user.uid || (H.p && H.p[user.uid])) SND.lose(); }
    }
    const turnNow = whoActs(H);
    if (turnNow !== fxSeen.turn) {
      fxSeen.turn = turnNow;
      if (user && turnNow === user.uid && playVisible()) { SND.turn(); try { if (navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate && navigator.vibrate(120); } catch (e) {} }
    }
    FX.chips = FX.chips.filter((c) => now - c.at < 900);
  }
  const since = (at) => Date.now() - at;
  function fxLayer(pos) {
    const now = Date.now();
    let h = `<div class="fx">`;
    for (const [u, b] of Object.entries(FX.badges)) {
      if (now - b.at > 2600 || !pos[u]) continue;
      h += `<span class="badge" style="left:${pos[u].x}%;top:${pos[u].y}%;animation-delay:-${since(b.at)}ms">${esc(b.label)}</span>`;
    }
    for (const c of FX.chips) {
      if (!pos[c.uid]) continue;
      h += `<span class="flychip" style="--sx:${pos[c.uid].x}%;--sy:${pos[c.uid].y}%;animation-delay:-${since(c.at)}ms"></span>`;
    }
    if (FX.payout && now - FX.payout.at < 1600) {
      FX.payout.winners.forEach((u) => { if (pos[u]) for (let k = 0; k < 4; k++) h += `<span class="flychip out" style="--ex:${pos[u].x}%;--ey:${pos[u].y}%;animation-delay:${k * 90 - since(FX.payout.at)}ms"></span>`; });
    }
    for (const [u, b] of Object.entries(FX.reacts).concat(Object.entries(FX.bubbles))) {
      if (!pos[u]) continue;
      const life = b.kind === "react" ? 2600 : 4500;
      if (now - b.at > life) continue;
      h += b.kind === "react"
        ? `<span class="react" style="left:${pos[u].x}%;top:${pos[u].y}%;animation-delay:-${since(b.at)}ms">${esc(b.text)}</span>`
        : `<span class="speech ${pos[u].y < 50 ? "below" : ""}" style="left:${pos[u].x}%;top:${pos[u].y}%;animation-delay:-${since(b.at)}ms">${esc(b.text)}</span>`;
    }
    return h + `</div>`;
  }
  // redraw once effects expire so they leave the screen
  let fxTimer = null;
  function fxLater(ms) { clearTimeout(fxTimer); fxTimer = setTimeout(() => { if (playVisible()) render(); }, ms); }

  // ---- reactions and chat (chipbank tpg_chat: one doc per message; anyone signed in can post as themselves)
  // CHAT (the open room's chat collection) is set by openRoom()
  let chatMsgs = [], chatSeenIds = null, chatOpen = false, reactOpen = false, chatUnread = 0;
  const REACTS = ["👍", "😂", "😮", "😡", "🔥", "👏", "😭", "🙏", "🤑", "💀"];
  const PHRASES = ["Nice hand!", "Bluff!", "Chal chal, jaldi!", "Pack kar de 😄", "All the best", "Seen? 👀", "Too good!", "One more round"];
  function chatConnect() {
    if (!CHAT) return;
    chatUnsub = CHAT.orderBy("ts", "desc").limit(40).onSnapshot((qs) => {
      const docs = qs.docs.map((d) => Object.assign({ id: d.id }, d.data())).reverse();
      const first = chatSeenIds === null;
      if (first) chatSeenIds = new Set();
      docs.forEach((m) => {
        if (chatSeenIds.has(m.id)) return;
        chatSeenIds.add(m.id);
        if (first) return;                                  // only messages that arrive while the page is open animate
        if (user && m.uid === user.uid) return;             // my own: already shown the moment I sent it
        (m.kind === "react" ? FX.reacts : FX.bubbles)[m.uid] = { kind: m.kind, text: m.text, at: Date.now() };
        if (m.kind === "chat" && !chatOpen && !(user && m.uid === user.uid)) chatUnread++;
        if (playVisible()) SND.pop();
        fxLater(m.kind === "react" ? 2700 : 4600);
      });
      chatMsgs = docs.filter((m) => m.kind === "chat");
      if (chatOpen) drawChatList();
      if (playVisible()) render();
    }, () => {});
  }
  function myTableName() { const s = T && T.seats.find((x) => user && x.uid === user.uid); return s ? s.name : cleanName((user && user.displayName || "Player").split(" ")[0]); }
  function sendChat(kind, text) {
    if (!user) { toast("Sign in to chat and react"); return; }
    text = String(text || "").trim().slice(0, 140);
    if (!text) return;
    (kind === "react" ? FX.reacts : FX.bubbles)[user.uid] = { kind, text, at: Date.now() };   // show it straight away on my own screen
    fxLater(kind === "react" ? 2700 : 4600);
    render();
    if (!CHAT) return;
    CHAT.add({ uid: user.uid, name: myTableName(), text, kind, ts: Date.now() }).catch(() => toast("Couldn't send that. Check your connection."));
  }
  function drawChatList() {
    const el = document.getElementById("chatList"); if (!el) return;
    el.innerHTML = chatMsgs.length ? chatMsgs.map((m) => `<div class="cmsg ${user && m.uid === user.uid ? "mine" : ""}"><b>${esc(m.name || "Someone")}</b><span>${esc(m.text)}</span><i class="num">${fmtTime(m.ts)}</i></div>`).join("")
      : `<p class="sheetnote center">No messages yet. Say hi to the table.</p>`;
    el.scrollTop = el.scrollHeight;
  }
  function openChat() {
    chatOpen = true; chatUnread = 0; reactOpen = false;
    const root = $("#sheetRoot");

        <div class="chatlist" id="chatList"></div>
        <div class="phrases">${PHRASES.map((p) => `<button class="pick" data-phrase="${esc(p)}">${esc(p)}</button>`).join("")}</div>
        <form class="addrow" id="chatForm" autocomplete="off">
          <input type="text" id="chatInput" maxlength="140" placeholder="${user ? "Message the table" : "Sign in to chat"}" aria-label="Message" ${user ? "" : "disabled"} enterkeyhint="send">
          <button class="btn brass" type="submit" ${user ? "" : "disabled"}>Send</button>
        </form>
      </div>`;
    drawChatList();
    root.onclick = (ev) => {
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; chatOpen = false; render(); return; }
      const ph = ev.target.closest("[data-phrase]"); if (ph) sendChat("chat", ph.dataset.phrase);
    };
    root.oninput = null;
    root.onsubmit = (ev) => { ev.preventDefault(); const i = $("#chatInput"); sendChat("chat", i.value); i.value = ""; i.focus(); };

  function tableTools() {
    return `<div class="tabletools">
        <button class="ttool" data-act="snd" aria-label="${SND.muted ? "Turn sound on" : "Turn sound off"}">${SND.muted ? "🔇" : "🔊"}</button>

        <button class="ttool" data-act="chat" aria-label="Open chat">💬${chatUnread ? `<i class="unread num">${chatUnread > 9 ? "9+" : chatUnread}</i>` : ""}</button>
      </div>
      ${reactOpen ? `<div class="reactbar" role="menu">${REACTS.map((r) => `<button data-react="${r}" role="menuitem" aria-label="React ${r}">${r}</button>`).join("")}</div>` : ""}`;
  }

  // ---------- share sheet ----------
  function openShareSheet() {

  // ---------- math ----------
  function playerTotals(p) {
    const taken = p.ins.reduce((a, b) => a + b.amt, 0);
    const paid = p.ins.reduce((a, b) => a + (b.paid ? b.amt : 0), 0);
    const unpaid = p.ins.reduce((a, b) => a + (!b.initial && !b.paid ? b.amt : 0), 0);
    return { taken, paid, unpaid };
  }
  function calc(g = S.game) {
    const rows = g.players.slice().sort((a, b) => byName(a.name, b.name)).map((p) => {
      const t = playerTotals(p);
      const entered = p.chips !== "" && p.chips != null && !isNaN(Number(p.chips));
      const chips = entered ? Number(p.chips) : 0;
      const net = chips - t.taken;           // won / lost at the table
      const settle = net + t.paid;           // what changes hands now
      return { p, ...t, entered, chips, net, settle };
    });
    const sumIn = rows.reduce((a, r) => a + r.taken, 0);
    const sumChips = rows.reduce((a, r) => a + r.chips, 0);
    const bankCash = rows.reduce((a, r) => a + r.paid, 0);
    const allEntered = rows.length > 0 && rows.every((r) => r.entered);
    return { rows, sumIn, sumChips, bankCash, allEntered, diff: sumChips - sumIn };
  }
  function transfers(c) {
    const BANK = "Bank (cash you hold)";
    const pay = [], get = [];
    c.rows.forEach((r) => {
      if (r.settle < -0.5) pay.push({ name: r.p.name, amt: -r.settle });
      else if (r.settle > 0.5) get.push({ name: r.p.name, amt: r.settle });
    });
    if (c.bankCash > 0) pay.push({ name: BANK, amt: c.bankCash });
    pay.sort((a, b) => b.amt - a.amt); get.sort((a, b) => b.amt - a.amt);
    const out = [];
    let i = 0, j = 0;
    while (i < pay.length && j < get.length) {
      const m = Math.min(pay[i].amt, get[j].amt);
      if (m > 0.5) out.push({ from: pay[i].name, to: get[j].name, amt: m });
      pay[i].amt -= m; get[j].amt -= m;
      if (pay[i].amt < 0.5) i++;
      if (get[j].amt < 0.5) j++;
    }
    return out;
  }

  // ---------- actions ----------
  function addPlayer(name) {
    name = name.trim().replace(/\s+/g, " ");
    if (!name) return;
    if (S.game.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) { toast(name + " is already playing"); return; }
    S.game.players.push({ id: uid(), name, chips: "", ins: [{ id: uid(), amt: S.settings.buyIn, paid: false, initial: true, t: Date.now() }] });
    if (!S.roster.some((n) => n.toLowerCase() === name.toLowerCase())) S.roster.push(name);
    save(); render();
    toast(name + " in for " + rupee(S.settings.buyIn));
  }
  function findP(id) { return S.game.players.find((p) => p.id === id); }

  function endGame() {
    const c = calc();
    const record = {
      id: S.game.id, startedAt: S.game.startedAt, endedAt: Date.now(),
      players: c.rows.map((r) => ({ name: r.p.name, taken: r.taken, paid: r.paid, chips: r.chips, settle: r.settle })),
    };
    histQueue = histQueue.filter((g) => g.id !== record.id).concat([record]);
    saveHistQueue();
    pushHistory(true);
    S.game = newGame();
    tab = "table"; openLedger = null;
    save(); render();
    toast("Game saved. New table ready.");
  }

  function summaryText() {
    const c = calc();
    const lines = ["Chip Bank · " + fmtDate(S.game.startedAt), ""];
    c.rows.forEach((r) => {
      const v = r.settle < -0.5 ? "pays " + rupee(-r.settle) : r.settle > 0.5 ? "gets " + rupee(r.settle) : "even";
      lines.push(r.p.name + ": " + v + "  (bought " + rupee(r.taken) + ", chips " + rupee(r.chips) + ")");
    });
    const t = transfers(c);
    if (t.length) { lines.push("", "Settle up:"); t.forEach((x) => lines.push(x.from + " → " + x.to + ": " + rupee(x.amt))); }
    return lines.join("\n");
  }

  // ---------- render ----------

          row = `<div class="player">

              <div class="token" aria-hidden="true">${esc(p.name[0].toUpperCase())}</div>
              <button class="pinfo" data-act="ledger" data-id="${p.id}" aria-expanded="${open}">
                <div class="pname">${esc(p.name)}</div>
                <div class="pmoney num"><b>${rupee(t.taken)}</b><span>${p.ins.length} buy-in${p.ins.length > 1 ? "s" : ""}</span></div>
                <div class="psub num">${sub}</div>
              </button>
            </div>
            <div class="pactions">
              <button class="btn brass" data-act="buyin" data-id="${p.id}">Rebuy</button>
              <button class="btn amber" data-act="clockout" data-id="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>Clock out</button>
            </div>`;
        }
        if (open) {
          row += `<div class="ledger">` + p.ins.map((e, i) => `
            <div class="entry">
              <div class="lbl"><span class="amt num">${rupee(e.amt)}</span> ${e.initial ? "opening buy-in" : "re-buy #" + i}<small>${fmtTime(e.t)}</small></div>
              ${e.initial ? `<span class="pill free">Settled at end</span>` :
                `<button class="pill ${e.paid ? "paid" : "unpaid"}" data-act="togglepaid" data-id="${p.id}" data-e="${e.id}">${e.paid ? "Paid cash" : "Not paid"}</button>
                 <button class="x" data-act="delin" data-id="${p.id}" data-e="${e.id}" aria-label="Remove this re-buy">${armed === "del" + e.id ? "✓" : "×"}</button>`}
            </div>`).join("") +
            `<div class="ledger-foot">
              <span class="psub">Tap Not paid / Paid cash to switch</span>
              <button class="linkbtn danger" data-act="rmplayer" data-id="${p.id}">${armed === "rm" + p.id ? "Tap again to remove" : "Remove player"}</button>
            </div></div>`;
        }
        return row + `</div>`;
      }).join("") + `</div>`;
      h += `<button class="btn brass block" data-act="gocash">Cash out · enter chip counts</button>`;
    }
    h += `<h2>Settings</h2>
      <label class="settings" for="buyInSetting">Opening buy-in for new players
        <input type="number" inputmode="numeric" id="buyInSetting" value="${S.settings.buyIn}" min="0" step="50">
      </label>`;
    h += historyHTML(shownHistory());
    return h + `</section>`;
  }

  function viewCash() {
    if (!S.game.players.length) return `<section><div class="empty"><strong>Nobody to cash out</strong>Add players on the Table tab first.</div></section>`;
    const c = calc();
    let h = `<section><h2>Chips each player has now</h2>` + c.rows.map((r) => `
      <div class="cashrow">
        <div style="min-width:0"><div class="pname">${esc(r.p.name)}</div><div class="psub">${r.p.outAt ? "Left " + fmtTime(r.p.outAt) + " · " : ""}Took ${rupee(r.taken)}${r.paid ? " · paid " + rupee(r.paid) : ""}</div></div>
        <input class="num" type="number" inputmode="numeric" id="chips-${r.p.id}" data-chips="${r.p.id}" value="${esc(r.p.chips ?? "")}" placeholder="₹ chips" aria-label="Chips for ${esc(r.p.name)}">
      </div>`).join("");
    h += `<div id="resultsBox">${resultsHTML(c)}</div></section>`;
    return h;
  }

  function resultsHTML(c) {
    if (!c.allEntered) {
      const left = c.rows.filter((r) => !r.entered).length;
      return `<div class="check warn" style="background:var(--amber-soft);color:var(--fg)">Enter chips for ${left} more player${left > 1 ? "s" : ""} to see who owes what.</div>`;
    }
    let h = c.diff === 0
      ? `<div class="check ok"><b>Chips match.</b> ${rupee(c.sumChips)} counted against ${rupee(c.sumIn)} bought in.</div>`
      : `<div class="check warn"><b>Count is off by ${rupee(Math.abs(c.diff))}.</b> ${rupee(c.sumChips)} counted, but ${rupee(c.sumIn)} was bought in. Recount before settling.</div>`;
    h += `<h2>Balance</h2><div class="results">` + c.rows.map((r) => {
      const cls = r.settle < -0.5 ? "pay" : r.settle > 0.5 ? "get" : "even";
      const word = cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even";
      return `<div class="res">
        <div class="pname">${esc(r.p.name)}</div>
        <div class="verdict ${cls} num"><small>${word}</small>${cls === "even" ? "—" : rupee(Math.abs(r.settle))}</div>
        <div class="detail num">Chips ${rupee(r.chips)} − took ${rupee(r.taken)} = ${r.net >= 0 ? "+" : ""}${rupee(r.net)}${r.paid ? ` · already paid ${rupee(r.paid)} cash` : ""}</div>
      </div>`;
    }).join("") + `</div>`;
    const t = transfers(c);
    if (t.length) {
      h += `<h2>Who pays whom</h2><div class="transfers">` + t.map((x) =>
        `<div class="tr"><span class="who">${esc(x.from)}</span><span class="arrow">→</span><span class="who">${esc(x.to)}</span><span class="amt num">${rupee(x.amt)}</span></div>`).join("") + `</div>`;
    }
    h += `<div class="actions">
      <button class="btn ghost" data-act="copy">Copy summary</button>
      <button class="btn ${armed === "end" ? "danger" : ""}" data-act="end">${armed === "end" ? "Tap again to end game" : "End game & save"}</button>
    </div>`;
    return h;
  }

  // Public live view: what friends see on their phones and what the Room Display shows on a TV.
  const clock = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + ":" + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  function firstBuyIn(g) {
    let t = Infinity;
    g.players.forEach((p) => p.ins.forEach((e) => { if (e.t < t) t = e.t; }));
    return t === Infinity ? null : t;
  }
  function activity(g) {
    const ev = [];
    g.players.forEach((p) => {
      p.ins.forEach((e) => ev.push({ t: e.t, name: p.name, kind: e.initial ? "in" : "rebuy", text: (e.initial ? "Bought in · " : "Rebuy · ") + rupee(e.amt) + (!e.initial && e.paid ? " (paid)" : "") }));
      if (p.outAt) ev.push({ t: p.outAt, name: p.name, kind: "out", text: "Clocked out · " + rupee(Number(p.chips)) + " chips" });
    });
    return ev.sort((a, b) => b.t - a.t);
  }

  function liveHeadHTML() {
    return `<div class="livehead">
        <div class="lh-brand"><span class="lh-logo" aria-hidden="true"></span><span>Chip Bank</span></div>
        <span class="livepill"><i aria-hidden="true"></i>Live</span>
      </div>
      <div class="seg livetabs" role="tablist">
        <button data-act="livetab" data-lt="game" aria-selected="${liveTab === "game"}">Game &amp; balances</button>
        <button data-act="livetab" data-lt="tp" aria-selected="${liveTab === "tp"}">Teen Patti</button>
        <button data-act="livetab" data-lt="play" aria-selected="${liveTab === "play"}">Play online</button>
      </div>`;
  }

  function viewLive() {
    const live = liveHeadHTML();
    if (!F) return live + `<section><div class="empty"><strong>Connecting…</strong>Loading tonight's game.</div></section>`;
    const g = F.game;
    if (!g || !g.players.length) {
      return live + `<section><div class="empty"><strong>No game running right now</strong>This page fills in on its own once players buy in.</div>${historyHTML(shownHistory())}</section>`;
    }
    const c = calc(g);
    const entries = g.players.reduce((a, p) => a + p.ins.length, 0);
    const playing = g.players.filter((p) => !p.outAt).length;
    const start = firstBuyIn(g);
    const final = c.allEntered;
    let h = live + `<h1 class="livetitle">${final ? "Final balances" : fmtDate(g.startedAt) + " game"}</h1>
      <div class="livegrid">
        <div class="card potcard">
          <span class="k">${final ? "Total pot" : "Pot in play"}</span>
          <span class="v num">${rupee(c.sumIn)}</span>
          <span class="sub num">${entries} total entr${entries === 1 ? "y" : "ies"}</span>
        </div>
        <div class="card statcard">
          <div class="srow"><span class="sk">${CLOCK}Elapsed</span><span class="sv num" ${start && !final ? `data-elapsed="${start}"` : ""}>${start ? clock((final ? (F.at || Date.now()) : Date.now()) - start) : "—"}</span></div>
          <div class="srow"><span class="sk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3-.3 4 1.2 4.5 4.3"/></svg>Playing</span><span class="sv num">${playing}<small>/${g.players.length}</small></span></div>
          <div class="srow"><span class="sk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="15" r="5.5"/></svg>Buy-in</span><span class="sv num">${rupee(F.buyIn || 300)}</span></div>
        </div>`;
    const ranked = c.rows.slice().sort((a, b) => final ? b.settle - a.settle : b.taken - a.taken || byName(a.p.name, b.p.name));
    h += `<div class="card plist">
        <div class="cardhead"><b>Players</b><span>${final ? "Pays / gets" : "Buy-ins + rebuys"}</span></div>` +
      ranked.map((r, i) => {
        const extra = r.p.ins.length - 1;
        let sub = extra ? `${extra} rebuy${extra > 1 ? "s" : ""}` : "Single entry";
        if (r.unpaid && !final) sub += ` · <span class="owed">${rupee(r.unpaid)} not paid</span>`;
        if (r.p.outAt) sub = `Left ${fmtTime(r.p.outAt)} · ` + sub;
        let right = `<span class="pamt num">${rupee(r.taken)}</span>`;
        if (final || r.p.outAt) {
          const cls = r.settle < -0.5 ? "pay" : r.settle > 0.5 ? "get" : "even";
          right = `<span class="verdict ${cls} num"><small>${cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even"}</small>${cls === "even" ? "—" : rupee(Math.abs(r.settle))}</span>`;
        }
        return `<div class="lrow ${r.p.outAt && !final ? "gone" : ""}"><span class="rank num">${i + 1}</span>
          <div class="lname"><b>${esc(r.p.name)}</b><small class="num">${sub}</small></div>${right}</div>`;
      }).join("") + `</div>`;
    if (final) {
      const t = transfers(c);
      h += `<div class="card"><div class="cardhead"><b>Who pays whom</b></div><div class="transfers flat">` + (t.length ? t.map((x) =>
        `<div class="tr"><span class="who">${esc(x.from === "Bank (cash you hold)" ? "Bank (host)" : x.from)}</span><span class="arrow">→</span><span class="who">${esc(x.to)}</span><span class="amt num">${rupee(x.amt)}</span></div>`).join("")
        : `<p class="asof">Everyone is even.</p>`) + `</div></div>`;
    } else {
      h += `<div class="card feed"><div class="cardhead"><b>Latest activity</b><span>Auto-refresh</span></div>` +
        activity(g).slice(0, VIEW === "display" ? 9 : 6).map((e) =>
          `<div class="frow"><span class="ft num">${fmtTime(e.t)}</span><i class="dot ${e.kind}" aria-hidden="true"></i><div><b>${esc(e.name)}</b><small class="num">${e.text}</small></div></div>`).join("") + `</div>`;
    }
    h += `</div>`;
    if (!final) h += `<p class="asof center">Final pays and gets show here once the host counts everyone's chips.</p>`;
    if (VIEW !== "display") h += historyHTML(shownHistory());
    return `<section class="livesec">${h}</section>`;
  }

  setInterval(() => {
    document.querySelectorAll("[data-elapsed]").forEach((el) => { el.textContent = clock(Date.now() - Number(el.dataset.elapsed)); });
  }, 1000);

  function historyHTML(list) {
    if (!list.length) return "";
    return `<details class="history"><summary>Past games (${list.length})</summary>` + list.map((g) => {
      const ps = g.players.slice().sort((a, b) => byName(a.name, b.name));
      const owers = ps.filter((p) => p.settle < -0.5).map((p) => esc(p.name) + " paid " + rupee(-p.settle));
      const winners = ps.filter((p) => p.settle > 0.5).map((p) => esc(p.name) + " got " + rupee(p.settle));
      return `<div class="hgame"><div class="hdate">${fmtDate(g.startedAt)} · ${g.players.length} players</div>
        <div class="hline">${winners.join(", ") || "No winners"}</div><div class="hline">${owers.join(", ") || "No one owed"}</div></div>`;
    }).join("") + `</details>`;
  }

  function render() {
    // keep whatever the person is typing when a live update re-draws the screen
    const a = document.activeElement;
    const keep = a && a.id && (a.tagName === "INPUT") ? { id: a.id, v: a.value, s: a.selectionStart } : null;
    fxScan();
    document.body.classList.toggle("playmode", (mode === "owner" ? tab === "play" : liveTab === "play"));
    header();
    if (mode !== "owner") $("#view").innerHTML = liveTab === "tp" ? liveHeadHTML() + viewTP(false) : liveTab === "play" ? liveHeadHTML() + viewPlay() : viewLive();
    else $("#view").innerHTML = tab === "table" ? viewTable() : tab === "cash" ? viewCash() : tab === "play" ? viewPlay() : viewTP(true);
    footer();
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.s); } catch (e) {} } }
  }

  // ---------- buy-in sheet ----------
  function openClockSheet(pid) {
    const p = findP(pid); if (!p) return;
    const t = playerTotals(p);
    const root = $("#sheetRoot");
    const preview = (v) => {
      if (!(v >= 0) || v === "") return "Enter their chips to see what they owe or get.";
      const s = Number(v) - t.taken + t.paid;
      return s < -0.5 ? `<b class="pay">Pays ${rupee(-s)}</b>` : s > 0.5 ? `<b class="get">Gets ${rupee(s)}</b>` : "<b>Even, nothing to settle</b>";
    };
    root.innerHTML = `<div class="scrim" data-act="closesheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h3 id="sheetTitle">Clock out · ${esc(p.name)}</h3>
        <p class="sheetnote num">Took ${rupee(t.taken)} in ${p.ins.length} buy-in${p.ins.length > 1 ? "s" : ""}${t.paid ? `, paid ${rupee(t.paid)} cash` : ""}.</p>
        <input type="number" inputmode="numeric" id="clockChips" value="${esc(p.outAt ? p.chips : "")}" placeholder="Chips they're leaving with (₹)" aria-label="Chips they're leaving with">
        <div class="sheetnote" id="clockPreview">${preview(p.outAt ? p.chips : "")}</div>
        <button class="btn brass block" id="clockSave">${p.outAt ? "Save chips" : "Clock out"}</button>
        <button class="btn ghost block" data-act="closesheet">Cancel</button>
      </div>`;
    setTimeout(() => { const i = $("#clockChips"); if (i) i.focus(); }, 50);
    root.oninput = (ev) => { if (ev.target.id === "clockChips") $("#clockPreview").innerHTML = preview(ev.target.value); };
    root.onclick = (ev) => {
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; return; }
      if (ev.target.closest("#clockSave")) {
        const raw = $("#clockChips").value, v = Math.round(Number(raw));
        if (raw === "" || !(v >= 0)) { toast("Enter their chip count, ₹0 or more"); return; }
        p.chips = String(v);
        if (!p.outAt) p.outAt = Date.now();
        root.innerHTML = ""; save(); render();
        toast(p.name + " clocked out with " + rupee(v));
      }
    };
  }

  function openSheet(pid) {
    const p = findP(pid); if (!p) return;
    let amt = S.settings.buyIn, paid = false;
    const presets = [...new Set([S.settings.buyIn, S.settings.buyIn * 2, 500, 1000])].filter((n) => n > 0).slice(0, 4);
    const draw = () => {
      $("#sheetRoot").innerHTML = `<div class="scrim" data-act="closesheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h3 id="sheetTitle">Re-buy · ${esc(p.name)}</h3>
        <div class="presets">${presets.map((n) => `<button data-preset="${n}" aria-pressed="${n === amt}">${rupee(n)}</button>`).join("")}</div>
        <input type="number" inputmode="numeric" id="sheetAmt" value="${amt}" aria-label="Amount in rupees">
        <label class="toggle" for="sheetPaid">
          <span>Paid cash now<small>Leave off if they'll settle at the end</small></span>
          <span class="switch"><input type="checkbox" id="sheetPaid" ${paid ? "checked" : ""}><span></span></span>
        </label>
        <button class="btn brass block" id="sheetSave">Add ${rupee(amt)}</button>
        <button class="btn ghost block" data-act="closesheet">Cancel</button>
      </div>`;
    };
    draw();
    const root = $("#sheetRoot");
    root.onclick = (ev) => {
      const pre = ev.target.closest("[data-preset]");
      if (pre) { amt = Number(pre.dataset.preset); paid = $("#sheetPaid").checked; draw(); return; }
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; return; }
      if (ev.target.closest("#sheetSave")) {
        const v = Math.round(Number($("#sheetAmt").value));
        if (!(v > 0)) { toast("Enter an amount above ₹0"); return; }
        p.ins.push({ id: uid(), amt: v, paid: $("#sheetPaid").checked, initial: false, t: Date.now() });
        root.innerHTML = ""; save(); render();
        toast(p.name + " re-bought " + rupee(v));
      }
    };
    root.oninput = (ev) => {
      if (ev.target.id === "sheetAmt") {
        amt = Number(ev.target.value) || 0;
        $("#sheetSave").textContent = "Add " + rupee(amt);
        root.querySelectorAll("[data-preset]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.preset) === amt)));
      }
    };
  }

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("#toastRoot").innerHTML = ""; }, 2200);
  }

  // ---------- events ----------
  function arm(key) { armed = key; render(); setTimeout(() => { if (armed === key) { armed = null; render(); } }, 3500); }

  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    tab = b.dataset.tab; armed = null; render();
  });

  $("#view").addEventListener("submit", (e) => {
    if (e.target.id === "tpAddForm") { e.preventDefault(); const i = $("#tpAddName"); lobbyAdd(i.value).then(() => { const n = $("#tpAddName"); if (n) { n.value = ""; n.focus(); } }); return; }
    if (e.target.id === "tpJoinForm") { e.preventDefault(); tpJoin($("#tpJoinName").value); return; }
    if (e.target.id === "roomJoinForm") { e.preventDefault(); openRoom($("#roomCode").value); return; }
    if (e.target.id === "roomCreateForm") {
      e.preventDefault();
      const seatName = cleanName($("#roomSeatName").value);
      if (!seatName) { toast("Type your name first"); return; }
      callTpg("create", { seatName, name: $("#roomName").value }).then((res) => { if (res && res.code) { openRoom(res.code); setTimeout(openInviteSheet, 400); } });
      return;
    }
    if (e.target.id === "tpgJoinForm") { e.preventDefault(); const nm = cleanName($("#tpgName").value); if (!nm) { toast("Type your name to sit down"); return; } sendMove("join", { name: nm }); return; }
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    const inp = $("#addName"); addPlayer(inp.value); const n = $("#addName"); if (n) n.focus();
  });

  $("#view").addEventListener("click", async (e) => {
    const rb = e.target.closest("[data-react]");
    if (rb) { reactOpen = false; sendChat("react", rb.dataset.react); return; }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "livetab") { liveTab = b.dataset.lt; render(); }
    else if (act === "roomopen") openRoom(b.dataset.code);
    else if (act === "roomleave") closeRoom();
    else if (act === "roominvite") openInviteSheet();
    else if (act === "snd") { SND.toggle(); render(); }
    else if (act === "react") { reactOpen = !reactOpen; render(); }
    else if (act === "chat") openChat();
    else if (act === "kfostay") sendMove("stay");
    else if (act === "kfoswap") sendMove("swap");
    else if (act === "kfodraw") sendMove("draw");
    else if (act === "tpgsee") sendMove("see");
    else if (act === "tpgchaal") sendMove("chaal");
    else if (act === "tpgraise") sendMove("raise");
    else if (act === "tpgshow") sendMove("show");
    else if (act === "tpgside") sendMove("sideshow");
    else if (act === "tpgsideyes") sendMove("sideyes");
    else if (act === "tpgsideno") sendMove("sideno");
    else if (act === "tpgleave") sendMove("leave");
    else if (act === "tpgpack") { if (armed !== "tpgpack") return arm("tpgpack"); armed = null; sendMove("pack"); }
    else if (act === "tpgdeal") callTpg("deal");
    else if (act === "tpgcpu") callTpg("addcpu");
    else if (act === "tpgsolo") {
      if (!T || !T.seats.some((x) => x.uid === user.uid)) { toast("Sit down first, then add CPUs"); return; }
      const bots = T.seats.filter((x) => x.bot).length;
      for (let k = bots; k < 3; k++) await callTpg("addcpu");
      toast("3 CPU players are at the table. Tap Deal.");
    }
    else if (act === "tpgreset") { if (armed !== "tpgreset") return arm("tpgreset"); armed = null; callTpg("reset").then((r) => r && toast("Points reset")); }
    else if (act === "tpgend") { if (armed !== "tpgend") return arm("tpgend"); armed = null; callTpg("endhand"); }
    else if (act === "tpgclearchat") { if (armed !== "tpgclearchat") return arm("tpgclearchat"); armed = null; callTpg("clearchat").then((r) => r && toast("Chat cleared")); }
    else if (act === "tpgkick") callTpg(botSeat(id) ? "removecpu" : "kick", { uid: id });
    else if (act === "tpskip") { if (TP) revealAt[TP.n] = -Infinity; render(); }
    else if (act === "tpdeal") deal();
    else if (act === "tprm") lobbyRemove(id);
    else if (act === "tpleave") { if (me) lobbyRemove(me.id); }
    else if (act === "tpaddtable") {
      for (const p of S.game.players.filter((x) => !x.outAt)) await lobbyAdd(p.name);
    }
    else if (act === "tpclear") {
      if (armed !== "tpclear") return arm("tpclear");
      armed = null; LOBBY_P = {}; render(); LOBBY.set({ players: {} }).catch(() => {});
    }
    else if (act === "signin") signIn();
    else if (act === "signout") auth.signOut();
    else if (act === "seg") { seg = b.dataset.seg; openLedger = null; render(); }
    else if (act === "clockout") openClockSheet(id);
    else if (act === "backin") {
      const p = findP(id); p.outAt = null; p.chips = ""; seg = "playing"; save(); render();
      toast(p.name + " is back at the table");
    }
    else if (act === "toggleplay") {
      const name = b.dataset.name;
      const p = S.game.players.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!p) { addPlayer(name); return; }
      if (p.ins.length > 1) { toast(name + " has re-buys. Remove them from their entry first."); return; }
      S.game.players = S.game.players.filter((x) => x !== p);
      if (openLedger === p.id) openLedger = null;
      save(); render(); toast(name + " removed");
    }
    else if (act === "buyin") openSheet(id);
    else if (act === "ledger") { openLedger = openLedger === id ? null : id; armed = null; render(); }
    else if (act === "togglepaid") {
      const en = findP(id).ins.find((x) => x.id === b.dataset.e); en.paid = !en.paid; save(); render();
    } else if (act === "delin") {
      if (armed !== "del" + b.dataset.e) return arm("del" + b.dataset.e);
      const p = findP(id); p.ins = p.ins.filter((x) => x.id !== b.dataset.e); armed = null; save(); render();
    } else if (act === "rmplayer") {
      if (armed !== "rm" + id) return arm("rm" + id);
      S.game.players = S.game.players.filter((p) => p.id !== id); armed = null; openLedger = null; save(); render();
    } else if (act === "gocash") { tab = "cash"; render(); window.scrollTo(0, 0); }
    else if (act === "end") {
      if (armed !== "end") return arm("end");
      armed = null; endGame();
    } else if (act === "copy") {
      const text = summaryText();
      try { await navigator.clipboard.writeText(text); toast("Summary copied. Paste it in your group chat."); }
      catch (err) {
        const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand("copy"); } catch (x) {}
        ta.remove(); toast(ok ? "Summary copied" : "Copy isn't allowed here. Screenshot the balance instead.");
      }
    }
  });

  $("#view").addEventListener("input", (e) => {
    const pid = e.target.dataset.chips;
    if (pid) {
      findP(pid).chips = e.target.value;
      save();
      header();
      $("#resultsBox").innerHTML = resultsHTML(calc());
      return;
    }
    if (e.target.id === "buyInSetting") {
      const v = Math.round(Number(e.target.value));
      if (v > 0) { S.settings.buyIn = v; save(); header(); }
    }
  });
  $("#view").addEventListener("toggle", (e) => {
    if (e.target.id === "hostbox" && T) { const H = T.hand; hostOpen = { key: (H ? H.n : 0) + ":" + (!H || H.result ? 1 : 0), open: e.target.open }; } if (e.target.id === "picker") rosterOpen = e.target.open; }, true);
  $("#view").addEventListener("change", (e) => {
    if (e.target.id === "buyInSetting") render();
    if (e.target.id === "tpVariant") { S.settings.tpVariant = e.target.value; save(); render(); }
    if (/^tpg(Boot|Blind|Limit|Variant|Max|Quiet|Timer)$/.test(e.target.id)) tpgSetting(e.target.id, e.target.value);
  });

  setInterval(() => {
    document.querySelectorAll("[data-played]").forEach((el) => { el.textContent = dur(Date.now() - Number(el.dataset.played)); });
  }, 30000);
  render();
  connect();
})();
</script>
</body>
</html>
