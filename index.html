  // ---------- math ----------
  function playerTotals(p) {
    const taken = p.ins.reduce((a, b) => a + b.amt, 0);
    const paid = p.ins.reduce((a, b) => a + (b.paid ? b.amt : 0), 0);
    const unpaid = p.ins.reduce((a, b) => a + (!b.initial && !b.paid ? b.amt : 0), 0);
    return { taken, paid, unpaid };
  }
  function calc(g = S.game) {
    const rows = g.players.slice().sort((a, b) => byName(a.name, b.name)).map((p) => {
      const t = playerTotals(p);
      const entered = p.chips !== "" && p.chips != null && !isNaN(Number(p.chips));
      const chips = entered ? Number(p.chips) : 0;
      const net = chips - t.taken;           // won / lost at the table
      const settle = net + t.paid;           // what changes hands now
      return { p, ...t, entered, chips, net, settle };
    });
    const sumIn = rows.reduce((a, r) => a + r.taken, 0);
    const sumChips = rows.reduce((a, r) => a + r.chips, 0);
    const bankCash = rows.reduce((a, r) => a + r.paid, 0);
    const allEntered = rows.length > 0 && rows.every((r) => r.entered);
    return { rows, sumIn, sumChips, bankCash, allEntered, diff: sumChips - sumIn };
  }
  function transfers(c) {
    const BANK = "Bank (cash you hold)";
    const pay = [], get = [];
    c.rows.forEach((r) => {
      if (r.settle < -0.5) pay.push({ name: r.p.name, amt: -r.settle });
      else if (r.settle > 0.5) get.push({ name: r.p.name, amt: r.settle });
    });
    if (c.bankCash > 0) pay.push({ name: BANK, amt: c.bankCash });
    pay.sort((a, b) => b.amt - a.amt); get.sort((a, b) => b.amt - a.amt);
    const out = [];
    let i = 0, j = 0;
    while (i < pay.length && j < get.length) {
      const m = Math.min(pay[i].amt, get[j].amt);
      if (m > 0.5) out.push({ from: pay[i].name, to: get[j].name, amt: m });
      pay[i].amt -= m; get[j].amt -= m;
      if (pay[i].amt < 0.5) i++;
      if (get[j].amt < 0.5) j++;
    }
    return out;
  }

  // ---------- actions ----------
  function addPlayer(name) {
    name = name.trim().replace(/\s+/g, " ");
    if (!name) return;
    if (S.game.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) { toast(name + " is already playing"); return; }
    S.game.players.push({ id: uid(), name, chips: "", ins: [{ id: uid(), amt: S.settings.buyIn, paid: false, initial: true, t: Date.now() }] });
    if (!S.roster.some((n) => n.toLowerCase() === name.toLowerCase())) S.roster.push(name);
    save(); render();
    toast(name + " in for " + rupee(S.settings.buyIn));
  }
  function findP(id) { return S.game.players.find((p) => p.id === id); }

  function endGame() {
    const c = calc();
    const record = {
      id: S.game.id, startedAt: S.game.startedAt, endedAt: Date.now(),
      players: c.rows.map((r) => ({ name: r.p.name, taken: r.taken, paid: r.paid, chips: r.chips, settle: r.settle })),
    };
    history = [record].concat(history.filter((g) => g.id !== record.id)).slice(0, 30);
    HIST.set({ games: history }).catch(() => toast("Couldn't save this game to history. Check your connection."));
    S.game = newGame();
    tab = "table"; openLedger = null;
    save(); render();
    toast("Game saved. New table ready.");
  }

  function summaryText() {
    const c = calc();
    const lines = ["Chip Bank · " + fmtDate(S.game.startedAt), ""];
    c.rows.forEach((r) => {
      const v = r.settle < -0.5 ? "pays " + rupee(-r.settle) : r.settle > 0.5 ? "gets " + rupee(r.settle) : "even";
      lines.push(r.p.name + ": " + v + "  (bought " + rupee(r.taken) + ", chips " + rupee(r.chips) + ")");
    });
    const t = transfers(c);
    if (t.length) { lines.push("", "Settle up:"); t.forEach((x) => lines.push(x.from + " → " + x.to + ": " + rupee(x.amt))); }
    return lines.join("\n");
  }

  // ---------- render ----------
  function header() {
    const g = S.game;
    document.querySelector(".tabs").hidden = mode !== "owner";
    document.querySelector("header.top").hidden = mode !== "owner";
    document.body.classList.toggle("is-display", VIEW === "display");
    if (!g) { $("#date").textContent = ""; return; }
    const c = calc(g);
    $("#date").textContent = fmtDate(g.startedAt);
    $("#sPlayers").textContent = g.players.filter((p) => !p.outAt).length;
    $("#sOut").textContent = rupee(c.sumIn);
    $("#sUnpaid").textContent = rupee(c.rows.reduce((a, r) => a + r.unpaid, 0));
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  }

  function viewTable() {
    const playing = new Set(S.game.players.map((p) => p.name.toLowerCase()));
    const pickerOpen = rosterOpen ?? S.game.players.length < 2;
    let h = `<section>
      <details class="picker" id="picker" ${pickerOpen ? "open" : ""}>
        <summary><span>Who's playing today?</span><span class="count num">${S.game.players.length} of ${S.roster.length} selected</span></summary>
        <div class="grid">${S.roster.slice().sort(byName).map((n) => {
          const on = playing.has(n.toLowerCase());
          return `<button class="pick" data-act="toggleplay" data-name="${esc(n)}" aria-pressed="${on}">${esc(n)}</button>`;
        }).join("")}</div>
        <form class="addrow" id="addForm" autocomplete="off">
          <input type="text" id="addName" placeholder="Someone new? Type a name" aria-label="New player name" enterkeyhint="done">
          <button class="btn" type="submit">Add</button>
        </form>
      </details>`;
    const all = S.game.players.slice().sort((a, b) => byName(a.name, b.name));
    const inPlay = all.filter((p) => !p.outAt), gone = all.filter((p) => p.outAt);
    if (seg === "out" && !gone.length) seg = "playing";
    h += `<h2>At the table · each starts with ${rupee(S.settings.buyIn)}</h2>`;
    if (!all.length) {
      h += `<div class="empty"><strong>No one at the table yet</strong>Tap the names of everyone playing today. Each gets the opening ${rupee(S.settings.buyIn)} automatically.</div>`;
    } else {
      h += `<div class="seg" role="tablist">
        <button data-act="seg" data-seg="playing" aria-selected="${seg === "playing"}">Playing <span class="num">${inPlay.length}</span></button>
        <button data-act="seg" data-seg="out" aria-selected="${seg === "out"}" ${gone.length ? "" : "disabled"}>Clocked out <span class="num">${gone.length}</span></button>
      </div>`;
      const list = seg === "out" ? gone : inPlay;
      if (!list.length) h += `<div class="empty"><strong>Everyone has clocked out</strong>Head to Cash out to settle up, or tap Back in on the Clocked out list.</div>`;
      h += `<div class="players">` + list.map((p) => {
        const t = playerTotals(p);
        const extra = p.ins.length - 1;
        const open = openLedger === p.id;
        const joined = p.ins[0] ? p.ins[0].t : S.game.startedAt;
        let row;
        if (p.outAt) {
          const settle = Number(p.chips) - t.taken + t.paid;
          const cls = settle < -0.5 ? "pay" : settle > 0.5 ? "get" : "even";
          row = `<div class="player out">
            <div class="prow">
              <div class="token" aria-hidden="true">${esc(p.name[0].toUpperCase())}</div>
              <button class="pinfo" data-act="ledger" data-id="${p.id}" aria-expanded="${open}">
                <div class="pname">${esc(p.name)}</div>
                <div class="psub num">Left ${fmtTime(p.outAt)} · played ${dur(p.outAt - joined)}</div>
                <div class="psub num">Took ${rupee(t.taken)} · cashed ${rupee(Number(p.chips))}${t.paid ? ` · paid ${rupee(t.paid)}` : ""}</div>
              </button>
              <div class="verdict ${cls} num"><small>${cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even"}</small>${cls === "even" ? "—" : rupee(Math.abs(settle))}</div>
            </div>
            <div class="pactions">
              <button class="btn ghost" data-act="backin" data-id="${p.id}">Back in</button>
              <button class="btn ghost" data-act="clockout" data-id="${p.id}">Edit chips</button>
            </div>`;
        } else {
          let sub = `${CLOCK}<span data-played="${joined}">${dur(Date.now() - joined)}</span> played`;
          if (t.unpaid) sub += ` · <span class="owed">${rupee(t.unpaid)} unpaid</span>`;
          row = `<div class="player">
            <div class="prow">
              <div class="token" aria-hidden="true">${esc(p.name[0].toUpperCase())}</div>
              <button class="pinfo" data-act="ledger" data-id="${p.id}" aria-expanded="${open}">
                <div class="pname">${esc(p.name)}</div>
                <div class="pmoney num"><b>${rupee(t.taken)}</b><span>${p.ins.length} buy-in${p.ins.length > 1 ? "s" : ""}</span></div>
                <div class="psub num">${sub}</div>
              </button>
            </div>
            <div class="pactions">
              <button class="btn brass" data-act="buyin" data-id="${p.id}">Rebuy</button>
              <button class="btn amber" data-act="clockout" data-id="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>Clock out</button>
            </div>`;
        }
        if (open) {
          row += `<div class="ledger">` + p.ins.map((e, i) => `
            <div class="entry">
              <div class="lbl"><span class="amt num">${rupee(e.amt)}</span> ${e.initial ? "opening buy-in" : "re-buy #" + i}<small>${fmtTime(e.t)}</small></div>
              ${e.initial ? `<span class="pill free">Settled at end</span>` :
                `<button class="pill ${e.paid ? "paid" : "unpaid"}" data-act="togglepaid" data-id="${p.id}" data-e="${e.id}">${e.paid ? "Paid cash" : "Not paid"}</button>
                 <button class="x" data-act="delin" data-id="${p.id}" data-e="${e.id}" aria-label="Remove this re-buy">${armed === "del" + e.id ? "✓" : "×"}</button>`}
            </div>`).join("") +
            `<div class="ledger-foot">
              <span class="psub">Tap Not paid / Paid cash to switch</span>
              <button class="linkbtn danger" data-act="rmplayer" data-id="${p.id}">${armed === "rm" + p.id ? "Tap again to remove" : "Remove player"}</button>
            </div></div>`;
        }
        return row + `</div>`;
      }).join("") + `</div>`;
      h += `<button class="btn brass block" data-act="gocash">Cash out · enter chip counts</button>`;
    }
    h += `<h2>Settings</h2>
      <label class="settings" for="buyInSetting">Opening buy-in for new players
        <input type="number" inputmode="numeric" id="buyInSetting" value="${S.settings.buyIn}" min="0" step="50">
      </label>`;
    h += historyHTML(history);
    return h + `</section>`;
  }

  function viewCash() {
    if (!S.game.players.length) return `<section><div class="empty"><strong>Nobody to cash out</strong>Add players on the Table tab first.</div></section>`;
    const c = calc();
    let h = `<section><h2>Chips each player has now</h2>` + c.rows.map((r) => `
      <div class="cashrow">
        <div style="min-width:0"><div class="pname">${esc(r.p.name)}</div><div class="psub">${r.p.outAt ? "Left " + fmtTime(r.p.outAt) + " · " : ""}Took ${rupee(r.taken)}${r.paid ? " · paid " + rupee(r.paid) : ""}</div></div>
        <input class="num" type="number" inputmode="numeric" id="chips-${r.p.id}" data-chips="${r.p.id}" value="${esc(r.p.chips ?? "")}" placeholder="₹ chips" aria-label="Chips for ${esc(r.p.name)}">
      </div>`).join("");
    h += `<div id="resultsBox">${resultsHTML(c)}</div></section>`;
    return h;
  }

  function resultsHTML(c) {
    if (!c.allEntered) {
      const left = c.rows.filter((r) => !r.entered).length;
      return `<div class="check warn" style="background:var(--amber-soft);color:var(--fg)">Enter chips for ${left} more player${left > 1 ? "s" : ""} to see who owes what.</div>`;
    }
    let h = c.diff === 0
      ? `<div class="check ok"><b>Chips match.</b> ${rupee(c.sumChips)} counted against ${rupee(c.sumIn)} bought in.</div>`
      : `<div class="check warn"><b>Count is off by ${rupee(Math.abs(c.diff))}.</b> ${rupee(c.sumChips)} counted, but ${rupee(c.sumIn)} was bought in. Recount before settling.</div>`;
    h += `<h2>Balance</h2><div class="results">` + c.rows.map((r) => {
      const cls = r.settle < -0.5 ? "pay" : r.settle > 0.5 ? "get" : "even";
      const word = cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even";
      return `<div class="res">
        <div class="pname">${esc(r.p.name)}</div>
        <div class="verdict ${cls} num"><small>${word}</small>${cls === "even" ? "—" : rupee(Math.abs(r.settle))}</div>
        <div class="detail num">Chips ${rupee(r.chips)} − took ${rupee(r.taken)} = ${r.net >= 0 ? "+" : ""}${rupee(r.net)}${r.paid ? ` · already paid ${rupee(r.paid)} cash` : ""}</div>
      </div>`;
    }).join("") + `</div>`;
    const t = transfers(c);
    if (t.length) {
      h += `<h2>Who pays whom</h2><div class="transfers">` + t.map((x) =>
        `<div class="tr"><span class="who">${esc(x.from)}</span><span class="arrow">→</span><span class="who">${esc(x.to)}</span><span class="amt num">${rupee(x.amt)}</span></div>`).join("") + `</div>`;
    }
    h += `<div class="actions">
      <button class="btn ghost" data-act="copy">Copy summary</button>
      <button class="btn ${armed === "end" ? "danger" : ""}" data-act="end">${armed === "end" ? "Tap again to end game" : "End game & save"}</button>
    </div>`;
    return h;
  }

  // Public live view: what friends see on their phones and what the Room Display shows on a TV.
  const clock = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + ":" + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  function firstBuyIn(g) {
    let t = Infinity;
    g.players.forEach((p) => p.ins.forEach((e) => { if (e.t < t) t = e.t; }));
    return t === Infinity ? null : t;
  }
  function activity(g) {
    const ev = [];
    g.players.forEach((p) => {
      p.ins.forEach((e) => ev.push({ t: e.t, name: p.name, kind: e.initial ? "in" : "rebuy", text: (e.initial ? "Bought in · " : "Rebuy · ") + rupee(e.amt) + (!e.initial && e.paid ? " (paid)" : "") }));
      if (p.outAt) ev.push({ t: p.outAt, name: p.name, kind: "out", text: "Clocked out · " + rupee(Number(p.chips)) + " chips" });
    });
    return ev.sort((a, b) => b.t - a.t);
  }

  function liveHeadHTML() {
    return `<div class="livehead">
        <div class="lh-brand"><span class="lh-logo" aria-hidden="true"></span><span>Chip Bank</span></div>
        <span class="livepill"><i aria-hidden="true"></i>Live</span>
      </div>
      <div class="seg livetabs" role="tablist">
        <button data-act="livetab" data-lt="game" aria-selected="${liveTab === "game"}">Game &amp; balances</button>
        <button data-act="livetab" data-lt="tp" aria-selected="${liveTab === "tp"}">Teen Patti</button>
        <button data-act="livetab" data-lt="play" aria-selected="${liveTab === "play"}">Play online</button>
      </div>`;
  }

  function viewLive() {
    const live = liveHeadHTML();
    if (!F) return live + `<section><div class="empty"><strong>Connecting…</strong>Loading tonight's game.</div></section>`;
    const g = F.game;
    if (!g || !g.players.length) {
      return live + `<section><div class="empty"><strong>No game running right now</strong>This page fills in on its own once players buy in.</div>${historyHTML(history)}</section>`;
    }
    const c = calc(g);
    const entries = g.players.reduce((a, p) => a + p.ins.length, 0);
    const playing = g.players.filter((p) => !p.outAt).length;
    const start = firstBuyIn(g);
    const final = c.allEntered;
    let h = live + `<h1 class="livetitle">${final ? "Final balances" : fmtDate(g.startedAt) + " game"}</h1>
      <div class="livegrid">
        <div class="card potcard">
          <span class="k">${final ? "Total pot" : "Pot in play"}</span>
          <span class="v num">${rupee(c.sumIn)}</span>
          <span class="sub num">${entries} total entr${entries === 1 ? "y" : "ies"}</span>
        </div>
        <div class="card statcard">
          <div class="srow"><span class="sk">${CLOCK}Elapsed</span><span class="sv num" ${start && !final ? `data-elapsed="${start}"` : ""}>${start ? clock((final ? (F.at || Date.now()) : Date.now()) - start) : "—"}</span></div>
          <div class="srow"><span class="sk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3-.3 4 1.2 4.5 4.3"/></svg>Playing</span><span class="sv num">${playing}<small>/${g.players.length}</small></span></div>
          <div class="srow"><span class="sk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="15" r="5.5"/></svg>Buy-in</span><span class="sv num">${rupee(F.buyIn || 300)}</span></div>
        </div>`;
    const ranked = c.rows.slice().sort((a, b) => final ? b.settle - a.settle : b.taken - a.taken || byName(a.p.name, b.p.name));
    h += `<div class="card plist">
        <div class="cardhead"><b>Players</b><span>${final ? "Pays / gets" : "Buy-ins + rebuys"}</span></div>` +
      ranked.map((r, i) => {
        const extra = r.p.ins.length - 1;
        let sub = extra ? `${extra} rebuy${extra > 1 ? "s" : ""}` : "Single entry";
        if (r.unpaid && !final) sub += ` · <span class="owed">${rupee(r.unpaid)} not paid</span>`;
        if (r.p.outAt) sub = `Left ${fmtTime(r.p.outAt)} · ` + sub;
        let right = `<span class="pamt num">${rupee(r.taken)}</span>`;
        if (final || r.p.outAt) {
          const cls = r.settle < -0.5 ? "pay" : r.settle > 0.5 ? "get" : "even";
          right = `<span class="verdict ${cls} num"><small>${cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even"}</small>${cls === "even" ? "—" : rupee(Math.abs(r.settle))}</span>`;
        }
        return `<div class="lrow ${r.p.outAt && !final ? "gone" : ""}"><span class="rank num">${i + 1}</span>
          <div class="lname"><b>${esc(r.p.name)}</b><small class="num">${sub}</small></div>${right}</div>`;
      }).join("") + `</div>`;
    if (final) {
      const t = transfers(c);
      h += `<div class="card"><div class="cardhead"><b>Who pays whom</b></div><div class="transfers flat">` + (t.length ? t.map((x) =>
        `<div class="tr"><span class="who">${esc(x.from === "Bank (cash you hold)" ? "Bank (host)" : x.from)}</span><span class="arrow">→</span><span class="who">${esc(x.to)}</span><span class="amt num">${rupee(x.amt)}</span></div>`).join("")
        : `<p class="asof">Everyone is even.</p>`) + `</div></div>`;
    } else {
      h += `<div class="card feed"><div class="cardhead"><b>Latest activity</b><span>Auto-refresh</span></div>` +
        activity(g).slice(0, VIEW === "display" ? 9 : 6).map((e) =>
          `<div class="frow"><span class="ft num">${fmtTime(e.t)}</span><i class="dot ${e.kind}" aria-hidden="true"></i><div><b>${esc(e.name)}</b><small class="num">${e.text}</small></div></div>`).join("") + `</div>`;
    }
    h += `</div>`;
    if (!final) h += `<p class="asof center">Final pays and gets show here once the host counts everyone's chips.</p>`;
    if (VIEW !== "display") h += historyHTML(history);
    return `<section class="livesec">${h}</section>`;
  }

  setInterval(() => {
    document.querySelectorAll("[data-elapsed]").forEach((el) => { el.textContent = clock(Date.now() - Number(el.dataset.elapsed)); });
  }, 1000);

  function historyHTML(list) {
    if (!list.length) return "";
    return `<details class="history"><summary>Past games (${list.length})</summary>` + list.map((g) => {
      const ps = g.players.slice().sort((a, b) => byName(a.name, b.name));
      const owers = ps.filter((p) => p.settle < -0.5).map((p) => esc(p.name) + " paid " + rupee(-p.settle));
      const winners = ps.filter((p) => p.settle > 0.5).map((p) => esc(p.name) + " got " + rupee(p.settle));
      return `<div class="hgame"><div class="hdate">${fmtDate(g.startedAt)} · ${g.players.length} players</div>
        <div class="hline">${winners.join(", ") || "No winners"}</div><div class="hline">${owers.join(", ") || "No one owed"}</div></div>`;
    }).join("") + `</details>`;
  }

  function render() {
    // keep whatever the person is typing when a live update re-draws the screen
    const a = document.activeElement;
    const keep = a && a.id && (a.tagName === "INPUT") ? { id: a.id, v: a.value, s: a.selectionStart } : null;
    header();
    if (mode !== "owner") $("#view").innerHTML = liveTab === "tp" ? liveHeadHTML() + viewTP(false) : liveTab === "play" ? liveHeadHTML() + viewPlay() : viewLive();
    else $("#view").innerHTML = tab === "table" ? viewTable() : tab === "cash" ? viewCash() : tab === "play" ? viewPlay() : viewTP(true);
    footer();
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.s); } catch (e) {} } }
  }

  // ---------- buy-in sheet ----------
  function openClockSheet(pid) {
    const p = findP(pid); if (!p) return;
    const t = playerTotals(p);
    const root = $("#sheetRoot");
    const preview = (v) => {
      if (!(v >= 0) || v === "") return "Enter their chips to see what they owe or get.";
      const s = Number(v) - t.taken + t.paid;
      return s < -0.5 ? `<b class="pay">Pays ${rupee(-s)}</b>` : s > 0.5 ? `<b class="get">Gets ${rupee(s)}</b>` : "<b>Even, nothing to settle</b>";
    };
    root.innerHTML = `<div class="scrim" data-act="closesheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h3 id="sheetTitle">Clock out · ${esc(p.name)}</h3>
        <p class="sheetnote num">Took ${rupee(t.taken)} in ${p.ins.length} buy-in${p.ins.length > 1 ? "s" : ""}${t.paid ? `, paid ${rupee(t.paid)} cash` : ""}.</p>
        <input type="number" inputmode="numeric" id="clockChips" value="${esc(p.outAt ? p.chips : "")}" placeholder="Chips they're leaving with (₹)" aria-label="Chips they're leaving with">
        <div class="sheetnote" id="clockPreview">${preview(p.outAt ? p.chips : "")}</div>
        <button class="btn brass block" id="clockSave">${p.outAt ? "Save chips" : "Clock out"}</button>
        <button class="btn ghost block" data-act="closesheet">Cancel</button>
      </div>`;
    setTimeout(() => { const i = $("#clockChips"); if (i) i.focus(); }, 50);
    root.oninput = (ev) => { if (ev.target.id === "clockChips") $("#clockPreview").innerHTML = preview(ev.target.value); };
    root.onclick = (ev) => {
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; return; }
      if (ev.target.closest("#clockSave")) {
        const raw = $("#clockChips").value, v = Math.round(Number(raw));
        if (raw === "" || !(v >= 0)) { toast("Enter their chip count, ₹0 or more"); return; }
        p.chips = String(v);
        if (!p.outAt) p.outAt = Date.now();
        root.innerHTML = ""; save(); render();
        toast(p.name + " clocked out with " + rupee(v));
      }
    };
  }

  function openSheet(pid) {
    const p = findP(pid); if (!p) return;
    let amt = S.settings.buyIn, paid = false;
    const presets = [...new Set([S.settings.buyIn, S.settings.buyIn * 2, 500, 1000])].filter((n) => n > 0).slice(0, 4);
    const draw = () => {
      $("#sheetRoot").innerHTML = `<div class="scrim" data-act="closesheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h3 id="sheetTitle">Re-buy · ${esc(p.name)}</h3>
        <div class="presets">${presets.map((n) => `<button data-preset="${n}" aria-pressed="${n === amt}">${rupee(n)}</button>`).join("")}</div>
        <input type="number" inputmode="numeric" id="sheetAmt" value="${amt}" aria-label="Amount in rupees">
        <label class="toggle" for="sheetPaid">
          <span>Paid cash now<small>Leave off if they'll settle at the end</small></span>
          <span class="switch"><input type="checkbox" id="sheetPaid" ${paid ? "checked" : ""}><span></span></span>
        </label>
        <button class="btn brass block" id="sheetSave">Add ${rupee(amt)}</button>
        <button class="btn ghost block" data-act="closesheet">Cancel</button>
      </div>`;
    };
    draw();
    const root = $("#sheetRoot");
    root.onclick = (ev) => {
      const pre = ev.target.closest("[data-preset]");
      if (pre) { amt = Number(pre.dataset.preset); paid = $("#sheetPaid").checked; draw(); return; }
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; return; }
      if (ev.target.closest("#sheetSave")) {
        const v = Math.round(Number($("#sheetAmt").value));
        if (!(v > 0)) { toast("Enter an amount above ₹0"); return; }
        p.ins.push({ id: uid(), amt: v, paid: $("#sheetPaid").checked, initial: false, t: Date.now() });
        root.innerHTML = ""; save(); render();
        toast(p.name + " re-bought " + rupee(v));
      }
    };
    root.oninput = (ev) => {
      if (ev.target.id === "sheetAmt") {
        amt = Number(ev.target.value) || 0;
        $("#sheetSave").textContent = "Add " + rupee(amt);
        root.querySelectorAll("[data-preset]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.preset) === amt)));
      }
    };
  }

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("#toastRoot").innerHTML = ""; }, 2200);
  }

  // ---------- events ----------
  function arm(key) { armed = key; render(); setTimeout(() => { if (armed === key) { armed = null; render(); } }, 3500); }

  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    tab = b.dataset.tab; armed = null; render();
  });

  $("#view").addEventListener("submit", (e) => {
    if (e.target.id === "tpAddForm") { e.preventDefault(); const i = $("#tpAddName"); lobbyAdd(i.value).then(() => { const n = $("#tpAddName"); if (n) { n.value = ""; n.focus(); } }); return; }
    if (e.target.id === "tpJoinForm") { e.preventDefault(); tpJoin($("#tpJoinName").value); return; }
    if (e.target.id === "tpgJoinForm") { e.preventDefault(); const nm = cleanName($("#tpgName").value); if (!nm) { toast("Type your name to sit down"); return; } sendMove("join", { name: nm }); return; }
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    const inp = $("#addName"); addPlayer(inp.value); const n = $("#addName"); if (n) n.focus();
  });

  $("#view").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "livetab") { liveTab = b.dataset.lt; render(); }
    else if (act === "tpgsee") sendMove("see");
    else if (act === "tpgchaal") sendMove("chaal");
    else if (act === "tpgraise") sendMove("raise");
    else if (act === "tpgshow") sendMove("show");
    else if (act === "tpgside") sendMove("sideshow");
    else if (act === "tpgsideyes") sendMove("sideyes");
    else if (act === "tpgsideno") sendMove("sideno");
    else if (act === "tpgleave") sendMove("leave");
    else if (act === "tpgpack") { if (armed !== "tpgpack") return arm("tpgpack"); armed = null; sendMove("pack"); }
    else if (act === "tpgdeal") { if (!isDealer()) return; const err = startHand(); if (err) toast(err); else { keepAwake(); commitT(); } }
    else if (act === "tpgreset") { if (armed !== "tpgreset") return arm("tpgreset"); armed = null; if (isDealer() && T) { T.scores = {}; T.seats.forEach((x) => { T.scores[x.uid] = 0; }); commitT(); toast("Points reset"); } }
    else if (act === "tpgkick") { if (isDealer() && T) { T.seats = T.seats.filter((x) => x.uid !== id); commitT(); } }
    else if (act === "tpskip") { if (TP) revealAt[TP.n] = -Infinity; render(); }
    else if (act === "tpdeal") deal();
    else if (act === "tprm") lobbyRemove(id);
    else if (act === "tpleave") { if (me) lobbyRemove(me.id); }
    else if (act === "tpaddtable") {
      for (const p of S.game.players.filter((x) => !x.outAt)) await lobbyAdd(p.name);
    }
    else if (act === "tpclear") {
      if (armed !== "tpclear") return arm("tpclear");
      armed = null; LOBBY_P = {}; render(); LOBBY.set({ players: {} }).catch(() => {});
    }
    else if (act === "signin") signIn();
    else if (act === "signout") auth.signOut();
    else if (act === "seg") { seg = b.dataset.seg; openLedger = null; render(); }
    else if (act === "clockout") openClockSheet(id);
    else if (act === "backin") {
      const p = findP(id); p.outAt = null; p.chips = ""; seg = "playing"; save(); render();
      toast(p.name + " is back at the table");
    }
    else if (act === "toggleplay") {
      const name = b.dataset.name;
      const p = S.game.players.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!p) { addPlayer(name); return; }
      if (p.ins.length > 1) { toast(name + " has re-buys. Remove them from their entry first."); return; }
      S.game.players = S.game.players.filter((x) => x !== p);
      if (openLedger === p.id) openLedger = null;
      save(); render(); toast(name + " removed");
    }
    else if (act === "buyin") openSheet(id);
    else if (act === "ledger") { openLedger = openLedger === id ? null : id; armed = null; render(); }
    else if (act === "togglepaid") {
      const en = findP(id).ins.find((x) => x.id === b.dataset.e); en.paid = !en.paid; save(); render();
    } else if (act === "delin") {
      if (armed !== "del" + b.dataset.e) return arm("del" + b.dataset.e);
      const p = findP(id); p.ins = p.ins.filter((x) => x.id !== b.dataset.e); armed = null; save(); render();
    } else if (act === "rmplayer") {
      if (armed !== "rm" + id) return arm("rm" + id);
      S.game.players = S.game.players.filter((p) => p.id !== id); armed = null; openLedger = null; save(); render();
    } else if (act === "gocash") { tab = "cash"; render(); window.scrollTo(0, 0); }
    else if (act === "end") {
      if (armed !== "end") return arm("end");
      armed = null; endGame();
    } else if (act === "copy") {
      const text = summaryText();
      try { await navigator.clipboard.writeText(text); toast("Summary copied. Paste it in your group chat."); }
      catch (err) {
        const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand("copy"); } catch (x) {}
        ta.remove(); toast(ok ? "Summary copied" : "Copy isn't allowed here. Screenshot the balance instead.");
      }
    }
  });

  $("#view").addEventListener("input", (e) => {
    const pid = e.target.dataset.chips;
    if (pid) {
      findP(pid).chips = e.target.value;
      save();
      header();
      $("#resultsBox").innerHTML = resultsHTML(calc());
      return;
    }
    if (e.target.id === "buyInSetting") {
      const v = Math.round(Number(e.target.value));
      if (v > 0) { S.settings.buyIn = v; save(); header(); }
    }
  });
  $("#view").addEventListener("toggle", (e) => { if (e.target.id === "picker") rosterOpen = e.target.open; }, true);
  $("#view").addEventListener("change", (e) => {
    if (e.target.id === "buyInSetting") render();
    if (e.target.id === "tpVariant") { S.settings.tpVariant = e.target.value; save(); render(); }
    if (/^tpg(Boot|Blind|Limit|Variant)$/.test(e.target.id)) tpgSetting(e.target.id, e.target.value);
  });

  setInterval(() => {
    document.querySelectorAll("[data-played]").forEach((el) => { el.textContent = dur(Date.now() - Number(el.dataset.played)); });
  }, 30000);
  render();
  connect();
})();
</script>
</body>
</html>
