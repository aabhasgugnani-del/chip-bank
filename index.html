<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }

/* Layout: one phone column. A felt-dark pot panel up top, player rows separated by hairlines,
   mint for money-in actions, amber for leaving the table, bottom tab bar within thumb reach. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --raised: #eef1ed;
  --line: #e0e6e1;
  --fg: #111714;
  --muted: #66736d;
  --panel: #0f2a21;
  --panel-ink: #eef6f1;
  --mint: #2fd194;
  --mint-deep: #18a873;
  --mint-ink: #052117;
  --mint-text: #11885c;
  --amber: #c98a0c;
  --amber-fill: #f6bd3b;
  --amber-soft: #fbf0d6;
  --good: #11885c;
  --good-soft: #dcf4e9;
  --bad: #c9392b;
  --bad-soft: #fbe3df;
  --focus: #18a873;
  --shadow: 0 1px 2px rgba(17, 23, 20, .06);
  --font-display: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090c0b; --surface: #121715; --raised: #1a201d; --line: #232b27;
    --fg: #eef3f0; --muted: #8a9690; --panel: #101815; --panel-ink: #eef3f0;
    --mint: #5ee6a8; --mint-deep: #2fb57c; --mint-ink: #04241a; --mint-text: #5ee6a8;
    --amber: #f5bd3c; --amber-fill: #f5bd3c; --amber-soft: #2e2511;
    --good: #5ee6a8; --good-soft: #10291e; --bad: #ff7b6b; --bad-soft: #33150f;
    --focus: #5ee6a8; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090c0b; --surface: #121715; --raised: #1a201d; --line: #232b27;
  --fg: #eef3f0; --muted: #8a9690; --panel: #101815; --panel-ink: #eef3f0;
  --mint: #5ee6a8; --mint-deep: #2fb57c; --mint-ink: #04241a; --mint-text: #5ee6a8;
  --amber: #f5bd3c; --amber-fill: #f5bd3c; --amber-soft: #2e2511;
  --good: #5ee6a8; --good-soft: #10291e; --bad: #ff7b6b; --bad-soft: #33150f;
  --focus: #5ee6a8; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* ---- web version additions ---- */
.brand .date { margin-left: auto; }
.sharebtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--panel-ink) 22%, transparent); background: color-mix(in srgb, var(--panel-ink) 8%, transparent); color: var(--panel-ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
.sharebtn svg { width: 15px; height: 15px; }
.foot { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.foot p { margin: 0; }
.foot .linkbtn { font-size: 12px; }
.foot .ver { opacity: .6; }
.center { text-align: center; }

/* share sheet */
.sheet.share { gap: 12px; max-height: 92vh; overflow-y: auto; }
.qrbox { align-self: center; background: #fff; padding: 12px; border-radius: 18px; line-height: 0; }
.qrbox img, .qrbox canvas { display: block; width: 184px; height: 184px; }
.linkrow { display: flex; align-items: center; gap: 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; }
.linkrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 14px; }
.linkrow .btn { padding: 8px 14px; font-size: 14px; }
.sharegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
a.btn { text-decoration: none; text-align: center; display: inline-block; }

/* public live view */
.livehead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.lh-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.lh-logo { width: 28px; height: 28px; border-radius: 50%; background: var(--mint); box-shadow: inset 0 0 0 6px var(--mint), inset 0 0 0 9px var(--panel); }
.livepill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; background: var(--surface); }
.livepill i { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .livepill i { animation: none; } }
.livetitle { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.01em; text-align: center; margin: 22px 0 6px; text-wrap: balance; }
.livesec { gap: 14px; }
.livegrid { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.potcard { padding: 22px 24px; display: flex; flex-direction: column; gap: 4px; }
.potcard .k { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.potcard .v { font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 15vw, 76px); line-height: 1; letter-spacing: -.02em; color: var(--mint-text); }
.potcard .sub { color: var(--muted); font-size: 14px; }
.statcard .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.statcard .srow:last-child { border-bottom: 0; }
.statcard .sk { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.statcard .sk svg { width: 20px; height: 20px; }
.statcard .sv { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; }
.statcard .sv small { font-size: 18px; color: var(--muted); font-weight: 700; }
.cardhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.cardhead b { font-family: var(--font-display); font-size: 20px; }
.cardhead span { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.lrow { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow.gone { opacity: .7; }
.rank { width: 30px; height: 30px; flex: none; border-radius: 9px; background: var(--raised); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--muted); }
.lname { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lname b { font-family: var(--font-display); font-weight: 700; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lname small { color: var(--muted); font-size: 13px; }
.pamt { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.lrow .verdict { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.05; }
.lrow .verdict small { display: block; font-family: var(--font-body); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
.feed .frow { display: grid; grid-template-columns: auto auto 1fr; align-items: start; gap: 12px; padding: 11px 20px; border-bottom: 1px solid var(--line); }
.feed .frow:last-child { border-bottom: 0; }
.feed .ft { font-size: 12px; color: var(--muted); padding-top: 3px; min-width: 56px; }
.feed .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--mint); }
.feed .dot.rebuy { background: var(--amber-fill); }
.feed .dot.out { background: var(--muted); }
.feed b { display: block; font-weight: 800; }
.feed small { color: var(--muted); font-size: 13px; }
.transfers.flat { padding: 12px; }
.transfers.flat .tr { box-shadow: none; }

/* room display: a TV or laptop across the room */
body.is-display .wrap { max-width: 1280px; padding-block: 24px 48px; }
@media (min-width: 900px) {
  body.is-display .livegrid { grid-template-columns: 1.3fr 1fr; align-items: start; }
  body.is-display .livetitle { font-size: 44px; }
  body.is-display .potcard { padding: 32px 36px; justify-content: center; min-height: 100%; }
  body.is-display .potcard .v { font-size: 120px; }
  body.is-display .lname b { font-size: 24px; }
  body.is-display .pamt, body.is-display .lrow .verdict { font-size: 28px; }
}
@media (min-width: 720px) {
  .livegrid { grid-template-columns: 1fr 1fr; }
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 128px; }

/* pot panel */
header.top { background: var(--panel); color: var(--panel-ink); border-radius: 22px; padding: 18px 20px 20px; border: 1px solid var(--line); position: relative; overflow: hidden; }
header.top::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--mint) 22%, transparent) 0 15deg, transparent 15deg 45deg);
  -webkit-mask: radial-gradient(circle, transparent 46px, #000 47px, #000 78px, transparent 79px); mask: radial-gradient(circle, transparent 46px, #000 47px, #000 78px, transparent 79px); pointer-events: none; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .01em; margin: 0; line-height: 1; }
.brand .date { font-size: 13px; opacity: .7; }
.pot { margin-top: 18px; position: relative; z-index: 1; }
.pot .k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; opacity: .7; }
.pot .v { display: block; font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1.05; color: var(--mint); letter-spacing: -.01em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
.stat { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, var(--panel-ink) 10%, transparent); }
.stat b { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-right: 2px; }
.stat.warn b { color: var(--amber-fill); }

/* bottom tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 6px; justify-content: center;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabs button { flex: 1; max-width: 264px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: 0; border-radius: 12px; padding: 8px 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--fg); background: var(--raised); }
.tabs button[aria-selected="true"] svg { color: var(--mint-text); }

section { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin: 10px 0 0; font-weight: 700; }

.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; }
input[type="text"], input[type="number"], input[inputmode] {
  background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; width: 100%;
}
input:focus { border-color: var(--mint-deep); outline: none; }

/* buttons */
.btn { border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; font-weight: 800; font-family: var(--font-display); font-size: 17px; letter-spacing: .01em;
  background: var(--raised); color: var(--fg); white-space: nowrap; transition: transform .08s ease; }
.btn:active { transform: translateY(2px); }
.btn.brass { background: linear-gradient(180deg, color-mix(in srgb, var(--mint) 85%, #fff), var(--mint)); color: var(--mint-ink); border-color: transparent; box-shadow: 0 3px 0 var(--mint-deep); }
.btn.brass:active { box-shadow: 0 1px 0 var(--mint-deep); }
.btn.amber { background: var(--raised); color: var(--amber); border-color: var(--line); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.block { width: 100%; padding: 15px; font-size: 18px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

/* who's playing */
details.picker { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 0 14px; box-shadow: var(--shadow); }
details.picker summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 15px 2px; font-family: var(--font-display); font-weight: 700; font-size: 18px; cursor: pointer; list-style: none; }
details.picker summary::-webkit-details-marker { display: none; }
details.picker summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform .15s; }
details.picker[open] summary::after { transform: rotate(-135deg) translateY(-1px); }
details.picker summary .count { margin-left: auto; font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--muted); }
details.picker .addrow { padding-block: 14px 16px; }
.grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 9px 15px; font-size: 15px; font-weight: 700; color: var(--fg); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.pick[aria-pressed="true"]::before { content: "✓ "; }

/* segment */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 11px 0; font-weight: 700; color: var(--muted); }
.seg button span { opacity: .7; margin-left: 4px; }
.seg button[aria-selected="true"] { background: var(--raised); color: var(--fg); box-shadow: var(--shadow); }
.seg button:disabled { opacity: .45; cursor: default; }

/* players */
.players { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.player { border-bottom: 1px solid var(--line); }
.player:last-child { border-bottom: 0; }
.prow { display: flex; align-items: center; gap: 14px; padding: 16px 16px 12px; }
.token { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--mint-text);
  background: color-mix(in srgb, var(--mint) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--mint) 30%, transparent); }
.pinfo { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.pname { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmoney { display: flex; align-items: baseline; gap: 8px; }
.pmoney b { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; }
.pmoney span { color: var(--muted); font-size: 14px; }
.psub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.psub svg { width: 14px; height: 14px; flex: none; }
.owed { color: var(--bad); font-weight: 700; }
.pactions { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; padding: 0 16px 16px; }
.pactions .btn { padding: 13px 10px; }
.player.out .token { color: var(--muted); background: var(--raised); border-color: var(--line); }
.player .verdict, .res .verdict { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; flex: none; }
.player .verdict small, .res .verdict small { display: block; font-family: var(--font-body); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.verdict.pay { color: var(--bad); }
.verdict.get { color: var(--good); }
.verdict.even { color: var(--muted); }

.ledger { margin: 0 16px 16px; padding: 4px 14px 10px; background: var(--raised); border-radius: 14px; display: flex; flex-direction: column; }
.entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.entry:last-of-type { border-bottom: 0; }
.entry .lbl { flex: 1; min-width: 0; }
.entry .lbl small { color: var(--muted); display: block; font-size: 12px; }
.entry .amt { font-weight: 800; }
.pill { border: 0; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 800; letter-spacing: .02em; }
.pill.paid { background: var(--good-soft); color: var(--good); }
.pill.unpaid { background: var(--bad-soft); color: var(--bad); }
.pill.free { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.x { border: 0; background: transparent; color: var(--muted); font-size: 18px; width: 32px; height: 32px; border-radius: 8px; }
.ledger-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px 0; }
.linkbtn.danger { color: var(--bad); }

.empty { text-align: center; color: var(--muted); padding: 30px 18px; border: 1px dashed var(--line); border-radius: 18px; }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 19px; margin-bottom: 4px; }

/* cash out */
.cashrow { display: grid; grid-template-columns: 1fr 128px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.cashrow .pname { font-size: 18px; }
.cashrow input { text-align: right; padding: 11px 12px; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.check { border-radius: 14px; padding: 13px 15px; font-size: 14px; }
.check.ok { background: var(--good-soft); color: var(--good); }
.check.warn { background: var(--bad-soft); color: var(--bad); }
.check b { font-weight: 800; }

.results { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.res:last-child { border-bottom: 0; }
.res .pname { font-size: 18px; }
.res .detail { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

.transfers { display: flex; flex-direction: column; gap: 8px; }
.tr { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 600; }
.tr .arrow { color: var(--mint-text); font-weight: 800; }
.tr .amt { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.tr .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; }

details.history { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
details.history summary { padding: 12px 0; font-weight: 700; cursor: pointer; }
.hgame { border-top: 1px solid var(--line); padding: 11px 0; font-size: 14px; }
.hgame .hdate { font-weight: 800; }
.hgame .hline { color: var(--muted); }

.settings { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.settings input { width: 110px; padding: 8px 10px; text-align: right; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); color: var(--fg);
  border-radius: 24px 24px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line);
  animation: up .2s ease-out;
}
.sheet::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 4px; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; }
.sheet input[type="number"] { font-family: var(--font-display); font-weight: 700; font-size: 22px; padding: 14px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.presets button { flex: 1; min-width: 70px; border: 1px solid var(--line); background: var(--raised); border-radius: 12px; padding: 11px 0; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.presets button[aria-pressed="true"] { border-color: var(--mint-deep); background: color-mix(in srgb, var(--mint) 18%, var(--surface)); color: var(--mint-text); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; font-weight: 700; }
.toggle small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--mint-deep); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.sheetnote { margin: 0; font-size: 14px; color: var(--muted); }
.sheetnote .pay { color: var(--bad); } .sheetnote .get { color: var(--good); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.sharebar { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.sharebar.stale { background: var(--amber-soft); border-color: transparent; }
.sharebar .sb-text { flex: 1; min-width: 0; font-size: 14px; }
.sharebar .sb-text small { display: block; color: var(--muted); font-size: 12px; }
.sharebar .btn { padding: 10px 12px; font-size: 14px; }
.asof { margin: 0; font-size: 13px; color: var(--muted); }
.tag { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: 3px; white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); text-align: center; margin-top: 28px; }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Chip Bank</h1>
      <span class="date" id="date"></span>
      <button class="sharebtn" id="shareBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg>Share</button>
    </div>
    <div class="pot"><span class="k">Live pot</span><span class="v num" id="sOut">₹0</span></div>
    <div class="stats">
      <span class="stat num"><b id="sPlayers">0</b> playing</span>
      <span class="stat warn num"><b id="sUnpaid">₹0</b> unpaid</span>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button id="tabTable" role="tab" aria-selected="true" data-tab="table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3-.3 4 1.2 4.5 4.3"/></svg>Table</button>
    <button id="tabCash" role="tab" aria-selected="false" data-tab="cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3"/></svg>Cash out</button>
  </nav>

  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>

(() => {
  const LS_KEY = "chipbank.state.v1";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rupee = (n) => (n < 0 ? "−" : "") + "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN");
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const fmtDate = (t) => new Date(t).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
  const fmtTime = (t) => new Date(t).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });

  // ---------- state ----------
  const blank = () => ({ settings: { buyIn: 300 }, roster: [], game: null, updatedAt: 0 });
  let S = blank();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

  let tab = "table";
  let openLedger = null;       // player id whose ledger is expanded
  let armed = null;            // key of a destructive button awaiting second tap
  let rosterOpen = null;       // null = auto (open until 2 players are in)
  let seg = "playing";
  const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';         // Table tab list: "playing" or "out"
  const dur = (ms) => { const m = Math.max(0, Math.floor(ms / 60000)); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; };
  let history = [];
  const byName = (a, b) => a.localeCompare(b, "en", { sensitivity: "base" });

  // ---------- firebase ----------
  // Anyone with the link reads chipbank/state live. Only the host emails below can write
  // (enforced by Firestore rules, not just this list).
  const APP_VERSION = "v2.0.0";
  const HOSTS = ["aabhas@naaritive.com", "aabhas.gugnani@gmail.com"];
  firebase.initializeApp({
    apiKey: "AIzaSyCzKgn6bMkKvkO-sFHJQzjoUDYxpaidYc0",
    authDomain: "ledger-naaritive.firebaseapp.com",
    projectId: "ledger-naaritive",
    storageBucket: "ledger-naaritive.firebasestorage.app",
    messagingSenderId: "577025518393",
    appId: "1:577025518393:web:7253e4120fb4d670a596e8",
  });
  const auth = firebase.auth();
  const fs = firebase.firestore();
  const STATE = fs.collection("chipbank").doc("state");
  const HIST = fs.collection("chipbank").doc("history");

  const VIEW = location.hash === "#display" ? "display" : "app";
  const LIVE_URL = location.origin + location.pathname;
  let user = null;
  let authKnown = false;
  let syncMsg = "";
  // Until Firebase says who this is, guess from this phone's saved data so the host never sees a flash.
  let mode = S.updatedAt && VIEW === "app" ? "owner" : "public";
  let F = null;                 // public view: { game, buyIn, at }
  window.addEventListener("hashchange", () => location.reload());

  const newGame = () => ({ id: uid(), startedAt: Date.now(), players: [] });
  if (!S.game) S.game = newGame();

  const DEFAULT_ROSTER = ["Jagdish", "Dibya", "Naman", "Aakriti", "Aashna", "Mridul", "Avi", "Shivika", "Priyanshi",
    "Addy", "Tushar", "Shrey", "Shubham", "Makhan", "Kunal", "Abhigyan", "Anubhav", "Gaurav T"];
  function mergeRoster() {
    const seen = new Set(DEFAULT_ROSTER.map((n) => n.toLowerCase()));
    S.roster = DEFAULT_ROSTER.concat((S.roster || []).filter((n) => !seen.has(n.toLowerCase())));
  }
  mergeRoster();

  // ---------- persistence ----------
  let writing = false, pending = false;
  async function flush() {
    if (mode !== "owner" || !user) return;
    if (writing) { pending = true; return; }
    writing = true;
    try {
      await STATE.set(JSON.parse(JSON.stringify(S)));
      setSync("Synced · friends see this live");
    } catch (e) {
      setSync("Couldn't sync, saved on this phone. Check your connection.");
    }
    writing = false;
    if (pending) { pending = false; flush(); }
  }
  let saveTimer = null;
  function save() {
    if (mode !== "owner") return;
    S.updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 300);
  }
  function setSync(t) { syncMsg = t; footer(); }

  function footer() {
    const el = $("#foot"); if (!el) return;
    let h = "";
    if (mode === "owner") {
      h = `<p>${esc(syncMsg || (user ? "Synced · friends see this live" : "Saved on this phone"))}</p>`;
      h += user ? `<p>Hosting as ${esc(user.email)} · <button class="linkbtn" data-act="signout">Sign out</button></p>`
                : `<p><button class="linkbtn" data-act="signin">Sign in to sync</button></p>`;
    } else {
      h = `<p>Live view · updates on its own</p>`;
      if (VIEW !== "display") {
        if (user && !HOSTS.includes(user.email)) h += `<p>${esc(user.email)} can't host this game · <button class="linkbtn" data-act="signout">Sign out</button></p>`;
        else if (authKnown && !user) h += `<p><button class="linkbtn" data-act="signin">Host sign-in</button></p>`;
      }
    }
    el.innerHTML = h + `<p class="ver">Chip Bank ${APP_VERSION}</p>`;
  }

  function signIn() {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => {
      if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("Sign-in didn't work: " + (e.message || e.code));
    });
  }

  function connect() {
    auth.onAuthStateChanged((u) => {
      user = u; authKnown = true;
      const isHost = !!(u && HOSTS.includes(u.email));
      const next = isHost && VIEW === "app" ? "owner" : "public";
      if (next !== mode) { mode = next; render(); }
      else footer();
      if (isHost) flush();
    });
    STATE.onSnapshot((snap) => {
      const r = snap.exists ? snap.data() : null;
      if (r && r.game) F = { game: r.game, buyIn: (r.settings && r.settings.buyIn) || 300, at: r.updatedAt || 0 };
      if (mode === "owner") {
        if (snap.metadata.hasPendingWrites) return;
        if (!r) { if (S.updatedAt) flush(); return; }
        if ((r.updatedAt || 0) > (S.updatedAt || 0)) {
          S = Object.assign(blank(), JSON.parse(JSON.stringify(r)));
          if (!S.game) S.game = newGame();
          mergeRoster();
          try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
          render();
        }
      } else {
        if (!F) F = { game: null, buyIn: 300, at: 0 };
        render();
      }
    }, () => { if (mode !== "owner") { F = F || { game: null, at: 0 }; render(); } else setSync("Offline, saved on this phone"); });
    HIST.onSnapshot((snap) => {
      history = snap.exists ? (snap.data().games || []) : [];
      if (mode !== "owner" || tab === "table") render();
    }, () => {});
  }

  // ---------- share sheet ----------
  function openShareSheet() {
    const root = $("#sheetRoot");
    const url = LIVE_URL;
    const msg = "Live balances for tonight's game: " + url;
    root.innerHTML = `<div class="scrim" data-act="closesheet"></div>
      <div class="sheet share" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h3 id="sheetTitle">Share the live game</h3>
        <p class="sheetnote">Anyone with this link sees the pot, buy-ins and final balances update live. No login needed, and only you can change anything.</p>
        <div class="qrbox"><div id="qr" aria-label="QR code for the live link"></div></div>
        <div class="linkrow"><span class="num" id="shareUrl">${esc(url.replace(/^https?:\/\//, ""))}</span><button class="btn ghost" id="copyLink">Copy</button></div>
        <div class="sharegrid">
          <button class="btn ghost" id="nativeShare">Share link</button>
          <a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
        <a class="btn brass block" href="${esc(url)}#display" target="_blank" rel="noopener">Open Room Display</a>
        <p class="sheetnote center">Put the Room Display on a TV or laptop. Your phone stays the host controls.</p>
      </div>`;
    try {
      new QRCode(document.getElementById("qr"), { text: url, width: 184, height: 184, colorDark: "#0b0f0d", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    } catch (e) { document.getElementById("qr").textContent = "QR code unavailable"; }
    const copy = async () => {
      try { await navigator.clipboard.writeText(url); toast("Link copied"); }
      catch (e) { toast("Couldn't copy. Press and hold the link to copy it."); }
    };
    root.onclick = async (ev) => {
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; return; }
      if (ev.target.closest("#copyLink")) return copy();
      if (ev.target.closest("#nativeShare")) {
        if (navigator.share) { try { await navigator.share({ title: "Chip Bank · live game", text: "Live balances for tonight's game", url }); } catch (e) {} }
        else copy();
      }
    };
    root.oninput = null;
  }
  document.getElementById("shareBtn").addEventListener("click", openShareSheet);
  document.getElementById("foot").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "signin") signIn();
    if (b.dataset.act === "signout") auth.signOut();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#sheetRoot").innerHTML = ""; });

  // ---------- math ----------
  function playerTotals(p) {
    const taken = p.ins.reduce((a, b) => a + b.amt, 0);
    const paid = p.ins.reduce((a, b) => a + (b.paid ? b.amt : 0), 0);
    const unpaid = p.ins.reduce((a, b) => a + (!b.initial && !b.paid ? b.amt : 0), 0);
    return { taken, paid, unpaid };
  }
  function calc(g = S.game) {
    const rows = g.players.slice().sort((a, b) => byName(a.name, b.name)).map((p) => {
      const t = playerTotals(p);
      const entered = p.chips !== "" && p.chips != null && !isNaN(Number(p.chips));
      const chips = entered ? Number(p.chips) : 0;
      const net = chips - t.taken;           // won / lost at the table
      const settle = net + t.paid;           // what changes hands now
      return { p, ...t, entered, chips, net, settle };
    });
    const sumIn = rows.reduce((a, r) => a + r.taken, 0);
    const sumChips = rows.reduce((a, r) => a + r.chips, 0);
    const bankCash = rows.reduce((a, r) => a + r.paid, 0);
    const allEntered = rows.length > 0 && rows.every((r) => r.entered);
    return { rows, sumIn, sumChips, bankCash, allEntered, diff: sumChips - sumIn };
  }
  function transfers(c) {
    const BANK = "Bank (cash you hold)";
    const pay = [], get = [];
    c.rows.forEach((r) => {
      if (r.settle < -0.5) pay.push({ name: r.p.name, amt: -r.settle });
      else if (r.settle > 0.5) get.push({ name: r.p.name, amt: r.settle });
    });
    if (c.bankCash > 0) pay.push({ name: BANK, amt: c.bankCash });
    pay.sort((a, b) => b.amt - a.amt); get.sort((a, b) => b.amt - a.amt);
    const out = [];
    let i = 0, j = 0;
    while (i < pay.length && j < get.length) {
      const m = Math.min(pay[i].amt, get[j].amt);
      if (m > 0.5) out.push({ from: pay[i].name, to: get[j].name, amt: m });
      pay[i].amt -= m; get[j].amt -= m;
      if (pay[i].amt < 0.5) i++;
      if (get[j].amt < 0.5) j++;
    }
    return out;
  }

  // ---------- actions ----------
  function addPlayer(name) {
    name = name.trim().replace(/\s+/g, " ");
    if (!name) return;
    if (S.game.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) { toast(name + " is already playing"); return; }
    S.game.players.push({ id: uid(), name, chips: "", ins: [{ id: uid(), amt: S.settings.buyIn, paid: false, initial: true, t: Date.now() }] });
    if (!S.roster.some((n) => n.toLowerCase() === name.toLowerCase())) S.roster.push(name);
    save(); render();
    toast(name + " in for " + rupee(S.settings.buyIn));
  }
  function findP(id) { return S.game.players.find((p) => p.id === id); }

  function endGame() {
    const c = calc();
    const record = {
      id: S.game.id, startedAt: S.game.startedAt, endedAt: Date.now(),
      players: c.rows.map((r) => ({ name: r.p.name, taken: r.taken, paid: r.paid, chips: r.chips, settle: r.settle })),
    };
    history = [record].concat(history.filter((g) => g.id !== record.id)).slice(0, 30);
    HIST.set({ games: history }).catch(() => toast("Couldn't save this game to history. Check your connection."));
    S.game = newGame();
    tab = "table"; openLedger = null;
    save(); render();
    toast("Game saved. New table ready.");
  }

  function summaryText() {
    const c = calc();
    const lines = ["Chip Bank · " + fmtDate(S.game.startedAt), ""];
    c.rows.forEach((r) => {
      const v = r.settle < -0.5 ? "pays " + rupee(-r.settle) : r.settle > 0.5 ? "gets " + rupee(r.settle) : "even";
      lines.push(r.p.name + ": " + v + "  (bought " + rupee(r.taken) + ", chips " + rupee(r.chips) + ")");
    });
    const t = transfers(c);
    if (t.length) { lines.push("", "Settle up:"); t.forEach((x) => lines.push(x.from + " → " + x.to + ": " + rupee(x.amt))); }
    return lines.join("\n");
  }

  // ---------- render ----------
  function header() {
    const g = S.game;
    document.querySelector(".tabs").hidden = mode !== "owner";
    document.querySelector("header.top").hidden = mode !== "owner";
    document.body.classList.toggle("is-display", VIEW === "display");
    if (!g) { $("#date").textContent = ""; return; }
    const c = calc(g);
    $("#date").textContent = fmtDate(g.startedAt);
    $("#sPlayers").textContent = g.players.filter((p) => !p.outAt).length;
    $("#sOut").textContent = rupee(c.sumIn);
    $("#sUnpaid").textContent = rupee(c.rows.reduce((a, r) => a + r.unpaid, 0));
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  }

  function viewTable() {
    const playing = new Set(S.game.players.map((p) => p.name.toLowerCase()));
    const pickerOpen = rosterOpen ?? S.game.players.length < 2;
    let h = `<section>
      <details class="picker" id="picker" ${pickerOpen ? "open" : ""}>
        <summary><span>Who's playing today?</span><span class="count num">${S.game.players.length} of ${S.roster.length} selected</span></summary>
        <div class="grid">${S.roster.slice().sort(byName).map((n) => {
          const on = playing.has(n.toLowerCase());
          return `<button class="pick" data-act="toggleplay" data-name="${esc(n)}" aria-pressed="${on}">${esc(n)}</button>`;
        }).join("")}</div>
        <form class="addrow" id="addForm" autocomplete="off">
          <input type="text" id="addName" placeholder="Someone new? Type a name" aria-label="New player name" enterkeyhint="done">
          <button class="btn" type="submit">Add</button>
        </form>
      </details>`;
    const all = S.game.players.slice().sort((a, b) => byName(a.name, b.name));
    const inPlay = all.filter((p) => !p.outAt), gone = all.filter((p) => p.outAt);
    if (seg === "out" && !gone.length) seg = "playing";
    h += `<h2>At the table · each starts with ${rupee(S.settings.buyIn)}</h2>`;
    if (!all.length) {
      h += `<div class="empty"><strong>No one at the table yet</strong>Tap the names of everyone playing today. Each gets the opening ${rupee(S.settings.buyIn)} automatically.</div>`;
    } else {
      h += `<div class="seg" role="tablist">
        <button data-act="seg" data-seg="playing" aria-selected="${seg === "playing"}">Playing <span class="num">${inPlay.length}</span></button>
        <button data-act="seg" data-seg="out" aria-selected="${seg === "out"}" ${gone.length ? "" : "disabled"}>Clocked out <span class="num">${gone.length}</span></button>
      </div>`;
      const list = seg === "out" ? gone : inPlay;
      if (!list.length) h += `<div class="empty"><strong>Everyone has clocked out</strong>Head to Cash out to settle up, or tap Back in on the Clocked out list.</div>`;
      h += `<div class="players">` + list.map((p) => {
        const t = playerTotals(p);
        const extra = p.ins.length - 1;
        const open = openLedger === p.id;
        const joined = p.ins[0] ? p.ins[0].t : S.game.startedAt;
        let row;
        if (p.outAt) {
          const settle = Number(p.chips) - t.taken + t.paid;
          const cls = settle < -0.5 ? "pay" : settle > 0.5 ? "get" : "even";
          row = `<div class="player out">
            <div class="prow">
              <div class="token" aria-hidden="true">${esc(p.name[0].toUpperCase())}</div>
              <button class="pinfo" data-act="ledger" data-id="${p.id}" aria-expanded="${open}">
                <div class="pname">${esc(p.name)}</div>
                <div class="psub num">Left ${fmtTime(p.outAt)} · played ${dur(p.outAt - joined)}</div>
                <div class="psub num">Took ${rupee(t.taken)} · cashed ${rupee(Number(p.chips))}${t.paid ? ` · paid ${rupee(t.paid)}` : ""}</div>
              </button>
              <div class="verdict ${cls} num"><small>${cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even"}</small>${cls === "even" ? "—" : rupee(Math.abs(settle))}</div>
            </div>
            <div class="pactions">
              <button class="btn ghost" data-act="backin" data-id="${p.id}">Back in</button>
              <button class="btn ghost" data-act="clockout" data-id="${p.id}">Edit chips</button>
            </div>`;
        } else {
          let sub = `${CLOCK}<span data-played="${joined}">${dur(Date.now() - joined)}</span> played`;
          if (t.unpaid) sub += ` · <span class="owed">${rupee(t.unpaid)} unpaid</span>`;
          row = `<div class="player">
            <div class="prow">
              <div class="token" aria-hidden="true">${esc(p.name[0].toUpperCase())}</div>
              <button class="pinfo" data-act="ledger" data-id="${p.id}" aria-expanded="${open}">
                <div class="pname">${esc(p.name)}</div>
                <div class="pmoney num"><b>${rupee(t.taken)}</b><span>${p.ins.length} buy-in${p.ins.length > 1 ? "s" : ""}</span></div>
                <div class="psub num">${sub}</div>
              </button>
            </div>
            <div class="pactions">
              <button class="btn brass" data-act="buyin" data-id="${p.id}">Rebuy</button>
              <button class="btn amber" data-act="clockout" data-id="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>Clock out</button>
            </div>`;
        }
        if (open) {
          row += `<div class="ledger">` + p.ins.map((e, i) => `
            <div class="entry">
              <div class="lbl"><span class="amt num">${rupee(e.amt)}</span> ${e.initial ? "opening buy-in" : "re-buy #" + i}<small>${fmtTime(e.t)}</small></div>
              ${e.initial ? `<span class="pill free">Settled at end</span>` :
                `<button class="pill ${e.paid ? "paid" : "unpaid"}" data-act="togglepaid" data-id="${p.id}" data-e="${e.id}">${e.paid ? "Paid cash" : "Not paid"}</button>
                 <button class="x" data-act="delin" data-id="${p.id}" data-e="${e.id}" aria-label="Remove this re-buy">${armed === "del" + e.id ? "✓" : "×"}</button>`}
            </div>`).join("") +
            `<div class="ledger-foot">
              <span class="psub">Tap Not paid / Paid cash to switch</span>
              <button class="linkbtn danger" data-act="rmplayer" data-id="${p.id}">${armed === "rm" + p.id ? "Tap again to remove" : "Remove player"}</button>
            </div></div>`;
        }
        return row + `</div>`;
      }).join("") + `</div>`;
      h += `<button class="btn brass block" data-act="gocash">Cash out · enter chip counts</button>`;
    }
    h += `<h2>Settings</h2>
      <label class="settings" for="buyInSetting">Opening buy-in for new players
        <input type="number" inputmode="numeric" id="buyInSetting" value="${S.settings.buyIn}" min="0" step="50">
      </label>`;
    h += historyHTML(history);
    return h + `</section>`;
  }

  function viewCash() {
    if (!S.game.players.length) return `<section><div class="empty"><strong>Nobody to cash out</strong>Add players on the Table tab first.</div></section>`;
    const c = calc();
    let h = `<section><h2>Chips each player has now</h2>` + c.rows.map((r) => `
      <div class="cashrow">
        <div style="min-width:0"><div class="pname">${esc(r.p.name)}</div><div class="psub">${r.p.outAt ? "Left " + fmtTime(r.p.outAt) + " · " : ""}Took ${rupee(r.taken)}${r.paid ? " · paid " + rupee(r.paid) : ""}</div></div>
        <input class="num" type="number" inputmode="numeric" id="chips-${r.p.id}" data-chips="${r.p.id}" value="${esc(r.p.chips ?? "")}" placeholder="₹ chips" aria-label="Chips for ${esc(r.p.name)}">
      </div>`).join("");
    h += `<div id="resultsBox">${resultsHTML(c)}</div></section>`;
    return h;
  }

  function resultsHTML(c) {
    if (!c.allEntered) {
      const left = c.rows.filter((r) => !r.entered).length;
      return `<div class="check warn" style="background:var(--amber-soft);color:var(--fg)">Enter chips for ${left} more player${left > 1 ? "s" : ""} to see who owes what.</div>`;
    }
    let h = c.diff === 0
      ? `<div class="check ok"><b>Chips match.</b> ${rupee(c.sumChips)} counted against ${rupee(c.sumIn)} bought in.</div>`
      : `<div class="check warn"><b>Count is off by ${rupee(Math.abs(c.diff))}.</b> ${rupee(c.sumChips)} counted, but ${rupee(c.sumIn)} was bought in. Recount before settling.</div>`;
    h += `<h2>Balance</h2><div class="results">` + c.rows.map((r) => {
      const cls = r.settle < -0.5 ? "pay" : r.settle > 0.5 ? "get" : "even";
      const word = cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even";
      return `<div class="res">
        <div class="pname">${esc(r.p.name)}</div>
        <div class="verdict ${cls} num"><small>${word}</small>${cls === "even" ? "—" : rupee(Math.abs(r.settle))}</div>
        <div class="detail num">Chips ${rupee(r.chips)} − took ${rupee(r.taken)} = ${r.net >= 0 ? "+" : ""}${rupee(r.net)}${r.paid ? ` · already paid ${rupee(r.paid)} cash` : ""}</div>
      </div>`;
    }).join("") + `</div>`;
    const t = transfers(c);
    if (t.length) {
      h += `<h2>Who pays whom</h2><div class="transfers">` + t.map((x) =>
        `<div class="tr"><span class="who">${esc(x.from)}</span><span class="arrow">→</span><span class="who">${esc(x.to)}</span><span class="amt num">${rupee(x.amt)}</span></div>`).join("") + `</div>`;
    }
    h += `<div class="actions">
      <button class="btn ghost" data-act="copy">Copy summary</button>
      <button class="btn ${armed === "end" ? "danger" : ""}" data-act="end">${armed === "end" ? "Tap again to end game" : "End game & save"}</button>
    </div>`;
    return h;
  }

  // Public live view: what friends see on their phones and what the Room Display shows on a TV.
  const clock = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + ":" + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  function firstBuyIn(g) {
    let t = Infinity;
    g.players.forEach((p) => p.ins.forEach((e) => { if (e.t < t) t = e.t; }));
    return t === Infinity ? null : t;
  }
  function activity(g) {
    const ev = [];
    g.players.forEach((p) => {
      p.ins.forEach((e) => ev.push({ t: e.t, name: p.name, kind: e.initial ? "in" : "rebuy", text: (e.initial ? "Bought in · " : "Rebuy · ") + rupee(e.amt) + (!e.initial && e.paid ? " (paid)" : "") }));
      if (p.outAt) ev.push({ t: p.outAt, name: p.name, kind: "out", text: "Clocked out · " + rupee(Number(p.chips)) + " chips" });
    });
    return ev.sort((a, b) => b.t - a.t);
  }

  function viewLive() {
    const live = `<div class="livehead">
        <div class="lh-brand"><span class="lh-logo" aria-hidden="true"></span><span>Chip Bank</span></div>
        <span class="livepill"><i aria-hidden="true"></i>Live game</span>
      </div>`;
    if (!F) return live + `<section><div class="empty"><strong>Connecting…</strong>Loading tonight's game.</div></section>`;
    const g = F.game;
    if (!g || !g.players.length) {
      return live + `<section><div class="empty"><strong>No game running right now</strong>This page fills in on its own once players buy in.</div>${historyHTML(history)}</section>`;
    }
    const c = calc(g);
    const entries = g.players.reduce((a, p) => a + p.ins.length, 0);
    const playing = g.players.filter((p) => !p.outAt).length;
    const start = firstBuyIn(g);
    const final = c.allEntered;
    let h = live + `<h1 class="livetitle">${final ? "Final balances" : fmtDate(g.startedAt) + " game"}</h1>
      <div class="livegrid">
        <div class="card potcard">
          <span class="k">${final ? "Total pot" : "Pot in play"}</span>
          <span class="v num">${rupee(c.sumIn)}</span>
          <span class="sub num">${entries} total entr${entries === 1 ? "y" : "ies"}</span>
        </div>
        <div class="card statcard">
          <div class="srow"><span class="sk">${CLOCK}Elapsed</span><span class="sv num" ${start && !final ? `data-elapsed="${start}"` : ""}>${start ? clock((final ? (F.at || Date.now()) : Date.now()) - start) : "—"}</span></div>
          <div class="srow"><span class="sk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3-.3 4 1.2 4.5 4.3"/></svg>Playing</span><span class="sv num">${playing}<small>/${g.players.length}</small></span></div>
          <div class="srow"><span class="sk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="15" r="5.5"/></svg>Buy-in</span><span class="sv num">${rupee(F.buyIn || 300)}</span></div>
        </div>`;
    const ranked = c.rows.slice().sort((a, b) => final ? b.settle - a.settle : b.taken - a.taken || byName(a.p.name, b.p.name));
    h += `<div class="card plist">
        <div class="cardhead"><b>Players</b><span>${final ? "Pays / gets" : "Buy-ins + rebuys"}</span></div>` +
      ranked.map((r, i) => {
        const extra = r.p.ins.length - 1;
        let sub = extra ? `${extra} rebuy${extra > 1 ? "s" : ""}` : "Single entry";
        if (r.unpaid && !final) sub += ` · <span class="owed">${rupee(r.unpaid)} not paid</span>`;
        if (r.p.outAt) sub = `Left ${fmtTime(r.p.outAt)} · ` + sub;
        let right = `<span class="pamt num">${rupee(r.taken)}</span>`;
        if (final || r.p.outAt) {
          const cls = r.settle < -0.5 ? "pay" : r.settle > 0.5 ? "get" : "even";
          right = `<span class="verdict ${cls} num"><small>${cls === "pay" ? "Pays" : cls === "get" ? "Gets" : "Even"}</small>${cls === "even" ? "—" : rupee(Math.abs(r.settle))}</span>`;
        }
        return `<div class="lrow ${r.p.outAt && !final ? "gone" : ""}"><span class="rank num">${i + 1}</span>
          <div class="lname"><b>${esc(r.p.name)}</b><small class="num">${sub}</small></div>${right}</div>`;
      }).join("") + `</div>`;
    if (final) {
      const t = transfers(c);
      h += `<div class="card"><div class="cardhead"><b>Who pays whom</b></div><div class="transfers flat">` + (t.length ? t.map((x) =>
        `<div class="tr"><span class="who">${esc(x.from === "Bank (cash you hold)" ? "Bank (host)" : x.from)}</span><span class="arrow">→</span><span class="who">${esc(x.to)}</span><span class="amt num">${rupee(x.amt)}</span></div>`).join("")
        : `<p class="asof">Everyone is even.</p>`) + `</div></div>`;
    } else {
      h += `<div class="card feed"><div class="cardhead"><b>Latest activity</b><span>Auto-refresh</span></div>` +
        activity(g).slice(0, VIEW === "display" ? 9 : 6).map((e) =>
          `<div class="frow"><span class="ft num">${fmtTime(e.t)}</span><i class="dot ${e.kind}" aria-hidden="true"></i><div><b>${esc(e.name)}</b><small class="num">${e.text}</small></div></div>`).join("") + `</div>`;
    }
    h += `</div>`;
    if (!final) h += `<p class="asof center">Final pays and gets show here once the host counts everyone's chips.</p>`;
    if (VIEW !== "display") h += historyHTML(history);
    return `<section class="livesec">${h}</section>`;
  }

  setInterval(() => {
    document.querySelectorAll("[data-elapsed]").forEach((el) => { el.textContent = clock(Date.now() - Number(el.dataset.elapsed)); });
  }, 1000);

  function historyHTML(list) {
    if (!list.length) return "";
    return `<details class="history"><summary>Past games (${list.length})</summary>` + list.map((g) => {
      const ps = g.players.slice().sort((a, b) => byName(a.name, b.name));
      const owers = ps.filter((p) => p.settle < -0.5).map((p) => esc(p.name) + " paid " + rupee(-p.settle));
      const winners = ps.filter((p) => p.settle > 0.5).map((p) => esc(p.name) + " got " + rupee(p.settle));
      return `<div class="hgame"><div class="hdate">${fmtDate(g.startedAt)} · ${g.players.length} players</div>
        <div class="hline">${winners.join(", ") || "No winners"}</div><div class="hline">${owers.join(", ") || "No one owed"}</div></div>`;
    }).join("") + `</details>`;
  }

  function render() {
    header();
    if (mode !== "owner") { $("#view").innerHTML = viewLive(); footer(); return; }
    $("#view").innerHTML = tab === "table" ? viewTable() : viewCash();
    footer();
  }

  // ---------- buy-in sheet ----------
  function openClockSheet(pid) {
    const p = findP(pid); if (!p) return;
    const t = playerTotals(p);
    const root = $("#sheetRoot");
    const preview = (v) => {
      if (!(v >= 0) || v === "") return "Enter their chips to see what they owe or get.";
      const s = Number(v) - t.taken + t.paid;
      return s < -0.5 ? `<b class="pay">Pays ${rupee(-s)}</b>` : s > 0.5 ? `<b class="get">Gets ${rupee(s)}</b>` : "<b>Even, nothing to settle</b>";
    };
    root.innerHTML = `<div class="scrim" data-act="closesheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h3 id="sheetTitle">Clock out · ${esc(p.name)}</h3>
        <p class="sheetnote num">Took ${rupee(t.taken)} in ${p.ins.length} buy-in${p.ins.length > 1 ? "s" : ""}${t.paid ? `, paid ${rupee(t.paid)} cash` : ""}.</p>
        <input type="number" inputmode="numeric" id="clockChips" value="${esc(p.outAt ? p.chips : "")}" placeholder="Chips they're leaving with (₹)" aria-label="Chips they're leaving with">
        <div class="sheetnote" id="clockPreview">${preview(p.outAt ? p.chips : "")}</div>
        <button class="btn brass block" id="clockSave">${p.outAt ? "Save chips" : "Clock out"}</button>
        <button class="btn ghost block" data-act="closesheet">Cancel</button>
      </div>`;
    setTimeout(() => { const i = $("#clockChips"); if (i) i.focus(); }, 50);
    root.oninput = (ev) => { if (ev.target.id === "clockChips") $("#clockPreview").innerHTML = preview(ev.target.value); };
    root.onclick = (ev) => {
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; return; }
      if (ev.target.closest("#clockSave")) {
        const raw = $("#clockChips").value, v = Math.round(Number(raw));
        if (raw === "" || !(v >= 0)) { toast("Enter their chip count, ₹0 or more"); return; }
        p.chips = String(v);
        if (!p.outAt) p.outAt = Date.now();
        root.innerHTML = ""; save(); render();
        toast(p.name + " clocked out with " + rupee(v));
      }
    };
  }

  function openSheet(pid) {
    const p = findP(pid); if (!p) return;
    let amt = S.settings.buyIn, paid = false;
    const presets = [...new Set([S.settings.buyIn, S.settings.buyIn * 2, 500, 1000])].filter((n) => n > 0).slice(0, 4);
    const draw = () => {
      $("#sheetRoot").innerHTML = `<div class="scrim" data-act="closesheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h3 id="sheetTitle">Re-buy · ${esc(p.name)}</h3>
        <div class="presets">${presets.map((n) => `<button data-preset="${n}" aria-pressed="${n === amt}">${rupee(n)}</button>`).join("")}</div>
        <input type="number" inputmode="numeric" id="sheetAmt" value="${amt}" aria-label="Amount in rupees">
        <label class="toggle" for="sheetPaid">
          <span>Paid cash now<small>Leave off if they'll settle at the end</small></span>
          <span class="switch"><input type="checkbox" id="sheetPaid" ${paid ? "checked" : ""}><span></span></span>
        </label>
        <button class="btn brass block" id="sheetSave">Add ${rupee(amt)}</button>
        <button class="btn ghost block" data-act="closesheet">Cancel</button>
      </div>`;
    };
    draw();
    const root = $("#sheetRoot");
    root.onclick = (ev) => {
      const pre = ev.target.closest("[data-preset]");
      if (pre) { amt = Number(pre.dataset.preset); paid = $("#sheetPaid").checked; draw(); return; }
      if (ev.target.closest("[data-act=closesheet]")) { root.innerHTML = ""; return; }
      if (ev.target.closest("#sheetSave")) {
        const v = Math.round(Number($("#sheetAmt").value));
        if (!(v > 0)) { toast("Enter an amount above ₹0"); return; }
        p.ins.push({ id: uid(), amt: v, paid: $("#sheetPaid").checked, initial: false, t: Date.now() });
        root.innerHTML = ""; save(); render();
        toast(p.name + " re-bought " + rupee(v));
      }
    };
    root.oninput = (ev) => {
      if (ev.target.id === "sheetAmt") {
        amt = Number(ev.target.value) || 0;
        $("#sheetSave").textContent = "Add " + rupee(amt);
        root.querySelectorAll("[data-preset]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.preset) === amt)));
      }
    };
  }

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("#toastRoot").innerHTML = ""; }, 2200);
  }

  // ---------- events ----------
  function arm(key) { armed = key; render(); setTimeout(() => { if (armed === key) { armed = null; render(); } }, 3500); }

  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    tab = b.dataset.tab; armed = null; render();
  });

  $("#view").addEventListener("submit", (e) => {
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    const inp = $("#addName"); addPlayer(inp.value); const n = $("#addName"); if (n) n.focus();
  });

  $("#view").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "signin") signIn();
    else if (act === "signout") auth.signOut();
    else if (act === "seg") { seg = b.dataset.seg; openLedger = null; render(); }
    else if (act === "clockout") openClockSheet(id);
    else if (act === "backin") {
      const p = findP(id); p.outAt = null; p.chips = ""; seg = "playing"; save(); render();
      toast(p.name + " is back at the table");
    }
    else if (act === "toggleplay") {
      const name = b.dataset.name;
      const p = S.game.players.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!p) { addPlayer(name); return; }
      if (p.ins.length > 1) { toast(name + " has re-buys. Remove them from their entry first."); return; }
      S.game.players = S.game.players.filter((x) => x !== p);
      if (openLedger === p.id) openLedger = null;
      save(); render(); toast(name + " removed");
    }
    else if (act === "buyin") openSheet(id);
    else if (act === "ledger") { openLedger = openLedger === id ? null : id; armed = null; render(); }
    else if (act === "togglepaid") {
      const en = findP(id).ins.find((x) => x.id === b.dataset.e); en.paid = !en.paid; save(); render();
    } else if (act === "delin") {
      if (armed !== "del" + b.dataset.e) return arm("del" + b.dataset.e);
      const p = findP(id); p.ins = p.ins.filter((x) => x.id !== b.dataset.e); armed = null; save(); render();
    } else if (act === "rmplayer") {
      if (armed !== "rm" + id) return arm("rm" + id);
      S.game.players = S.game.players.filter((p) => p.id !== id); armed = null; openLedger = null; save(); render();
    } else if (act === "gocash") { tab = "cash"; render(); window.scrollTo(0, 0); }
    else if (act === "end") {
      if (armed !== "end") return arm("end");
      armed = null; endGame();
    } else if (act === "copy") {
      const text = summaryText();
      try { await navigator.clipboard.writeText(text); toast("Summary copied. Paste it in your group chat."); }
      catch (err) {
        const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand("copy"); } catch (x) {}
        ta.remove(); toast(ok ? "Summary copied" : "Copy isn't allowed here. Screenshot the balance instead.");
      }
    }
  });

  $("#view").addEventListener("input", (e) => {
    const pid = e.target.dataset.chips;
    if (pid) {
      findP(pid).chips = e.target.value;
      save();
      header();
      $("#resultsBox").innerHTML = resultsHTML(calc());
      return;
    }
    if (e.target.id === "buyInSetting") {
      const v = Math.round(Number(e.target.value));
      if (v > 0) { S.settings.buyIn = v; save(); header(); }
    }
  });
  $("#view").addEventListener("toggle", (e) => { if (e.target.id === "picker") rosterOpen = e.target.open; }, true);
  $("#view").addEventListener("change", (e) => { if (e.target.id === "buyInSetting") render(); });

  setInterval(() => {
    document.querySelectorAll("[data-played]").forEach((el) => { el.textContent = dur(Date.now() - Number(el.dataset.played)); });
  }, 30000);
  render();
  connect();
})();
</script>
</body>
</html>
