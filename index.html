<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }

/* Layout: one phone column. A felt-dark pot panel up top, player rows separated by hairlines,
   mint for money-in actions, amber for leaving the table, bottom tab bar within thumb reach. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --raised: #eef1ed;
  --line: #e0e6e1;
  --fg: #111714;
  --muted: #66736d;
  --panel: #0f2a21;
  --panel-ink: #eef6f1;
  --mint: #2fd194;
  --mint-deep: #18a873;
  --mint-ink: #052117;
  --mint-text: #11885c;
  --amber: #c98a0c;
  --amber-fill: #f6bd3b;
  --amber-soft: #fbf0d6;
  --good: #11885c;
  --good-soft: #dcf4e9;
  --bad: #c9392b;
  --bad-soft: #fbe3df;
  --focus: #18a873;
  --shadow: 0 1px 2px rgba(17, 23, 20, .06);
  --font-display: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090c0b; --surface: #121715; --raised: #1a201d; --line: #232b27;
    --fg: #eef3f0; --muted: #8a9690; --panel: #101815; --panel-ink: #eef3f0;
    --mint: #5ee6a8; --mint-deep: #2fb57c; --mint-ink: #04241a; --mint-text: #5ee6a8;
    --amber: #f5bd3c; --amber-fill: #f5bd3c; --amber-soft: #2e2511;
    --good: #5ee6a8; --good-soft: #10291e; --bad: #ff7b6b; --bad-soft: #33150f;
    --focus: #5ee6a8; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090c0b; --surface: #121715; --raised: #1a201d; --line: #232b27;
  --fg: #eef3f0; --muted: #8a9690; --panel: #101815; --panel-ink: #eef3f0;
  --mint: #5ee6a8; --mint-deep: #2fb57c; --mint-ink: #04241a; --mint-text: #5ee6a8;
  --amber: #f5bd3c; --amber-fill: #f5bd3c; --amber-soft: #2e2511;
  --good: #5ee6a8; --good-soft: #10291e; --bad: #ff7b6b; --bad-soft: #33150f;
  --focus: #5ee6a8; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* ---- web version additions ---- */
.brand .date { margin-left: auto; }
.sharebtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--panel-ink) 22%, transparent); background: color-mix(in srgb, var(--panel-ink) 8%, transparent); color: var(--panel-ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
.sharebtn svg { width: 15px; height: 15px; }
.foot { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.foot p { margin: 0; }
.foot .linkbtn { font-size: 12px; }
.foot .ver { opacity: .6; }
.center { text-align: center; }

/* share sheet */
.sheet.share { gap: 12px; max-height: 92vh; overflow-y: auto; }
.qrbox { align-self: center; background: #fff; padding: 12px; border-radius: 18px; line-height: 0; }
.qrbox img, .qrbox canvas { display: block; width: 184px; height: 184px; }
.linkrow { display: flex; align-items: center; gap: 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; }
.linkrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 14px; }
.linkrow .btn { padding: 8px 14px; font-size: 14px; }
.sharegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
a.btn { text-decoration: none; text-align: center; display: inline-block; }

/* public live view */
.livehead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.lh-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.lh-logo { width: 28px; height: 28px; border-radius: 50%; background: var(--mint); box-shadow: inset 0 0 0 6px var(--mint), inset 0 0 0 9px var(--panel); }
.livepill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; background: var(--surface); }
.livepill i { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .livepill i { animation: none; } }
.livetitle { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.01em; text-align: center; margin: 22px 0 6px; text-wrap: balance; }
.livesec { gap: 14px; }
.livegrid { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.potcard { padding: 22px 24px; display: flex; flex-direction: column; gap: 4px; }
.potcard .k { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.potcard .v { font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 15vw, 76px); line-height: 1; letter-spacing: -.02em; color: var(--mint-text); }
.potcard .sub { color: var(--muted); font-size: 14px; }
.statcard .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.statcard .srow:last-child { border-bottom: 0; }
.statcard .sk { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.statcard .sk svg { width: 20px; height: 20px; }
.statcard .sv { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; }
.statcard .sv small { font-size: 18px; color: var(--muted); font-weight: 700; }
.cardhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.cardhead b { font-family: var(--font-display); font-size: 20px; }
.cardhead span { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.lrow { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow.gone { opacity: .7; }
.rank { width: 30px; height: 30px; flex: none; border-radius: 9px; background: var(--raised); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--muted); }
.lname { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lname b { font-family: var(--font-display); font-weight: 700; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lname small { color: var(--muted); font-size: 13px; }
.pamt { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.lrow .verdict { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.05; }
.lrow .verdict small { display: block; font-family: var(--font-body); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
.feed .frow { display: grid; grid-template-columns: auto auto 1fr; align-items: start; gap: 12px; padding: 11px 20px; border-bottom: 1px solid var(--line); }
.feed .frow:last-child { border-bottom: 0; }
.feed .ft { font-size: 12px; color: var(--muted); padding-top: 3px; min-width: 56px; }
.feed .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--mint); }
.feed .dot.rebuy { background: var(--amber-fill); }
.feed .dot.out { background: var(--muted); }
.feed b { display: block; font-weight: 800; }
.feed small { color: var(--muted); font-size: 13px; }
.transfers.flat { padding: 12px; }
.transfers.flat .tr { box-shadow: none; }

/* room display: a TV or laptop across the room */
body.is-display .wrap { max-width: 1280px; padding-block: 24px 48px; }
@media (min-width: 900px) {
  body.is-display .livegrid { grid-template-columns: 1.3fr 1fr; align-items: start; }
  body.is-display .livetitle { font-size: 44px; }
  body.is-display .potcard { padding: 32px 36px; justify-content: center; min-height: 100%; }
  body.is-display .potcard .v { font-size: 120px; }
  body.is-display .lname b { font-size: 24px; }
  body.is-display .pamt, body.is-display .lrow .verdict { font-size: 28px; }
}
@media (min-width: 720px) {
  .livegrid { grid-template-columns: 1fr 1fr; }
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 128px; }

/* pot panel */
header.top { background: var(--panel); color: var(--panel-ink); border-radius: 22px; padding: 18px 20px 20px; border: 1px solid var(--line); position: relative; overflow: hidden; }
header.top::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--mint) 22%, transparent) 0 15deg, transparent 15deg 45deg);
  -webkit-mask: radial-gradient(circle, transparent 46px, #000 47px, #000 78px, transparent 79px); mask: radial-gradient(circle, transparent 46px, #000 47px, #000 78px, transparent 79px); pointer-events: none; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .01em; margin: 0; line-height: 1; }
.brand .date { font-size: 13px; opacity: .7; }
.pot { margin-top: 18px; position: relative; z-index: 1; }
.pot .k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; opacity: .7; }
.pot .v { display: block; font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1.05; color: var(--mint); letter-spacing: -.01em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
.stat { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, var(--panel-ink) 10%, transparent); }
.stat b { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-right: 2px; }
.stat.warn b { color: var(--amber-fill); }

/* bottom tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 6px; justify-content: center;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabs button { flex: 1; max-width: 264px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: 0; border-radius: 12px; padding: 8px 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--fg); background: var(--raised); }
.tabs button[aria-selected="true"] svg { color: var(--mint-text); }

section { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin: 10px 0 0; font-weight: 700; }

.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; }
input[type="text"], input[type="number"], input[inputmode] {
  background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; width: 100%;
}
input:focus { border-color: var(--mint-deep); outline: none; }

/* buttons */
.btn { border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; font-weight: 800; font-family: var(--font-display); font-size: 17px; letter-spacing: .01em;
  background: var(--raised); color: var(--fg); white-space: nowrap; transition: transform .08s ease; }
.btn:active { transform: translateY(2px); }
.btn.brass { background: linear-gradient(180deg, color-mix(in srgb, var(--mint) 85%, #fff), var(--mint)); color: var(--mint-ink); border-color: transparent; box-shadow: 0 3px 0 var(--mint-deep); }
.btn.brass:active { box-shadow: 0 1px 0 var(--mint-deep); }
.btn.amber { background: var(--raised); color: var(--amber); border-color: var(--line); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.block { width: 100%; padding: 15px; font-size: 18px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

/* who's playing */
details.picker { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 0 14px; box-shadow: var(--shadow); }
details.picker summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 15px 2px; font-family: var(--font-display); font-weight: 700; font-size: 18px; cursor: pointer; list-style: none; }
details.picker summary::-webkit-details-marker { display: none; }
details.picker summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform .15s; }
details.picker[open] summary::after { transform: rotate(-135deg) translateY(-1px); }
details.picker summary .count { margin-left: auto; font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--muted); }
details.picker .addrow { padding-block: 14px 16px; }
.grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 9px 15px; font-size: 15px; font-weight: 700; color: var(--fg); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.pick[aria-pressed="true"]::before { content: "✓ "; }

/* segment */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 11px 0; font-weight: 700; color: var(--muted); }
.seg button span { opacity: .7; margin-left: 4px; }
.seg button[aria-selected="true"] { background: var(--raised); color: var(--fg); box-shadow: var(--shadow); }
.seg button:disabled { opacity: .45; cursor: default; }

/* players */
.players { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.player { border-bottom: 1px solid var(--line); }
.player:last-child { border-bottom: 0; }
.prow { display: flex; align-items: center; gap: 14px; padding: 16px 16px 12px; }
.token { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--mint-text);
  background: color-mix(in srgb, var(--mint) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--mint) 30%, transparent); }
.pinfo { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.pname { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmoney { display: flex; align-items: baseline; gap: 8px; }
.pmoney b { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; }
.pmoney span { color: var(--muted); font-size: 14px; }
.psub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.psub svg { width: 14px; height: 14px; flex: none; }
.owed { color: var(--bad); font-weight: 700; }
.pactions { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; padding: 0 16px 16px; }
.pactions .btn { padding: 13px 10px; }
.player.out .token { color: var(--muted); background: var(--raised); border-color: var(--line); }
.player .verdict, .res .verdict { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; flex: none; }
.player .verdict small, .res .verdict small { display: block; font-family: var(--font-body); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.verdict.pay { color: var(--bad); }
.verdict.get { color: var(--good); }
.verdict.even { color: var(--muted); }

.ledger { margin: 0 16px 16px; padding: 4px 14px 10px; background: var(--raised); border-radius: 14px; display: flex; flex-direction: column; }
.entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.entry:last-of-type { border-bottom: 0; }
.entry .lbl { flex: 1; min-width: 0; }
.entry .lbl small { color: var(--muted); display: block; font-size: 12px; }
.entry .amt { font-weight: 800; }
.pill { border: 0; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 800; letter-spacing: .02em; }
.pill.paid { background: var(--good-soft); color: var(--good); }
.pill.unpaid { background: var(--bad-soft); color: var(--bad); }
.pill.free { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.x { border: 0; background: transparent; color: var(--muted); font-size: 18px; width: 32px; height: 32px; border-radius: 8px; }
.ledger-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px 0; }
.linkbtn.danger { color: var(--bad); }

.empty { text-align: center; color: var(--muted); padding: 30px 18px; border: 1px dashed var(--line); border-radius: 18px; }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 19px; margin-bottom: 4px; }

/* cash out */
.cashrow { display: grid; grid-template-columns: 1fr 128px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.cashrow .pname { font-size: 18px; }
.cashrow input { text-align: right; padding: 11px 12px; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.check { border-radius: 14px; padding: 13px 15px; font-size: 14px; }
.check.ok { background: var(--good-soft); color: var(--good); }
.check.warn { background: var(--bad-soft); color: var(--bad); }
.check b { font-weight: 800; }

.results { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.res:last-child { border-bottom: 0; }
.res .pname { font-size: 18px; }
.res .detail { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

.transfers { display: flex; flex-direction: column; gap: 8px; }
.tr { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 600; }
.tr .arrow { color: var(--mint-text); font-weight: 800; }
.tr .amt { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.tr .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }

<script>

(() => {
  const LS_KEY = "chipbank.state.v1";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rupee = (n) => (n < 0 ? "−" : "") + "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN");
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const fmtDate = (t) => new Date(t).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
  const fmtTime = (t) => new Date(t).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });

  // ---------- state ----------
  const blank = () => ({ settings: { buyIn: 300 }, roster: [], game: null, updatedAt: 0 });
  let S = blank();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

  let tab = "table";
  let openLedger = null;       // player id whose ledger is expanded
  let armed = null;            // key of a destructive button awaiting second tap
  let rosterOpen = null;       // null = auto (open until 2 players are in)
  let seg = "playing";
  const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';         // Table tab list: "playing" or "out"
  const dur = (ms) => { const m = Math.max(0, Math.floor(ms / 60000)); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; };
  let history = [];
  const byName = (a, b) => a.localeCompare(b, "en", { sensitivity: "base" });

  // ---------- firebase ----------
  // Anyone with the link reads chipbank/state live. Only the host emails below can write
  // (enforced by Firestore rules, not just this list).
  const APP_VERSION = "v2.4.0";
  const HOSTS = ["aabhas@naaritive.com", "aabhas.gugnani@gmail.com"];
  firebase.initializeApp({
    apiKey: "AIzaSyCzKgn6bMkKvkO-sFHJQzjoUDYxpaidYc0",
    authDomain: "ledger-naaritive.firebaseapp.com",
    projectId: "ledger-naaritive",
    storageBucket: "ledger-naaritive.firebasestorage.app",
    messagingSenderId: "577025518393",
    appId: "1:577025518393:web:7253e4120fb4d670a596e8",
  });
  const auth = firebase.auth();
  const fs = firebase.firestore();
  // Some mobile networks hold the streaming connection open without delivering; let the SDK fall back to long-polling.
  try { fs.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
  const STATE = fs.collection("chipbank").doc("state");
  const HIST = fs.collection("chipbank").doc("history");

  const VIEW = location.hash === "#display" ? "display" : "app";
  const LIVE_URL = location.origin + location.pathname;
  let user = null;
  let authKnown = false;
  let syncMsg = "";
  // Until Firebase says who this is, guess from this phone's saved data so the host never sees a flash.
  let mode = S.updatedAt && VIEW === "app" ? "owner" : "public";
  let F = null;                 // public view: { game, buyIn, at }
  window.addEventListener("hashchange", () => location.reload());

  const newGame = () => ({ id: uid(), startedAt: Date.now(), players: [] });
  if (!S.game) S.game = newGame();

  const DEFAULT_ROSTER = ["Jagdish", "Dibya", "Naman", "Aakriti", "Aashna", "Mridul", "Avi", "Shivika", "Priyanshi",
    "Addy", "Tushar", "Shrey", "Shubham", "Makhan", "Kunal", "Abhigyan", "Anubhav", "Gaurav T"];
  function mergeRoster() {
    const seen = new Set(DEFAULT_ROSTER.map((n) => n.toLowerCase()));
    S.roster = DEFAULT_ROSTER.concat((S.roster || []).filter((n) => !seen.has(n.toLowerCase())));
  }
  mergeRoster();

  // ---------- persistence ----------
  let writing = false, pending = false;
  async function flush() {
    if (mode !== "owner" || !user || !remoteKnown) return;
    if (writing) { pending = true; return; }
    writing = true;
    try {
      await STATE.set(JSON.parse(JSON.stringify(S)));
      setSync("Synced · friends see this live");
    } catch (e) {
      setSync("Couldn't sync, saved on this phone. Check your connection.");
    }
    writing = false;
    if (pending) { pending = false; flush(); }
  }
  let saveTimer = null;
  function save() {
    if (mode !== "owner") return;
    S.updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 300);
  }
  function setSync(t) { syncMsg = t; footer(); }

  function footer() {
    const el = $("#foot"); if (!el) return;
    let h = "";
    if (mode === "owner") {
      h = `<p>${esc(syncMsg || (user ? "Synced · friends see this live" : "Saved on this phone"))}</p>`;
      h += user ? `<p>Hosting as ${esc(user.email)} · <button class="linkbtn" data-act="signout">Sign out</button></p>`
                : `<p><button class="linkbtn" data-act="signin">Sign in to sync</button></p>`;
    } else {
      h = `<p>Live view · ${lastHeard ? "updated " + ago(lastHeard) : "connecting…"} · <button class="linkbtn" data-act="refresh">Refresh</button></p>`;
      if (VIEW !== "display") {
        if (user && !HOSTS.includes(user.email)) h += `<p>Signed in as ${esc(user.email)} · <button class="linkbtn" data-act="signout">Sign out</button></p>`;
        else if (authKnown && !user) h += `<p><button class="linkbtn" data-act="signin">Host sign-in</button></p>`;
      }
    }
    el.innerHTML = h + `<p class="ver">Chip Bank ${APP_VERSION}</p>`;
  }

  function signIn() {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => {
      if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("Sign-in didn't work: " + (e.message || e.code));
    });
  }

  // The live game in Firestore wins unless this phone holds newer changes (made offline or before signing in).
  // Never write before the live copy has loaded, or a fresh device would overwrite the game with nothing.
  let remote = null, remoteKnown = false;
  function reconcile() {
    if (mode !== "owner" || !user || !remoteKnown) return;
    const rAt = (remote && remote.updatedAt) || 0, lAt = S.updatedAt || 0;
    if (remote && rAt > lAt) {
      S = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
      if (!S.game) S.game = newGame();
      mergeRoster();
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      render();
    } else if (lAt > rAt) flush();
  }

  function connect() {
    auth.onAuthStateChanged((u) => {
      user = u; authKnown = true;
      const isHost = !!(u && HOSTS.includes(u.email));
      const next = isHost && VIEW === "app" ? "owner" : "public";
      if (next !== mode) { mode = next; render(); }
      else footer();
      reconcile();
      tpgAuth(u);
    });
    STATE.onSnapshot(onState, () => { if (mode !== "owner") { F = F || { game: null, at: 0 }; render(); } else setSync("Offline, saved on this phone"); });
    tpConnect();
    tpgConnect();
    HIST.onSnapshot((snap) => {
      history = snap.exists ? (snap.data().games || []) : [];
      if (mode !== "owner" || tab === "table") render();
    }, () => {});
  }

  function onState(snap) {
      lastHeard = Date.now();
      if (snap.metadata.hasPendingWrites) return;
      remote = snap.exists ? snap.data() : null;
      remoteKnown = true;
      const r = remote;
      F = r && r.game ? { game: r.game, buyIn: (r.settings && r.settings.buyIn) || 300, at: r.updatedAt || 0 } : (F || { game: null, buyIn: 300, at: 0 });
      if (mode === "owner") reconcile();
      else render();
  }

  // ---- keeping other phones fresh ----
  // A locked phone or a backgrounded browser drops the live connection and can take a long time to
  // notice. When the page comes back, reconnect and fetch straight from the server, and check in
  // every 20 seconds as a backup while the page is open.
  let lastHeard = 0;
  function refreshNow(light) {
    STATE.get({ source: "server" }).then(onState).catch(() => {});
    TPDOC.get({ source: "server" }).then(onTP).catch(() => {});
    if (!light) LOBBY.get({ source: "server" }).then(onLobby).catch(() => {});   // skipped on the timer to save database reads
  }
  // ---- stay on the latest version ----
  // GitHub Pages lets phones cache the page for ~10 minutes (home-screen apps can hold it longer),
  // so check for a newer build whenever the page is opened and offer a one-tap update.
  let newVersion = null;
  function checkVersion() {
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then((res) => res.text()).then((html) => {
      const m = html.match(/const APP_VERSION = "(v[\d.]+)"/);
      if (m && m[1] !== APP_VERSION && m[1] !== newVersion) { newVersion = m[1]; showUpdateBar(); }
    }).catch(() => {});
  }
  function showUpdateBar() {
    let bar = document.getElementById("updateBar");
    if (!bar) { bar = document.createElement("div"); bar.id = "updateBar"; bar.className = "updatebar"; document.body.appendChild(bar); }
    bar.innerHTML = `<span>A new version of Chip Bank is ready (${esc(newVersion)})</span><button class="btn brass" id="updateNow">Update</button>`;
    document.getElementById("updateNow").onclick = () => { location.replace(location.pathname + "?v=" + Date.now() + location.hash); };
  }
  setTimeout(checkVersion, 4000);
  setInterval(() => { if (document.visibilityState === "visible") checkVersion(); }, 5 * 60000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    checkVersion();
    fs.disableNetwork().then(() => fs.enableNetwork()).then(() => refreshNow(), () => refreshNow());
  });
  window.addEventListener("online", () => refreshNow());
  setInterval(() => {
    if (document.visibilityState === "visible" && Date.now() - lastHeard > 18000) refreshNow(true);
  }, 20000);
  setInterval(() => { if (mode !== "owner") footer(); }, 5000);
  const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 5 ? "just now" : s < 60 ? s + "s ago" : Math.round(s / 60) + "m ago"; };

  // ---------- teen patti ----------
  // Open Teen Patti: every hand is dealt face up from one shuffled 52-card deck and judged by the app.
  /* TP-ENGINE-START */
  // Each variation is described by data, so the dealer, the open table and the online table all judge it the same way.
  //   low: lowest hand wins · cards: cards dealt per player · wildRanks: ranks that are always jokers
  //   rel: "low"/"high" makes every card of the hand's lowest/highest remaining rank a joker
  //   drawn: one card drawn face up decides the joker rank · p999: the 999 points game
  //   split: "highlow" splits the pot between best and worst · stud: first card is dealt face up
  const TP_VARIANTS = {
    classic: { name: "Classic", desc: "Highest hand wins: Trail, Pure sequence, Sequence, Colour, Pair, High card." },
    joker: { name: "Joker", drawn: true, desc: "One card is drawn face up as the joker. Every card of that rank in a hand counts as anything." },
    muflis: { name: "Muflis", low: true, desc: "Lowest hand wins. The full ranking is turned upside down, so 5-3-2 of mixed suits is the best hand." },
    kinglittle: { name: "King Little", wildRanks: [13], rel: "low", desc: "All Kings and the lowest card in each hand are jokers and count as anything. If the lowest rank appears twice, both are jokers." },
    ak47: { name: "AK47", wildRanks: [14, 13, 4, 7], desc: "Every Ace, King, 4 and 7 is a joker and counts as anything." },
    v1942: { name: "1942", wildRanks: [14, 9, 4, 2], desc: "Every Ace, 9, 4 and 2 is a joker and counts as anything." },
    lowjoker: { name: "Lowest card joker", rel: "low", desc: "The lowest card in each hand is a joker. If the lowest rank appears twice, both are jokers." },
    highmuflis: { name: "Highest joker (Muflis)", rel: "high", low: true, desc: "The highest card in each hand is a joker, and the lowest hand wins: 5-3-2 of mixed suits is best. A joker becomes whatever makes your hand lower." },
    bestof4: { name: "Best of Four", cards: 4, desc: "Everyone gets 4 cards and plays their best 3. The spare card is dimmed." },
    v999: { name: "999", p999: true, desc: "Ace = 1, 2 to 9 face value, 10 and picture cards = 0. Your cards make the biggest 3-digit number they can; closest to 999 wins." },
    highlow: { name: "High-Low", split: "highlow", desc: "The best hand and the worst hand split the pot. No sideshows, since a weak hand can still win half." },
    stud: { name: "Stud", stud: true, desc: "Each player's first card is dealt face up for everyone to see. Normal ranking." },
  };
  const VAR = (v) => TP_VARIANTS[v] || TP_VARIANTS.classic;
  const cardsPer = (v) => VAR(v).cards || 3;
  const RN = { 14: "A", 13: "K", 12: "Q", 11: "J" };
  const rn = (r) => RN[r] || String(r);
  const PLURAL = { 14: "Aces", 13: "Kings", 12: "Queens", 11: "Jacks" };
  const plural = (r) => PLURAL[r] || r + "s";
  const SUIT = { S: "♠", H: "♥", D: "♦", C: "♣" };
  const SUIT_NAME = { S: "spades", H: "hearts", D: "diamonds", C: "clubs" };
  const parseCard = (c) => ({ r: Number(c.slice(0, -1)), s: c.slice(-1) });
  const ALL_CARDS = [];
  for (const s of "SHDC") for (let r = 2; r <= 14; r++) ALL_CARDS.push({ r, s });

  // Score arrays compare left to right. Category: 6 Trail, 5 Pure sequence, 4 Sequence, 3 Colour, 2 Pair, 1 High card.
  // Sequence strength: A-K-Q = 15, A-2-3 = 14 (second best), K-Q-J = 13 … 4-3-2 = 4.
  function score3(cards) {
    const rs = cards.map((c) => c.r).sort((a, b) => b - a);
    const flush = cards[0].s === cards[1].s && cards[1].s === cards[2].s;
    if (rs[0] === rs[2]) return [6, rs[0]];
    let seq = 0;
    if (rs[0] - 1 === rs[1] && rs[1] - 1 === rs[2]) seq = rs[0] === 14 ? 15 : rs[0];
    else if (rs[0] === 14 && rs[1] === 3 && rs[2] === 2) seq = 14;
    if (seq && flush) return [5, seq];
    if (seq) return [4, seq];
    if (flush) return [3, rs[0], rs[1], rs[2]];
    if (rs[0] === rs[1]) return [2, rs[0], rs[2]];
    if (rs[1] === rs[2]) return [2, rs[1], rs[0]];
    return [1, rs[0], rs[1], rs[2]];
  }
  function cmpScore(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const d = (a[i] || 0) - (b[i] || 0);
      if (d) return d;
    }
    return 0;
  }
  // Which of these cards are jokers. Works on a partial hand too (used while cards are being revealed).
  function wildFlags(cards, variant, joker) {
    const V = VAR(variant);
    const jr = V.drawn && joker ? parseCard(joker).r : null;
    const flags = cards.map((c) => c.r === jr || (V.wildRanks || []).includes(c.r));
    if (V.rel) {
      // every card of the lowest (or highest) rank among the non-joker cards: 4-4-6 makes both 4s jokers
      const rest = cards.filter((c, i) => !flags[i]).map((c) => c.r);
      if (rest.length) {
        const t = V.rel === "low" ? Math.min(...rest) : Math.max(...rest);
        cards.forEach((c, i) => { if (c.r === t) flags[i] = true; });
      }
    }
    return flags;
  }
  // Jokers become whatever card makes the best hand, or the lowest hand when `low` (Muflis-style games).
  function bestScore(cards, flags, low) {
    const nat = cards.filter((c, i) => !flags[i]);
    const w = 3 - nat.length;
    if (w === 0) return score3(cards);
    if (!low && w === 3) return [6, 14];
    if (!low && w === 2) return [6, nat[0].r];
    if (low && w === 3) return [1, 5, 3, 2];
    let best = null;
    const better = (s) => !best || (low ? cmpScore(s, best) < 0 : cmpScore(s, best) > 0);
    const fill = (hand) => {
      if (hand.length === 3) { const s = score3(hand); if (better(s)) best = s; return; }
      for (const c of ALL_CARDS) fill(hand.concat([c]));
    };
    fill(nat);
    return best;
  }
  function seqName(v) { return v === 15 ? "A-K-Q" : v === 14 ? "A-2-3" : `${rn(v)}-${rn(v - 1)}-${rn(v - 2)}`; }
  function handLabel(sc) {
    switch (sc[0]) {
      case 6: return "Trail of " + plural(sc[1]);
      case 5: return "Pure sequence " + seqName(sc[1]);
      case 4: return "Sequence " + seqName(sc[1]);
      case 3: return "Colour, " + rn(sc[1]) + " high";
      case 2: return "Pair of " + plural(sc[1]);
      default: return sc.length === 4 ? `${rn(sc[1])}-${rn(sc[2])}-${rn(sc[3])}, ${rn(sc[1])} high` : rn(sc[1]) + " high";
    }
  }
  const val999 = (c) => (c.r === 14 ? 1 : c.r >= 10 ? 0 : c.r);
  // The whole hand judged for its variation: score, which cards are jokers, which cards count (Best of Four), a label.
  function handEval(cardStrs, variant, joker) {
    const V = VAR(variant);
    const cards = cardStrs.map(parseCard);
    if (V.p999) {
      const d = cards.map(val999).sort((a, b) => b - a);
      const num = d[0] * 100 + d[1] * 10 + d[2];
      return { sc: [num], wild: cards.map(() => false), used: cards.map(() => true), label: "Makes " + String(num).padStart(3, "0") };
    }
    const sets = cards.length === 3 ? [[0, 1, 2]] : [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]];
    let best = null;
    for (const ix of sets) {
      const sub = ix.map((i) => cards[i]);
      const f = wildFlags(sub, variant, joker);
      const sc = bestScore(sub, f, !!V.low);
      if (!best || (V.low ? cmpScore(sc, best.sc) < 0 : cmpScore(sc, best.sc) > 0)) best = { sc, ix, f };
    }
    const wild = cards.map(() => false), used = cards.map(() => false);
    best.ix.forEach((i, k) => { used[i] = true; wild[i] = best.f[k]; });
    return { sc: best.sc, wild, used, label: handLabel(best.sc) + (wild.some(Boolean) ? " (with joker)" : "") };
  }
  // Positive when hand a beats hand b in this variation.
  function cmpHands(a, b, variant, joker) {
    const c = cmpScore(handEval(a, variant, joker).sc, handEval(b, variant, joker).sc);
    return VAR(variant).low ? -c : c;
  }
  function judgeRound(round) {
    const V = VAR(round.variant);
    const rows = round.hands.map((h) => {
      const e = handEval(h.cards, round.variant, round.joker);
      return { id: h.id, name: h.name, cards: h.cards.map(parseCard), wild: e.wild, used: e.used, sc: e.sc, label: e.label };
    });
    const dir = V.low ? 1 : -1;
    rows.sort((a, b) => dir * cmpScore(a.sc, b.sc) || byName(a.name, b.name));
    rows.forEach((r) => { r.win = cmpScore(r.sc, rows[0].sc) === 0; r.lowWin = false; });
    if (V.split === "highlow" && rows.length > 1) {
      const last = rows[rows.length - 1].sc;
      rows.forEach((r) => { r.lowWin = cmpScore(r.sc, last) === 0; });
    }
    return rows;
  }
/* TP-ENGINE-END */

  const TPDOC = fs.collection("chipbank").doc("teenpatti");
  const LOBBY = fs.collection("chipbank").doc("tp_lobby");
  let TP = null;               // current round { n, variant, dealtAt, joker, hands:[{id,name,cards}] }
  let LOBBY_P = {};            // { id: { name, t } }
  let tpLoaded = false;
  let liveTab = "game";
  let me = null;
  try { me = JSON.parse(localStorage.getItem("chipbank.me") || "null"); } catch (e) {}
  const lobbyList = () => Object.entries(LOBBY_P).map(([id, p]) => ({ id, name: p.name, t: p.t || 0 })).sort((a, b) => a.t - b.t);
  const tpVariant = () => (S.settings && S.settings.tpVariant) || "classic";

  function tpConnect() {
    TPDOC.onSnapshot(onTP, () => {});
    LOBBY.onSnapshot(onLobby, () => {});
  }
  function onTP(snap) {
      lastHeard = Date.now();
      const prev = TP ? TP.n : null;
      TP = snap.exists ? snap.data() : null;
      if (tpLoaded && TP && TP.n !== prev && !(TP.n in revealAt)) {
        // a fresh deal: reveal it card by card, unless it is old news (phone was asleep for a while)
        revealAt[TP.n] = Date.now() - (TP.dealtAt || 0) < 120000 ? Date.now() : -Infinity;
        if (mode !== "owner") liveTab = "tp";
      }
      tpLoaded = true;
      render();
  }
  function onLobby(snap) {
      lastHeard = Date.now();
      LOBBY_P = (snap.exists && snap.data().players) || {};
      render();
  }

  function lobbyAdd(name, id) {
    name = String(name || "").trim().replace(/\s+/g, " ").slice(0, 24);
    if (!name) return Promise.resolve(null);
    const dup = lobbyList().find((p) => p.name.toLowerCase() === name.toLowerCase());
    if (dup) return Promise.resolve(dup.id);
    id = id || "p_" + uid();
    LOBBY_P = Object.assign({}, LOBBY_P, { [id]: { name, t: Date.now() } });
    render();
    return LOBBY.set({ players: { [id]: { name, t: Date.now() } } }, { merge: true }).then(() => id)
      .catch(() => { toast("Couldn't add " + name + ". Check your connection."); return null; });
  }
  function lobbyRemove(id) {
    const next = Object.assign({}, LOBBY_P); delete next[id]; LOBBY_P = next; render();
    LOBBY.update({ ["players." + id]: firebase.firestore.FieldValue.delete() }).catch(() => {});
  }

  function shuffledDeck() {
    const deck = ALL_CARDS.map((c) => c.r + c.s);
    const rnd = new Uint32Array(deck.length);
    crypto.getRandomValues(rnd);
    for (let i = deck.length - 1; i > 0; i--) { const j = rnd[i] % (i + 1); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    return deck;
  }
  function deal() {
    const players = lobbyList();
    const variant = tpVariant();
    if (players.length < 2) { toast("Add at least 2 players to deal"); return; }
    const per = cardsPer(variant);
    const max = Math.floor((52 - (variant === "joker" ? 1 : 0)) / per);
    if (players.length > max) { toast(`One deck fits ${max} players${variant === "joker" ? " with a joker" : ""}`); return; }
    const deck = shuffledDeck();
    const hands = players.map((p) => ({ id: p.id, name: p.name, cards: [] }));
    for (let k = 0; k < per; k++) hands.forEach((h) => h.cards.push(deck.pop()));
    const round = { n: ((TP && TP.n) || 0) + 1, variant, dealtAt: Date.now(), joker: variant === "joker" ? deck.pop() : null, hands };
    TP = round; revealAt[round.n] = Date.now(); render();
    TPDOC.set(round).catch(() => toast("Couldn't share the deal. Check your connection."));
  }

  // ---- one-by-one reveal ----
  // Each device starts the reveal when the deal reaches it, so every phone turns cards at the same pace.
  // A round that was already on screen when the page opened shows in full.
  const revealAt = {};
  const revealStep = (total) => Math.max(350, Math.min(900, Math.round(16000 / total)));
  function revealedCount(round) {
    const total = round.hands.length * (round.hands[0] ? round.hands[0].cards.length : 3) + (round.joker ? 1 : 0);
    const start = round.n in revealAt ? revealAt[round.n] : -Infinity;
    if (start === -Infinity) return total;
    return Math.min(total, Math.floor((Date.now() - start) / revealStep(total)) + 1);
  }
  let lastShown = null;
  setInterval(() => {
    if (!TP || !TP.hands || !(TP.n in revealAt)) return;
    const onScreen = mode === "owner" ? tab === "tp" : liveTab === "tp";
    const k = TP.n + ":" + revealedCount(TP);
    if (onScreen && k !== lastShown) { lastShown = k; render(); }
  }, 100);
  const backHTML = () => `<span class="pc back" aria-label="Face-down card"></span>`;

  function cardHTML(c, wild, delay, anim, extra) {
    return `<span class="pc ${c.s === "H" || c.s === "D" ? "red" : ""} ${wild ? "wild" : ""} ${anim ? "deal" : ""} ${extra || ""}" style="--d:${delay}" role="img" aria-label="${rn(c.r)} of ${SUIT_NAME[c.s]}${wild ? ", joker" : ""}">
      <b>${rn(c.r)}</b><i>${SUIT[c.s]}</i>${wild ? "<em>Joker</em>" : ""}</span>`;
  }

  function viewTP(host) {
    let h = `<section class="tp">`;
    if (host) {
      const v = tpVariant();
      const list = lobbyList();
      const inLobby = new Set(list.map((p) => p.name.toLowerCase()));
      const atTable = S.game.players.filter((p) => !p.outAt && !inLobby.has(p.name.toLowerCase()));
      h += `<div class="tpsetup">
        <label class="tpvar" for="tpVariant"><span>Variation</span>
          <select id="tpVariant">${Object.entries(TP_VARIANTS).map(([k, x]) => `<option value="${k}" ${k === v ? "selected" : ""}>${x.name}</option>`).join("")}</select>
        </label>
        <p class="sheetnote">${TP_VARIANTS[v].desc}</p>
      </div>
      <div class="card tplobby">
        <div class="cardhead"><b>Players in</b><span class="num">${list.length} joined</span></div>
        ${list.length ? `<div class="tpchips">${list.map((p) => `<span class="tpchip">${esc(p.name)}<button data-act="tprm" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join("")}</div>`
          : `<p class="sheetnote tppad">Friends can tap Join on the shared link, or add people below.</p>`}
        <div class="tpadd">
          ${atTable.length ? `<button class="btn ghost" data-act="tpaddtable">Add everyone at the table (${atTable.length})</button>` : ""}
          <form class="addrow" id="tpAddForm" autocomplete="off">
            <input type="text" id="tpAddName" placeholder="Add a player by name" aria-label="Player name" list="tpRoster" enterkeyhint="done">
            <datalist id="tpRoster">${S.roster.slice().sort(byName).map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>
            <button class="btn" type="submit">Add</button>
          </form>
          ${list.length ? `<button class="linkbtn" data-act="tpclear">${armed === "tpclear" ? "Tap again to clear everyone" : "Clear all players"}</button>` : ""}
        </div>
      </div>
      <button class="btn brass block" data-act="tpdeal" ${list.length < 2 ? "disabled" : ""}>${TP ? "Deal next round" : "Deal cards"}</button>`;
    } else {
      const mine = me && LOBBY_P[me.id];
      h += mine
        ? `<div class="card tpjoin in"><div><b>You're in as ${esc(mine.name)}</b><small>Your hand shows up here when the host deals.</small></div><button class="btn ghost" data-act="tpleave">Leave</button></div>`
        : `<form class="card tpjoin" id="tpJoinForm" autocomplete="off"><div><b>Join the next deal</b><small>Pick your name and wait for the host to deal.</small></div>
            <div class="addrow"><input type="text" id="tpJoinName" placeholder="Your name" aria-label="Your name" list="tpRoster2" enterkeyhint="go" value="${esc(me ? me.name : "")}">
            <datalist id="tpRoster2">${DEFAULT_ROSTER.slice().sort(byName).map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>
            <button class="btn brass" type="submit">Join</button></div></form>`;
      const list = lobbyList();
      if (list.length) h += `<p class="sheetnote">In for the next deal: ${list.map((p) => esc(p.name)).join(", ")}</p>`;
    }

    if (TP && TP.hands && TP.hands.length) {
      const judged = judgeRound(TP);
      const n = TP.hands.length;
      const jk = TP.joker ? 1 : 0;                 // the joker card turns over first
      const per = TP.hands[0].cards.length;
      const V = VAR(TP.variant);
      const total = n * per + jk;
      const shown = revealedCount(TP);
      const done = shown >= total;
      const order = new Map(TP.hands.map((x, i) => [x.id, i]));
      // While dealing, keep seats in dealing order; once every card is up, rank them.
      const rows = done ? judged : judged.slice().sort((x, y) => order.get(x.id) - order.get(y.id));
      const winners = judged.filter((x) => x.win);
      const lows = judged.filter((x) => x.lowWin);
      const jc = TP.joker ? parseCard(TP.joker) : null;
      h += `<div class="tpround">
        <div class="tphead"><span class="tag">Round ${TP.n}</span><span class="tag">${TP_VARIANTS[TP.variant] ? TP_VARIANTS[TP.variant].name : TP.variant}</span><span class="asof">Dealt ${fmtTime(TP.dealtAt)}</span></div>
        ${TP.variant !== "classic" ? `<p class="sheetnote">${esc(V.desc)}</p>` : ""}
        ${jc ? `<div class="jokerline">${shown >= 1 ? cardHTML(jc, false, 0, shown === 1) : backHTML()}<div><b>${shown >= 1 ? "Joker: every " + rn(jc.r) : "Drawing the joker…"}</b><small>${shown >= 1 ? "Any " + rn(jc.r) + " in a hand counts as any card." : "One card decides the joker for this round."}</small></div></div>` : ""}
        ${done
          ? (V.split === "highlow" && n > 1
            ? `<div class="winbanner"><span>High-Low · pot split</span><b>${winners.map((w) => esc(w.name)).join(" & ")} <i class="hl">High</i></b><small>${esc(winners[0].label)}</small><b>${lows.map((w) => esc(w.name)).join(" & ")} <i class="hl">Low</i></b><small>${esc(lows[0].label)}</small></div>`
            : `<div class="winbanner"><span>${winners.length > 1 ? "Split pot" : "Winner"}${V.low ? " · lowest hand" : ""}</span><b>${winners.map((w) => esc(w.name)).join(" & ")}</b><small>${esc(winners[0].label)}</small></div>`)
          : `<div class="winbanner dealing"><span>Dealing</span><b class="num">${shown} of ${total} cards</b><button class="linkbtn" data-act="tpskip">Show all now</button></div>`}
        <div class="card tphands">` + rows.map((x, i) => {
          const seat = order.get(x.id);
          const isMe = me && me.id === x.id;
          const idx = (k) => jk + k * n + seat;    // round-robin, one card per player per pass
          const full = idx(per - 1) < shown;
          // King Little mid-deal: judge jokers only from the cards face up so far, so the badge never
          // gives away whether a lower card is still coming.
          const up = x.cards.map((c, k) => idx(k) < shown);
          let wildNow = x.wild;
          if (!full && V.rel) {
            const f = wildFlags(x.cards.filter((c, k) => up[k]), TP.variant, TP.joker);
            let j = 0;
            wildNow = x.cards.map((c, k) => (up[k] ? f[j++] : false));
          }
          return `<div class="tprow ${done && x.win ? "win" : ""} ${done && x.lowWin ? "lowwin" : ""} ${isMe ? "me" : ""}">
            <span class="rank num">${done ? i + 1 : seat + 1}</span>
            <div class="tpwho"><b>${esc(x.name)}${isMe ? ` <span class="tag">You</span>` : ""}${done && x.lowWin ? ` <span class="tag">Low</span>` : ""}</b><small>${full ? esc(x.label) : "&nbsp;"}</small></div>
            <div class="tpcards">${x.cards.map((c, k) => up[k] ? cardHTML(c, wildNow[k], 0, idx(k) === shown - 1, full && !x.used[k] ? "unused" : "") : backHTML()).join("")}</div>
          </div>`;
        }).join("") + `</div></div>`;
    } else if (!host) {
      h += `<div class="empty"><strong>Waiting for the host to deal</strong>Everyone's three cards appear here, face up, the moment they're dealt.</div>`;
    }
    return h + `</section>`;
  }

  async function tpJoin(name) {
    name = String(name || "").trim();
    if (!name) { toast("Type your name to join"); return; }
    const existing = lobbyList().find((p) => p.name.toLowerCase() === name.toLowerCase());
    const id = existing ? existing.id : await lobbyAdd(name, me && me.name.toLowerCase() === name.toLowerCase() ? me.id : null);
    if (!id) return;
    me = { id, name: existing ? existing.name : name };
    try { localStorage.setItem("chipbank.me", JSON.stringify(me)); } catch (e) {}
    render(); toast("You're in. Wait for the host to deal.");
  }

  // ---------- online teen patti: everyone on their own phone ----------
  // The host's phone is the dealer. It shuffles, keeps the deck, applies every move and judges hands.
  // Players send moves through their own tpg_moves/{uid} doc. A player's cards are written to their
  // private tpg_hands/{uid} doc only when they choose to see them, so a blind player can't peek early.
  const TPG = fs.collection("tpg").doc("table");
  const SECRET = fs.collection("tpg_secret").doc("deck");
  const MOVES = fs.collection("tpg_moves");
  const HANDS = fs.collection("tpg_hands");
  let T = null;                 // public table state
  let tLoaded = false;
  let SEC = null;               // dealer only: { n, hands: { uid: [cards] } }
  let myHand = null;            // my private doc { n, cards, peek }
  let myPending = 0;            // seq of my last move that the dealer hasn't applied yet
  let lastLocalSeq = 0;
  let moveQueue = [];
  let handUnsub = null, movesUnsub = null;
  let lastTurnNotice = null;
  const tpgDefaults = () => ({ status: "lobby", settings: { boot: 10, blindRounds: 2, potLimit: 0, variant: "classic" }, seats: [], scores: {}, dealer: -1, hand: null, lastSeq: {}, lastErr: null, hostAlive: 0, updatedAt: 0 });
  const isDealer = () => !!(user && HOSTS.includes(user.email) && VIEW === "app");
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const nameOf = (uid) => { const s = T && T.seats.find((x) => x.uid === uid); return s ? s.name : "Someone"; };
  const cleanName = (n) => String(n || "").trim().replace(/\s+/g, " ").slice(0, 20);

  const labelOf = (cards, variant, joker) => handEval(cards, variant, joker).label;

  // ---- connection ----
  function tpgConnect() {
    TPG.onSnapshot((snap) => {
      if (snap.metadata.hasPendingWrites) return;
      const r = snap.exists ? snap.data() : null;
      const prevN = T && T.hand ? T.hand.n : null;
      if (!isDealer() || !T || (r && (r.updatedAt || 0) > (T.updatedAt || 0))) T = r;
      if (!tLoaded) { tLoaded = true; const q = moveQueue; moveQueue = []; q.forEach(([u, m]) => dealerMove(u, m)); }
      if (T && user) {
        const ls = (T.lastSeq || {})[user.uid] || 0;
        if (myPending && ls >= myPending) {
          if (T.lastErr && T.lastErr.uid === user.uid && T.lastErr.seq === myPending) toast(T.lastErr.text);
          myPending = 0;
        }
        const H = T.hand;
        const seated = T.seats.some((s) => s.uid === user.uid);
        if (H && H.n !== prevN && prevN !== null && seated && mode !== "owner") liveTab = "play";
        if (H && !H.result && H.turn === user.uid && lastTurnNotice !== H.n + ":" + H.log.length) {
          lastTurnNotice = H.n + ":" + H.log.length;
          if (!document.hidden) { try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} }
        }
      }
      render();
    }, () => { tLoaded = true; render(); });
  }

  function tpgAuth(u) {
    if (handUnsub) { handUnsub(); handUnsub = null; }
    if (movesUnsub) { movesUnsub(); movesUnsub = null; }
    myHand = null;
    if (!u) { render(); return; }
    handUnsub = HANDS.doc(u.uid).onSnapshot((s) => { myHand = s.exists ? s.data() : null; render(); }, () => {});
    if (isDealer()) {
      SECRET.get().then((s) => { if (s.exists && !SEC) SEC = s.data(); }).catch(() => {});
      movesUnsub = MOVES.onSnapshot((qs) => {
        qs.docChanges().forEach((ch) => { if (ch.type !== "removed") dealerMove(ch.doc.id, ch.doc.data()); });
      }, () => {});
      keepAwake();
    }
    render();
  }

  // Dealer writes go out one at a time, in order.
  let tChain = Promise.resolve();
  function commitT() {
    T.updatedAt = Date.now(); T.hostAlive = Date.now();
    const snap = clone(T);
    tChain = tChain.then(() => TPG.set(snap)).catch(() => toast("Couldn't reach the table. Check your connection."));
    render();
  }
  setInterval(() => { if (isDealer() && T && T.seats && T.seats.length && document.visibilityState === "visible") commitT(); }, 25000);

  let wakeLock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && isDealer()) keepAwake(); });

  // ---- sending moves ----
  function sendMove(type, extra) {
    if (!user) { toast("Sign in to play"); return; }
    const seq = Math.max(Date.now(), lastLocalSeq + 1); lastLocalSeq = seq;
    const m = Object.assign({ seq, type, n: T && T.hand ? T.hand.n : 0, ts: Date.now() }, extra || {});
    myPending = seq; render();
    if (isDealer()) { dealerMove(user.uid, m); myPending = 0; render(); return; }   // applied right here; no round trip to wait for
    MOVES.doc(user.uid).set(m).catch(() => { myPending = 0; render(); toast("Couldn't send that. Check your connection."); });
    setTimeout(() => { if (myPending === seq) { myPending = 0; render(); } }, 15000);
  }

  // ---- the dealer ----
  function dealerMove(uid, m) {
    if (!isDealer()) return;
    if (!tLoaded) { moveQueue.push([uid, m]); return; }
    if (!T) T = tpgDefaults();
    T.lastSeq = T.lastSeq || {};
    if (!m || !m.seq || m.seq <= (T.lastSeq[uid] || 0)) return;
    T.lastSeq[uid] = m.seq;
    const err = applyMove(uid, m);
    T.lastErr = err ? { uid, seq: m.seq, text: err } : null;
    if (err && uid === user.uid) toast(err);
    commitT();
  }

  function tpgLog(uid, text) {
    const H = T.hand; if (!H) return;
    H.log.push({ t: Date.now(), who: uid ? nameOf(uid) : null, text });
    if (H.log.length > 40) H.log = H.log.slice(-40);
  }
  const tpgActive = () => T.hand.order.filter((u) => !T.hand.p[u].out);
  function nextActive(uid) {
    const o = T.hand.order, i = o.indexOf(uid);
    for (let k = 1; k <= o.length; k++) { const u = o[(i + k) % o.length]; if (!T.hand.p[u].out) return u; }
    return null;
  }
  function prevActive(uid) {
    const o = T.hand.order, i = o.indexOf(uid);
    for (let k = 1; k < o.length; k++) { const u = o[(i - k + o.length) % o.length]; if (!T.hand.p[u].out) return u; }
    return null;
  }
  function pay(uid, amt) { T.hand.p[uid].put += amt; T.hand.pot += amt; }
  function writeHand(uid, data) { HANDS.doc(uid).set(data, { merge: true }).catch(() => {}); }
  function revealTo(uid) { writeHand(uid, { n: T.hand.n, cards: SEC.hands[uid] }); }

  function startHand() {
    if (!T) T = tpgDefaults();
    if (T.hand && !T.hand.result) return "Finish the current hand first";
    if (T.seats.length < 2) return "At least 2 players need to sit down";
    const v = T.settings.variant || "classic";
    const per = cardsPer(v);
    const max = Math.floor((52 - (v === "joker" ? 1 : 0)) / per);
    if (T.seats.length > max) return `One deck fits ${max} players`;
    T.dealer = (T.dealer + 1) % T.seats.length;
    const order = [];
    for (let i = 1; i <= T.seats.length; i++) order.push(T.seats[(T.dealer + i) % T.seats.length].uid);
    const deck = shuffledDeck();
    const hands = {};
    for (let k = 0; k < per; k++) order.forEach((u) => (hands[u] = hands[u] || []).push(deck.pop()));
    const joker = v === "joker" ? deck.pop() : null;   // a random card: the next one off the same shuffled deck
    const n = ((T.hand && T.hand.n) || 0) + 1;
    const boot = Math.max(1, Math.round(Number(T.settings.boot) || 10));
    const p = {};
    order.forEach((u) => { p[u] = { seen: false, out: false, put: boot, blindTurns: 0 }; });
    // Stud: everyone's first card is dealt face up, so it goes in the public table doc.
    const open = VAR(v).stud ? Object.fromEntries(order.map((u) => [u, hands[u][0]])) : null;
    T.hand = { n, order, joker, variant: v, p, pot: boot * order.length, stake: boot, turn: order[0], side: null, log: [], result: null, open };
    T.status = "hand";
    SEC = { n, hands };
    SECRET.set(SEC).catch(() => {});
    order.forEach((u) => HANDS.doc(u).set({ n, cards: null, peek: null }).catch(() => {}));
    tpgLog(null, `Hand ${n} dealt. Everyone put in the ${rupee(boot)} boot.`);
    return null;
  }

  function applyMove(uid, m) {
    const H = T.hand;
    const seat = T.seats.find((s) => s.uid === uid);
    if (m.type === "join") {
      const name = cleanName(m.name) || "Player";
      if (T.seats.some((x) => x.uid !== uid && x.name.toLowerCase() === name.toLowerCase())) return `Someone is already sitting as ${name}. Add your surname or initial.`;
      if (seat) { seat.name = name; return null; }
      if (T.seats.length >= 17) return "The table is full";
      T.seats.push({ uid, name });
      if (!(uid in T.scores)) T.scores[uid] = 0;
      return null;
    }
    if (m.type === "leave") {
      if (!seat) return null;
      if (H && !H.result && H.p[uid] && !H.p[uid].out) packPlayer(uid, "left the table");
      T.seats = T.seats.filter((s) => s.uid !== uid);
      return null;
    }
    if (!H || H.result) return "No hand is being played right now";
    const p = H.p[uid];
    if (!p || p.out) return "You're not in this hand";
    if (m.n && m.n !== H.n) return "That was for an earlier hand";
    if (!SEC || SEC.n !== H.n) return "The dealer lost track of this hand's cards. Ask the host to deal again.";
    if (m.type === "see") {
      if (!p.seen) { p.seen = true; revealTo(uid); tpgLog(uid, "saw their cards"); }
      return null;
    }
    if (m.type === "pack") { packPlayer(uid, "packed"); return null; }
    if (H.side) {
      if (m.type === "sideyes" || m.type === "sideno") {
        if (uid !== H.side.to) return "That sideshow wasn't asked of you";
        resolveSide(m.type === "sideyes");
        return null;
      }
      return `Waiting for ${nameOf(H.side.to)} to answer the sideshow`;
    }
    if (H.turn !== uid) return `It's ${nameOf(H.turn)}'s turn`;
    const blindLocked = !p.seen && p.blindTurns >= T.settings.blindRounds;
    if (blindLocked && m.type !== "pack") return `Blind is over after ${T.settings.blindRounds} rounds. See your cards first.`;
    const unit = () => (p.seen ? 2 : 1) * H.stake;
    if (m.type === "chaal" || m.type === "raise") {
      if (m.type === "raise") H.stake *= 2;
      const amt = unit();
      pay(uid, amt);
      if (!p.seen) p.blindTurns++;
      tpgLog(uid, (p.seen ? (m.type === "raise" ? "raised, chaal " : "chaal ") : (m.type === "raise" ? "raised blind " : "blind ")) + rupee(amt));
      if (T.settings.potLimit > 0 && H.pot >= T.settings.potLimit) { showdown(tpgActive(), "Pot limit reached"); return null; }
      H.turn = nextActive(uid);
      return null;
    }
    if (m.type === "show") {
      const act = tpgActive();
      if (act.length !== 2) return "A show is only allowed when two players are left";
      const amt = unit();
      pay(uid, amt);
      tpgLog(uid, `asked for a show (${rupee(amt)})`);
      showdown(act, "Show");
      return null;
    }
    if (m.type === "sideshow") {
      if (!p.seen) return "See your cards before asking for a sideshow";
      if (VAR(H.variant).split === "highlow") return "There are no sideshows in High-Low";
      if (tpgActive().length < 3) return "With two players left, ask for a show instead";
      const to = prevActive(uid);
      if (!H.p[to].seen) return `${nameOf(to)} is still blind, so they can't be asked for a sideshow`;
      const amt = unit();
      pay(uid, amt);
      H.side = { from: uid, to };
      tpgLog(uid, `asked ${nameOf(to)} for a sideshow (${rupee(amt)})`);
      return null;
    }
    return "That move isn't recognised";
  }

  function packPlayer(uid, verb) {
    const H = T.hand;
    H.p[uid].out = true;
    tpgLog(uid, verb);
    const wasTurn = H.turn === uid;
    if (H.side && (H.side.from === uid || H.side.to === uid)) {
      const from = H.side.from;
      H.side = null;
      if (from !== uid) H.turn = nextActive(from);
    }
    const act = tpgActive();
    if (act.length === 1) { finish(act, "Everyone else packed", []); return; }
    if (wasTurn) H.turn = nextActive(uid);
  }

  function resolveSide(accept) {
    const H = T.hand, { from, to } = H.side;
    H.side = null;
    if (!accept) { tpgLog(to, `declined ${nameOf(from)}'s sideshow`); H.turn = nextActive(from); return; }
    const c = cmpHands(SEC.hands[from], SEC.hands[to], H.variant, H.joker);
    const loser = c > 0 ? to : from;      // on a tie, the one who asked packs
    writeHand(from, { peek: { name: nameOf(to), cards: SEC.hands[to] } });
    writeHand(to, { peek: { name: nameOf(from), cards: SEC.hands[from] } });
    H.p[loser].out = true;
    tpgLog(null, `Sideshow between ${nameOf(from)} and ${nameOf(to)}: ${nameOf(loser)} packs`);
    const act = tpgActive();
    if (act.length === 1) { finish(act, "Won the sideshow", []); return; }
    H.turn = nextActive(from);
  }

  function showdown(uids, reason) {
    const H = T.hand;
    const rank = (dir) => {
      let best = [uids[0]];
      for (const u of uids.slice(1)) {
        const c = dir * cmpHands(SEC.hands[u], SEC.hands[best[0]], H.variant, H.joker);
        if (c > 0) best = [u]; else if (c === 0) best.push(u);
      }
      return best;
    };
    const high = rank(1);
    if (VAR(H.variant).split === "highlow" && uids.length > 1) {
      // half the pot to the best hand, half to the worst (odd rupee goes to the high side)
      const low = rank(-1), won = {};
      const give = (list, amt) => { const sh = Math.floor(amt / list.length); list.forEach((u, i) => { won[u] = (won[u] || 0) + sh + (i === 0 ? amt - sh * list.length : 0); }); };
      give(high, H.pot - Math.floor(H.pot / 2));
      give(low, Math.floor(H.pot / 2));
      finish([...new Set(high.concat(low))], reason, uids, won, { high, low });
      return;
    }
    finish(high, reason, uids);
  }

  function finish(winners, reason, shownUids, wonIn, hl) {
    const H = T.hand;
    const share = Math.floor(H.pot / winners.length);
    const won = wonIn || {};
    if (!wonIn) winners.forEach((w, i) => { won[w] = share + (i === 0 ? H.pot - share * winners.length : 0); });
    Object.keys(H.p).forEach((u) => {
      const net = (won[u] || 0) - H.p[u].put;
      H.p[u].net = net;
      T.scores[u] = (T.scores[u] || 0) + net;
    });
    const shown = {};
    shownUids.forEach((u) => { shown[u] = { cards: SEC.hands[u], label: labelOf(SEC.hands[u], H.variant, H.joker) }; });
    H.result = { winners, reason, pot: H.pot, shown, won, hl: hl || null };
    H.turn = null; H.side = null;
    tpgLog(null, `${winners.map(nameOf).join(" & ")} ${winners.length > 1 ? "split" : "won"} the ${rupee(H.pot)} pot. ${reason}.`);
    // the hand is over: let everyone see what they were holding
    H.order.forEach((u) => writeHand(u, { n: H.n, cards: SEC.hands[u] }));
  }

  // ---- screen ----
  function viewPlay() {
    let h = `<section class="tpg">`;
    if (!user) {
      return h + `<div class="card tpjoin"><div><b>Play Teen Patti online</b><small>Everyone plays on their own phone and only you see your cards. Sign in with Google so the table knows it's you.</small></div><button class="btn brass" data-act="signin">Sign in to play</button></div></section>`;
    }
    const dealer = isDealer();
    const t = T || tpgDefaults();
    const H = t.hand;
    const seated = t.seats.find((s) => s.uid === user.uid);
    if (!dealer && (!t.hostAlive || Date.now() - t.hostAlive > 70000)) {
      h += `<div class="check warn"><b>The dealer is offline.</b> The host's phone needs Chip Bank open for the game to run.</div>`;
    }
    if (dealer) h += hostControls(t);
    if (!seated) {
      const guess = cleanName((me && me.name) || (user.displayName || "").split(" ")[0]);
      h += `<form class="card tpjoin" id="tpgJoinForm" autocomplete="off"><div><b>Take a seat</b><small>${H && !H.result ? "You'll be dealt in from the next hand." : "Pick the name everyone knows you by."}</small></div>
        <div class="addrow"><input type="text" id="tpgName" placeholder="Your name" aria-label="Your name" value="${esc(guess)}" list="tpRoster3" enterkeyhint="go">
        <datalist id="tpRoster3">${DEFAULT_ROSTER.slice().sort(byName).map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>
        <button class="btn brass" type="submit" ${myPending ? "disabled" : ""}>Sit down</button></div></form>`;
    }

    if (H) {
      const R = H.result;
      h += tableHTML(t, H);
      if (R) h += resultHTML(H, R);
      if (H.p[user.uid]) h += myArea(t, H);
      h += `<details class="history" ${R ? "" : "open"}><summary>What happened</summary>` + H.log.slice().reverse().slice(0, 14).map((l) =>
        `<div class="hgame"><span class="num">${fmtTime(l.t)}</span> · ${l.who ? `<b>${esc(l.who)}</b> ` : ""}${esc(l.text)}</div>`).join("") + `</details>`;
    } else if (t.seats.length) {
      h += tableHTML(t, null);
    }

    if (t.seats.length) {
      h += `<div class="card"><div class="cardhead"><b>Points this session</b><span>${t.seats.length} seated</span></div>` +
        t.seats.slice().sort((a, b) => (t.scores[b.uid] || 0) - (t.scores[a.uid] || 0)).map((s) => {
          const v = t.scores[s.uid] || 0;
          return `<div class="lrow"><div class="lname"><b>${esc(s.name)}${s.uid === user.uid ? ` <span class="tag">You</span>` : ""}</b></div>
            <span class="pamt num ${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : v < 0 ? "−" : ""}${rupee(Math.abs(v))}</span>
            ${dealer && (!H || H.result) ? `<button class="x" data-act="tpgkick" data-id="${esc(s.uid)}" aria-label="Remove ${esc(s.name)}">×</button>` : ""}</div>`;
        }).join("") + `</div>`;
      if (seated && (!H || H.result || !H.p[user.uid] || H.p[user.uid].out)) h += `<button class="linkbtn center" data-act="tpgleave">Leave the table</button>`;
    }
    return h + `</section>`;
  }

  // The table: an oval with everyone seated in playing order, clockwise, and you at the bottom.
  const miniCard = (c) => `<span class="mc ${c.s === "H" || c.s === "D" ? "red" : ""}">${rn(c.r)}<i>${SUIT[c.s]}</i></span>`;
  function tableHTML(t, H) {
    const R = H && H.result;
    let seats = t.seats.map((x) => x.uid);
    const mine = user ? seats.indexOf(user.uid) : -1;
    if (mine > 0) seats = seats.slice(mine).concat(seats.slice(0, mine));
    else if (mine < 0 && H) { const f = seats.indexOf(H.order[0]); if (f > 0) seats = seats.slice(f).concat(seats.slice(0, f)); }
    const n = seats.length;
    const dealerUid = t.seats[t.dealer] ? t.seats[t.dealer].uid : null;
    const seatHTML = seats.map((u, i) => {
      const ang = (90 + (i * 360) / n) * Math.PI / 180;
      const x = 50 + 41 * Math.cos(ang), y = 50 + 41 * Math.sin(ang);
      const p = H && H.p[u];
      const turn = H && !R && H.turn === u;
      const won = R && R.winners.includes(u);
      const shown = R && R.shown && R.shown[u];
      const status = !H ? "" : !p ? "Next hand" : p.out ? "Packed" : p.seen ? "Seen" : "Blind";
      const money = !p ? "" : R ? `${p.net >= 0 ? "+" : "−"}${rupee(Math.abs(p.net))}` : rupee(p.put);
      const back = `<span class="mc back"></span>`;
      const per = cardsPer(H ? H.variant : "classic");
      const minis = shown ? shown.cards.map(parseCard).map(miniCard).join("")
        : p && !p.out ? (H.open && H.open[u] ? miniCard(parseCard(H.open[u])) + back.repeat(per - 1) : back.repeat(per)) : "";
      const nm = nameOf(u);
      return `<div class="seat ${turn ? "turn" : ""} ${p && p.out ? "out" : ""} ${won ? "won" : ""} ${user && u === user.uid ? "me" : ""} ${H && !p ? "waiting" : ""}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%">
        <div class="minis">${minis}</div>
        <div class="av">${esc((nm[0] || "?").toUpperCase())}${u === dealerUid ? `<i class="dpuck" title="Dealer">D</i>` : ""}</div>
        <div class="lbl"><b>${esc(nm)}</b>${status || money ? `<small class="num">${[status, money].filter(Boolean).join(" · ")}</small>` : ""}</div>
      </div>`;
    }).join("");
    let center;
    if (H) {
      const last = H.side ? `${nameOf(H.side.from)} asked ${nameOf(H.side.to)} for a sideshow`
        : R ? `${R.winners.map(nameOf).join(" & ")} ${R.winners.length > 1 ? "split" : "won"} the pot`
        : H.log.length ? `${H.log[H.log.length - 1].who ? H.log[H.log.length - 1].who + " " : ""}${H.log[H.log.length - 1].text}` : "";
      const jc = H.joker ? parseCard(H.joker) : null;
      center = `${jc ? `<div class="jokercard">${cardHTML(jc, false, 0, false)}<span>Joker · every ${rn(jc.r)}</span></div>` : ""}
        <span class="k">Pot</span><b class="num">${rupee(H.pot)}</b>
        <small class="num">Blind ${rupee(H.stake)} · Chaal ${rupee(H.stake * 2)}</small>
        ${H.variant !== "classic" ? `<small class="vname">${esc(VAR(H.variant).name)}${VAR(H.variant).low ? " · lowest wins" : ""}</small>` : ""}
        ${!R && H.turn ? `<span class="turnline">${user && H.turn === user.uid ? "Your turn" : esc(nameOf(H.turn)) + "'s turn"}</span>` : ""}
        ${last ? `<em>${esc(last)}</em>` : ""}`;
    } else {
      center = `<b class="lobby">${n} seated</b><small>${isDealer() ? (n < 2 ? "Waiting for players to sit down" : "Deal when everyone is in") : "Waiting for the host to deal"}</small>`;
    }
    return `<div class="felt ${n > 9 ? "crowd" : ""}" role="img" aria-label="Card table with ${n} players">
      <div class="rail"></div><div class="center">${center}</div>${seatHTML}</div>`;
  }

  function myArea(t, H) {
    const p = H.p[user.uid];
    const R = H.result;
    const mine = myHand && myHand.n === H.n && myHand.cards ? myHand.cards.map(parseCard) : null;
    const ev = mine ? handEval(myHand.cards, H.variant, H.joker) : null;
    const wild = ev ? ev.wild : null;
    const per = cardsPer(H.variant);
    const openCard = H.open && H.open[user.uid] ? parseCard(H.open[user.uid]) : null;
    const busy = myPending ? "disabled" : "";
    let h = `<div class="card myhand ${H.turn === user.uid && !R ? "myturn" : ""}">

        : (openCard ? cardHTML(openCard, false, 0, false) : backHTML()) + backHTML().repeat(per - 1)}</div>`;
    if (myHand && myHand.n === H.n && myHand.peek) {
      const pc = myHand.peek.cards.map(parseCard), pw = handEval(myHand.peek.cards, H.variant, H.joker).wild;
      h += `<div class="peek"><small>Sideshow: ${esc(myHand.peek.name)} had ${esc(labelOf(myHand.peek.cards, H.variant, H.joker))}</small><div class="tpcards">${pc.map((c, k) => cardHTML(c, pw[k], 0, false)).join("")}</div></div>`;
    }

    if (!R && !p.out) {
      if (!p.seen) acts += `<button class="btn ghost" data-act="tpgsee" ${busy}>See cards</button>`;
      if (H.side && H.side.to === user.uid) {

          <div class="sharegrid"><button class="btn brass" data-act="tpgsideyes" ${busy}>Accept</button><button class="btn ghost" data-act="tpgsideno" ${busy}>Decline</button></div>`;
      } else if (H.side && H.side.from === user.uid) {
        acts += `<p class="sheetnote">Waiting for ${esc(nameOf(H.side.to))} to answer your sideshow…</p>`;
      } else if (H.turn === user.uid && !H.side) {
        const blindLocked = !p.seen && p.blindTurns >= t.settings.blindRounds;
        const unit = (p.seen ? 2 : 1) * H.stake;
        const left = H.order.filter((u) => !H.p[u].out).length;
        if (blindLocked) {
          acts += `<p class="sheetnote">Your ${t.settings.blindRounds} blind rounds are done. See your cards to keep playing.</p>`;
        } else {
          acts += `<div class="sharegrid">
            <button class="btn brass" data-act="tpgchaal" ${busy}>${p.seen ? "Chaal" : "Blind"} ${rupee(unit)}</button>
            <button class="btn amber" data-act="tpgraise" ${busy}>Raise ${rupee(unit * 2)}</button></div>`;
          if (left === 2) acts += `<button class="btn ghost" data-act="tpgshow" ${busy}>Show ${rupee(unit)}</button>`;
          if (p.seen && left >= 3 && VAR(H.variant).split !== "highlow") {
            const prev = (() => { const o = H.order, i = o.indexOf(user.uid); for (let k = 1; k < o.length; k++) { const u = o[(i - k + o.length) % o.length]; if (!H.p[u].out) return u; } return null; })();
            const ok = prev && H.p[prev].seen;
            acts += `<button class="btn ghost" data-act="tpgside" ${busy} ${ok ? "" : "disabled"}>Sideshow with ${esc(nameOf(prev))} ${rupee(unit)}${ok ? "" : " (still blind)"}</button>`;
          }
        }
        acts = `<p class="yourturn">Your turn</p>` + acts;
      } else {
        acts += `<p class="sheetnote">Waiting for ${esc(nameOf(H.turn))}…</p>`;
      }
      acts += `<button class="linkbtn danger" data-act="tpgpack" ${busy}>${armed === "tpgpack" ? "Tap again to pack" : "Pack"}</button>`;
    }
    return h + (acts ? `<div class="tpgacts">${acts}</div>` : "") + `</div>`;
  }

  function resultHTML(H, R) {
    const lbl = (u) => (R.shown && R.shown[u] ? R.shown[u].label : "");
    const banner = R.hl
      ? `<div class="winbanner"><span>High-Low · ${rupee(R.pot)} pot split · ${esc(R.reason)}</span>

  }

  function hostControls(t) {
    const H = t.hand;
    const between = !H || H.result;

        ${between && Object.keys(t.scores || {}).length ? `<button class="linkbtn" data-act="tpgreset">${armed === "tpgreset" ? "Tap again to reset everyone's points" : "Reset points"}</button>` : ""}

  function tpgSetting(id, val) {
    if (!isDealer()) return;
    if (!T) T = tpgDefaults();
    if (T.hand && !T.hand.result) return;
    const s = T.settings;
    if (id === "tpgBoot") { const v = Math.round(Number(val)); if (v > 0) s.boot = v; else return; }
    if (id === "tpgBlind") { const v = Math.round(Number(val)); if (v >= 0 && v <= 10) s.blindRounds = v; else return; }
    if (id === "tpgLimit") { const v = Math.round(Number(val)) || 0; s.potLimit = Math.max(0, v); }
    if (id === "tpgVariant") s.variant = val;
    commitT();
  }
